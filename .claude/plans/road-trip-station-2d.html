<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Road Trip Station</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root { --panel: rgba(255,255,255,.88); --ink: #1f2a33; --line: rgba(31,42,51,.14); --on: #ff8a3d; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #a9c98a; font-family: "Noto Sans Thai", system-ui, sans-serif; color: var(--ink); }
  canvas { display: block; width: 100vw; height: 100vh; }
  #ui { position: fixed; left: 12px; top: 12px; display: flex; gap: 5px; background: var(--panel); padding: 5px; border-radius: 10px; border: 1px solid var(--line); }
  button { font: inherit; font-size: 13px; border: 1px solid var(--line); background: #fff; color: var(--ink); border-radius: 7px; padding: 4px 9px; cursor: pointer; }
  button.on { background: var(--on); color: #fff; border-color: var(--on); }
  #tip { position: fixed; pointer-events: none; padding: 3px 9px; border-radius: 8px; background: rgba(31,42,51,.9); color: #fff; font-size: 13px; font-weight: 700; transform: translate(14px, 10px); display: none; white-space: nowrap; }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="ui"></div>
<div id="tip"></div>
<script>
// ============================================================
//  ต้นแบบปั๊มน้ำมันแบบ 2D (มุมกระดานเอียงแบบเกม) — โหมด Road Trip · GRID_PLAN §8.8
//  เดินอิสระ ไม่จำกัดระยะ (คลิกช่องไหนก็ได้ · คลิกกิจกรรม = เดินไปแล้วเล่น)
// ============================================================
const cv = document.getElementById("cv"), g = cv.getContext("2d");
const LW = 1280, LH = 720, BC = 24, BR = 16, TAU = Math.PI * 2;
let PITCH = 38 * Math.PI / 180, SN = Math.sin(PITCH), CS = Math.cos(PITCH);
const D = 30, F = 1150, OX = 640, OY = 455;
function P(x, y, z = 0) { // กระดาน (x ช่อง, y แถว, z สูง) → จอ
  const X = x - BC / 2, Y = y - BR / 2, depth = D - Y * CS - z * SN, s = F / depth;
  return [OX + X * s, OY + (Y * SN - z * CS) * s, s];
}
let view = { k: 1, tx: 0, ty: 0 }, DPR = 1;
function resize() { DPR = Math.min(devicePixelRatio, 2); cv.width = innerWidth * DPR; cv.height = innerHeight * DPR; }
addEventListener("resize", resize); resize();
function baseScale() { return Math.min(cv.width / LW, cv.height / LH); }
function setXf() { const b = baseScale() * view.k; g.setTransform(b, 0, 0, b, (cv.width - LW * b) / 2 + view.tx * DPR, (cv.height - LH * b) / 2 + view.ty * DPR); }
function toLogical(cx, cy) { const b = baseScale() * view.k; return [(cx * DPR - (cv.width - LW * b) / 2 - view.tx * DPR) / b, (cy * DPR - (cv.height - LH * b) / 2 - view.ty * DPR) / b]; }
function unproject(sx, sy) { // จอ → พื้นกระดาน (z=0) — ค้นแบบ Newton สั้น ๆ
  let x = BC / 2, y = BR / 2;
  for (let i = 0; i < 30; i++) { const [px, py] = P(x, y), [ax, ay] = P(x + 0.01, y), [bx, by] = P(x, y + 0.01);
    const j11 = (ax - px) / 0.01, j12 = (bx - px) / 0.01, j21 = (ay - py) / 0.01, j22 = (by - py) / 0.01, det = j11 * j22 - j12 * j21, ex = sx - px, ey = sy - py;
    x += (j22 * ex - j12 * ey) / det; y += (-j21 * ex + j11 * ey) / det; }
  return [x, y];
}

// ---------- วาดพื้นฐาน
const shade = (hex, f) => { const n = parseInt(hex.slice(1), 16); let r = n >> 16, gg = (n >> 8) & 255, b = n & 255; r = Math.min(255, r * f); gg = Math.min(255, gg * f); b = Math.min(255, b * f); return `rgb(${r | 0},${gg | 0},${b | 0})`; };
function poly(pts, fill, stroke) { g.beginPath(); pts.forEach(([x, y], i) => (i ? g.lineTo(x, y) : g.moveTo(x, y))); g.closePath(); if (fill) { g.fillStyle = fill; g.fill(); } if (stroke) { g.strokeStyle = stroke; g.lineWidth = 1.2; g.stroke(); } }
// กล่อง 2.5D: หน้าบนสว่าง · หน้าหันกล้องกลาง · ข้างเข้ม
function boxD(x0, y0, x1, y1, z0, z1, col, o = {}) {
  const c = BC / 2, top = o.top || shade(col, 1.12), front = o.front || col, side = o.side || shade(col, 0.78), ln = o.line === false ? null : "rgba(30,30,40,.25)";
  if (x0 > c) poly([P(x0, y0, z0), P(x0, y1, z0), P(x0, y1, z1), P(x0, y0, z1)], side, ln);
  if (x1 < c) poly([P(x1, y0, z0), P(x1, y1, z0), P(x1, y1, z1), P(x1, y0, z1)], side, ln);
  poly([P(x0, y1, z0), P(x1, y1, z0), P(x1, y1, z1), P(x0, y1, z1)], front, ln);
  if (!o.noTop) poly([P(x0, y0, z1), P(x1, y0, z1), P(x1, y1, z1), P(x0, y1, z1)], top, ln);
}
// สี่เหลี่ยมบนหน้าหันกล้อง (y = yf) — ใช้วาดประตู หน้าต่าง ป้าย
function faceRect(x0, x1, yf, z0, z1, fill) { poly([P(x0, yf + 0.002, z0), P(x1, yf + 0.002, z0), P(x1, yf + 0.002, z1), P(x0, yf + 0.002, z1)], fill); }
function faceText(txt, x0, x1, yf, z0, z1, bg, fg = "#fff") {
  faceRect(x0, x1, yf, z0, z1, bg);
  const [ax, ay, s] = P((x0 + x1) / 2, yf + 0.003, (z0 + z1) / 2);
  g.fillStyle = fg; g.font = `800 ${Math.round((z1 - z0) * s * 0.62)}px "Noto Sans Thai", sans-serif`; g.textAlign = "center"; g.textBaseline = "middle"; g.fillText(txt, ax, ay + 1);
}
function ellipseAt(x, y, z, rx, ry, fill) { const [sx, sy, s] = P(x, y, z); g.beginPath(); g.ellipse(sx, sy, rx * s, ry * s * SN, 0, 0, TAU); g.fillStyle = fill; g.fill(); }
function shadowAt(x, y, r) { ellipseAt(x, y, 0, r, r, night ? "rgba(0,8,30,.35)" : "rgba(40,50,40,.22)"); }
function post(x, y, h, w, col) { const [ax, ay, s] = P(x, y, 0), [, by] = P(x, y, h); g.fillStyle = col; g.fillRect(ax - w * s / 2, by, w * s, ay - by); g.fillStyle = "rgba(0,0,0,.18)"; g.fillRect(ax, by, w * s / 2, ay - by); }
function ball(x, y, z, r, col) { const [sx, sy, s] = P(x, y, z); const gr = g.createRadialGradient(sx - r * s * 0.35, sy - r * s * 0.35, r * s * 0.1, sx, sy, r * s); gr.addColorStop(0, shade(col, 1.35)); gr.addColorStop(1, shade(col, 0.8)); g.fillStyle = gr; g.beginPath(); g.arc(sx, sy, r * s, 0, TAU); g.fill(); }

// ---------- เสียง (สังเคราะห์สั้น ๆ)
let ac = null, sfxBus, noiseBuf;
function initAudio() { if (ac) return; ac = new AudioContext(); sfxBus = ac.createGain(); sfxBus.gain.value = 0.7; sfxBus.connect(ac.destination); noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate); const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }
function env(gn, t, a, v, d) { gn.gain.setValueAtTime(0.0001, t); gn.gain.exponentialRampToValueAtTime(v, t + a); gn.gain.exponentialRampToValueAtTime(0.0001, t + a + d); }
function tone(type, f, t, d, v, o = {}) { const os = ac.createOscillator(), gn = ac.createGain(); os.type = type; os.frequency.setValueAtTime(f, t); if (o.to) os.frequency.exponentialRampToValueAtTime(o.to, t + d); env(gn, t, 0.005, v, d); os.connect(gn).connect(sfxBus); os.start(t); os.stop(t + d + 0.05); }
function noise(t, d, v, type, f) { const s = ac.createBufferSource(), fl = ac.createBiquadFilter(), gn = ac.createGain(); s.buffer = noiseBuf; fl.type = type; fl.frequency.value = f; env(gn, t, 0.003, v, d); s.connect(fl).connect(gn).connect(sfxBus); s.start(t); s.stop(t + d + 0.05); }
const mtof = (m) => 440 * 2 ** ((m - 69) / 12);
function sfx(n) { initAudio(); const t = ac.currentTime; ({
  pop: () => { noise(t, 0.1, 0.25, "lowpass", 500); tone("sine", 2200, t + 0.05, 0.1, 0.05); },
  ding: () => { tone("sine", 1320, t, 0.3, 0.08); tone("sine", 990, t + 0.25, 0.4, 0.08); },
  creak: () => tone("sawtooth", 260, t, 0.5, 0.04, { to: 170 }),
  whoosh: () => noise(t, 0.7, 0.2, "bandpass", 900),
  clank: () => { tone("square", 880, t, 0.1, 0.05); tone("square", 1320, t + 0.05, 0.1, 0.04); },
  boing: () => { tone("sine", 300, t, 0.15, 0.15, { to: 700 }); tone("sine", 700, t + 0.15, 0.25, 0.12, { to: 300 }); },
  game: () => [72, 76, 79, 84, 79, 84, 88].forEach((m, i) => tone("square", mtof(m), t + i * 0.09, 0.08, 0.05)),
  sing: () => [67, 69, 71, 74, 71, 69, 67, 64].forEach((m, i) => tone("triangle", mtof(m), t + i * 0.3, 0.28, 0.08)),
  sizzle: () => noise(t, 1.4, 0.05, "highpass", 3500),
  zoom: () => tone("sine", 900, t, 0.25, 0.05, { to: 1500 }),
  splash: () => noise(t, 0.4, 0.15, "bandpass", 2400),
  step: () => noise(t, 0.03, 0.05, "lowpass", 900),
})[n](); }

// ---------- สถานะ
let night = false, showGrid = true, showLabels = true;
const parts = []; // อนุภาคลอย
function emit(o) { parts.push({ life: 1, dur: 1, vx: 0, vy: 0, vz: 1, ...o, t: 0 }); }
const blocked = new Set(), K = (x, y) => x + "," + y;
const objs = [];
function obj(o) { objs.push(o); if (o.block) for (let x = Math.floor(o.x0); x < Math.ceil(o.x1); x++) for (let y = Math.floor(o.y0); y < Math.ceil(o.y1); y++) blocked.add(K(x, y)); return o; }
const T = { door: 0, roller: 1, wash: 0, karaoke: 0, crystal: 0, spicy: 0, fish: 0, dog: 0, arcade: 0, claw: 0, wc: 0, ferris: 0.25, fill: [0, 0, 0, 0] };
let now = 0;

// ---------- รถตู้ (จอดใต้หลังคาปั๊ม)
obj({ name: "รถตู้", x0: 9.5, y0: 11.15, x1: 13.6, y1: 12.85, block: true, draw() {
  shadowAt(11.55, 12.0, 2.2);
  for (const x of [10.3, 12.8]) ellipseAt(x, 12.86, 0.28, 0.32, 0.32, "#1e1f22");
  boxD(9.5, 11.15, 13.6, 12.85, 0.25, 0.95, "#7fb8d8");
  boxD(9.5, 11.15, 13.6, 12.85, 0.95, 1.75, "#f6efe0", { top: "#fbf6ea" });
  faceRect(9.5, 13.6, 12.85, 0.93, 0.98, "#d9dde2");
  for (const [a, b] of [[9.75, 10.7], [10.9, 11.85], [12.05, 12.95]]) faceRect(a, b, 12.85, 1.08, 1.6, "#2f4a5e");
  faceRect(13.15, 13.55, 12.85, 1.08, 1.55, "#2f4a5e");
  for (const x of [10.3, 12.8]) { const [sx, sy, s] = P(x, 12.87, 0.3); g.fillStyle = "#1e1f22"; g.beginPath(); g.arc(sx, sy, 0.3 * s, 0, TAU); g.fill(); g.fillStyle = "#f4f1ea"; g.beginPath(); g.arc(sx, sy, 0.17 * s, 0, TAU); g.fill(); }
  const [hx, hy, s] = P(13.62, 12.4, 0.7); g.fillStyle = night ? "#fff6c8" : "#fff2d0"; g.beginPath(); g.arc(hx, hy, 0.09 * s, 0, TAU); g.fill();
} });

// ---------- หลังคาปั๊ม (วาดทับทีหลังสุด โปร่ง) + ตู้น้ำมัน
const pumps = [[8.4, 9.8], [9.6, 9.8], [13.4, 9.8], [14.6, 9.8]];
for (const [x0, x1] of [[7.9, 10.1], [12.9, 15.1]]) obj({ x0, y0: 9.45, x1, y1: 10.15, draw() { boxD(x0, 9.45, x1, 10.15, 0, 0.12, "#d9d4c8"); } });
pumps.forEach(([x, y], i) => obj({ name: "ตู้น้ำมัน", x0: x - 0.3, y0: y - 0.25, x1: x + 0.3, y1: y + 0.25, block: true, spot: [Math.floor(x), 10], draw() {
  boxD(x - 0.3, y - 0.25, x + 0.3, y + 0.25, 0.12, 1.25, "#f7f5f0");
  boxD(x - 0.31, y - 0.26, x + 0.31, y + 0.26, 1.25, 1.45, "#ff8a3d");
  const [sx, sy, s] = P(x, y + 0.255, 0.95); g.fillStyle = "#0b1410"; g.fillRect(sx - 0.22 * s, sy - 0.12 * s, 0.44 * s, 0.22 * s);
  g.fillStyle = "#7dffcf"; g.font = `800 ${0.14 * s}px monospace`; g.textAlign = "center"; g.textBaseline = "middle"; g.fillText(T.fill[i].toFixed(1), sx, sy);
  g.strokeStyle = "#2d333b"; g.lineWidth = 0.05 * s; g.beginPath(); const [ax, ay] = P(x - 0.2, y + 0.26, 0.75), [bx, by] = P(x - 0.35, y + 0.4, 0.35); g.moveTo(ax, ay); g.quadraticCurveTo(bx, ay, bx, by); g.stroke();
}, act() { const st = { i }; T.fill[i] = 0; sfx("pop"); anims.push({ dur: 2.2, fn: (k) => (T.fill[i] = k * 60), end: () => { sfx("ding"); emit({ x, y: y + 0.4, z: 1.8, text: "⛽", vz: 0.8, dur: 1.4 }); } }); } }));
const pillars = [[7.6, 9.0], [15.4, 9.0], [7.6, 13.0], [15.4, 13.0]];
pillars.forEach(([x, y]) => obj({ x0: x - 0.2, y0: y - 0.2, x1: x + 0.2, y1: y + 0.2, block: true, draw() { post(x, y, 2.6, 0.32, "#f7f5f0"); } }));
function drawCanopy() {
  const a = THREE_clamp(1.15 - view.k * 0.35, 0.25, 0.75);
  g.save(); g.globalAlpha = a;
  boxD(7.2, 8.6, 15.8, 13.4, 2.6, 2.85, "#f7f5f0", { top: "#fbfaf6" });
  faceRect(7.2, 15.8, 13.4, 2.6, 2.85, "#ff8a3d");
  g.restore();
  faceText("⛽ ECHO", 10.2, 12.8, 13.401, 2.6, 2.85, "#ff8a3d");
  if (night) { const fl = Math.sin(now * 23) > 0.85 || Math.sin(now * 7.1) > 0.97 ? 0.25 : 1; for (const x of [9, 11.5, 14]) for (const y of [10, 12]) glow(x, y, 0.5, 2.2, `rgba(255,240,200,${0.35 * fl})`); }
}
const THREE_clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function glow(x, y, z, r, col) { const [sx, sy, s] = P(x, y, z); const gr = g.createRadialGradient(sx, sy, 0, sx, sy, r * s); gr.addColorStop(0, col); gr.addColorStop(1, "rgba(0,0,0,0)"); g.fillStyle = gr; g.beginPath(); g.arc(sx, sy, r * s, 0, TAU); g.fill(); }

// ---------- มินิมาร์ท
obj({ name: "มินิมาร์ท", x0: 0.3, y0: 0.3, x1: 6.7, y1: 4.6, block: true, spot: [4, 5], draw() {
  boxD(0.3, 0.3, 6.7, 4.6, 0, 2.3, "#f3efe6");
  boxD(0.25, 0.25, 6.75, 4.65, 2.3, 2.75, "#3fae7a");
  faceText("มินิมาร์ท 24", 1.4, 5.6, 4.651, 2.33, 2.72, "#3fae7a");
  faceRect(0.6, 3.8, 4.6, 0.1, 1.8, night ? "#ffe9a8" : "#9fd3f0");
  for (let k = 0; k < 5; k++) faceRect(0.75 + k * 0.62, 1.2 + k * 0.62, 4.6, 0.1, 0.9 + (k % 2) * 0.3, ["#d9534f", "#f2c94c", "#5aa0e0", "#3fae7a", "#ff8a3d"][k]);
  if (night) { const [sx, sy, s] = P(2.2, 4.6, 1.15 + Math.sin(now * 1.5) * 0.08); g.globalAlpha = 0.55 + Math.sin(now * 3) * 0.25; g.fillStyle = "#f0f6ff"; g.beginPath(); g.arc(sx, sy, 0.32 * s, Math.PI, 0); g.lineTo(sx + 0.32 * s, sy + 0.5 * s); for (let k = 0; k < 4; k++) g.lineTo(sx + (0.24 - k * 0.16) * s, sy + (k % 2 ? 0.5 : 0.38) * s); g.lineTo(sx - 0.32 * s, sy + 0.5 * s); g.fill(); g.fillStyle = "#1f2a33"; g.beginPath(); g.arc(sx - 0.1 * s, sy, 0.05 * s, 0, TAU); g.arc(sx + 0.1 * s, sy, 0.05 * s, 0, TAU); g.fill(); g.globalAlpha = 1; }
  faceRect(4.2, 5.4, 4.6, 0.05, 1.9, "#2d333b");
  faceRect(4.25 + T.door * 1.1, 5.35 + T.door * 1.1, 4.601, 0.05, 1.85, night ? "#ffe9a8" : "#b8e2f6");
  for (let k = 0; k < 8; k++) { const [a] = P(0.3 + k * 0.8, 4.65, 2.3), [b, by, s] = P(1.1 + k * 0.8, 5.05, 2.0); g.fillStyle = k % 2 ? "#3fae7a" : "#ffffff"; poly([P(0.3 + k * 0.8, 4.65, 2.3), P(1.1 + k * 0.8, 4.65, 2.3), P(1.1 + k * 0.8, 5.1, 2.0), P(0.3 + k * 0.8, 5.1, 2.0)], k % 2 ? "#3fae7a" : "#ffffff"); }
}, act() { T.door = 1; sfx("ding"); setTimeout(() => (T.door = 0), 2200); } });

// ---------- อู่ซ่อมรถ
obj({ name: "อู่ซ่อมรถ", x0: 17.3, y0: 0.3, x1: 23.7, y1: 4.6, block: true, spot: [19, 5], draw() {
  boxD(17.3, 0.3, 23.7, 4.6, 0, 2.6, "#8a9199");
  faceText("อู่ · อัปเกรด", 18.3, 22.7, 4.601, 2.1, 2.5, "#2d333b");
  faceRect(17.9, 21.4, 4.6, 0, 1.9, "#14181d");
  const h = 1.9 * T.roller; for (let k = 0; k < 12; k++) { const z1 = 1.9 - k * 0.16; if (z1 - 0.16 < 1.9 - h) break; faceRect(17.9, 21.4, 4.601, Math.max(1.9 - h, z1 - 0.16), z1, k % 2 ? "#aab3bc" : "#c9d0d6"); }
  for (let k = 0; k < 3; k++) ellipseAt(22.6, 5.0, 0.12 + k * 0.22, 0.38, 0.38, "#1e1f22");
  boxD(21.8, 4.75, 22.2, 5.05, 0, 0.55, "#d8453b");
}, act() { T.roller = T.roller > 0.5 ? 0.06 : 1; sfx("creak"); } });

// ---------- ล้างรถ
obj({ name: "ล้างรถ", x0: 19.4, y0: 8.2, x1: 23.6, y1: 12.3, block: true, spot: [18, 10], draw() {
  boxD(19.4, 8.2, 23.6, 8.5, 0, 2.0, "#5aa0e0");
  for (const [x, y] of [[20.4, 9.2], [22.4, 9.2], [20.4, 11.2], [22.4, 11.2]]) {
    const [sx, sy, s] = P(x, y, 0), [, ty] = P(x, y, 1.8);
    for (let k = 0; k < 8; k++) { const ph = now * (T.wash > 0 ? 14 : 0.4) + k; g.fillStyle = Math.sin(ph) > 0 ? "#3fc1c9" : "#ff6fa8"; g.fillRect(sx - 0.32 * s * Math.abs(Math.cos(ph)), ty + k * (sy - ty) / 8, 0.64 * s * Math.abs(Math.cos(ph)), (sy - ty) / 8 - 1); }
  }
  boxD(19.4, 12.0, 23.6, 12.3, 0, 2.0, "#5aa0e0");
  g.save(); g.globalAlpha = 0.85; boxD(19.3, 8.1, 23.7, 12.4, 2.0, 2.25, "#5aa0e0"); g.restore();
  faceText("ล้างรถ", 20.3, 22.7, 12.401, 2.0, 2.25, "#3d7fc0");
}, act() { T.wash = 3.2; sfx("whoosh"); for (let k = 0; k < 26; k++) emit({ x: 20 + Math.random() * 3, y: 8.8 + Math.random() * 3, z: 0.3 + Math.random(), vz: 0.6 + Math.random(), bubble: true, dur: 2 + Math.random() }); } });

// ---------- ห้องน้ำปริศนา
obj({ name: "ห้องน้ำปริศนา", x0: 0.3, y0: 8.3, x1: 2.7, y1: 10.7, block: true, spot: [1, 11], draw() {
  boxD(0.3, 8.3, 2.7, 10.7, 0, 2.0, "#f2e9d8");
  boxD(0.2, 8.2, 2.8, 10.8, 2.0, 2.2, "#a26bff");
  faceText("ห้องน้ำ", 0.7, 2.3, 10.801, 2.02, 2.18, "#a26bff");
  faceRect(1.0, 1.9, 10.7, 0, 1.45, T.wc > 0 ? "#1b1426" : "#a26bff");
  if (T.wc > 0) faceRect(1.9, 2.15, 10.7, 0, 1.45, "#8a55e0");

function bfs(sx, sy, tx, ty) {

      prev.set(k, [x, y]); q.push([nx, ny]); } }

  for (const k of ["wash", "karaoke", "crystal", "spicy", "fish", "dog", "arcade"]) T[k] = Math.max(0, T[k] - dt);
  tickAnims(dt);
  if (path.length) { const [tx, ty] = path[0], dx = tx - walker.x, dy = ty - walker.y, L = Math.hypot(dx, dy), st = dt * 6.5;
    if (L <= st) { walker.x = tx; walker.y = ty; path.shift(); sfx && ac && sfx("step"); if (!path.length && pendingAct) { pendingAct(); pendingAct = null; } } else { walker.x += dx / L * st; walker.y += dy / L * st; } }
  g.setTransform(1, 0, 0, 1, 0, 0); g.fillStyle = night ? "#2a3a2c" : "#a9c98a"; g.fillRect(0, 0, cv.width, cv.height);
  setXf();
  drawGround();
  if (hoverTile && !blocked.has(K(...hoverTile))) tileOutline(hoverTile[0], hoverTile[1], "rgba(255,210,122,.45)");
  if (path.length) { const [ex, ey] = path[path.length - 1]; tileOutline(Math.floor(ex), Math.floor(ey), "rgba(255,138,61,.4)"); for (const [px, py] of path) ellipseAt(px, py, 0.02, 0.08, 0.08, "rgba(255,138,61,.8)"); }
  const list = objs.map((o) => ({ y: o.y1, x: (o.x0 + o.x1) / 2, d: () => o.draw(), o })).concat([{ y: walker.y + 0.3, x: walker.x, d: drawWalker }]);
  list.sort((a, b) => a.y - b.y || Math.abs(b.x - BC / 2) - Math.abs(a.x - BC / 2));
  for (const it of list) { if (it.o && it.o === hoverObj) { g.save(); g.shadowColor = "#ffd27a"; g.shadowBlur = 18; it.d(); g.restore(); } else it.d(); }
  drawCanopy();
  drawParts(dt);
  if (night) { g.save(); g.globalCompositeOperation = "multiply"; g.fillStyle = "#3a4a7a"; g.fillRect(-2000, -2000, 6000, 6000); g.restore();
    g.save(); g.globalCompositeOperation = "lighter"; glow(3.5, 5.0, 1.0, 3, "rgba(255,220,140,.25)"); glow(11.5, 11, 2.4, 6, "rgba(255,240,200,.18)"); glow(21.5, 13.6, 3.5, 2, "rgba(120,255,200,.25)"); glow(15.5, 1, 2.6, 3, "rgba(255,200,240,.18)"); glow(9.5, 3.45, 0.55, 1.2, "rgba(170,110,255,.3)"); g.restore(); }
  if (showLabels) for (const [n, [x, y, z]] of Object.entries(LBL)) drawLabel(n, x, y, z);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// ---------- เมาส์: คลิกช่อง = เดิน · คลิกกิจกรรม = เดินไปแล้วเล่น · ลาก = เลื่อน · ล้อ = ซูม
const tip = document.getElementById("tip");
function pickAt(cx, cy) {
  const [lx, ly] = toLogical(cx, cy); const [bx, by] = unproject(lx, ly);
  // ตรวจวัตถุ: ช่องพื้นที่ใต้เมาส์ หรือ กรอบภาพบนจอ (สูง)
  let hit = null;
  for (const o of objs) { if (!o.name || o.name === "รถตู้") continue;
    if (bx >= o.x0 - 0.1 && bx <= o.x1 + 0.1 && by >= o.y0 - 0.1 && by <= o.y1 + 0.6) { hit = o; break; }
    const lb = LBL[o.name]; if (lb) { const [sx, sy] = P(lb[0], lb[1], lb[2]); if (Math.abs(lx - sx) < 60 && ly > sy - 14 && ly < P(lb[0], lb[1], 0)[1]) { const [ox0] = P(o.x0, o.y1, 0), [ox1] = P(o.x1, o.y1, 0); if (lx > ox0 - 6 && lx < ox1 + 6) hit = o; } } }
  return { hit, tile: bx >= 0 && by >= 0 && bx < BC && by < BR ? [Math.floor(bx), Math.floor(by)] : null };
}
let drag = null;
cv.addEventListener("pointerdown", (e) => { drag = { x: e.clientX, y: e.clientY, tx: view.tx, ty: view.ty, moved: false }; });
addEventListener("pointermove", (e) => {
  if (drag && (e.buttons & 1)) { const dx = e.clientX - drag.x, dy = e.clientY - drag.y; if (Math.hypot(dx, dy) > 5) drag.moved = true; if (drag.moved) { view.tx = drag.tx + dx; view.ty = drag.ty + dy; } }
  const { hit, tile } = pickAt(e.clientX, e.clientY); hoverObj = hit; hoverTile = hit ? null : tile;
  cv.style.cursor = hit ? "pointer" : tile ? "crosshair" : "default";
  tip.style.display = hit ? "block" : "none"; if (hit) { tip.textContent = hit.name; tip.style.left = e.clientX + "px"; tip.style.top = e.clientY + "px"; }
});
cv.addEventListener("pointerup", (e) => {
  if (drag && !drag.moved) { initAudio(); const { hit, tile } = pickAt(e.clientX, e.clientY);
    if (hit) { if (hit.spot) walkTo(hit.spot[0], hit.spot[1], () => hit.act && hit.act()); else hit.act && hit.act(); }
    else if (tile) walkTo(tile[0], tile[1]); }
  drag = null;
});
cv.addEventListener("wheel", (e) => { e.preventDefault(); const k0 = view.k; view.k = THREE_clamp(view.k * (e.deltaY < 0 ? 1.12 : 1 / 1.12), 0.8, 2.6);
  const cx = e.clientX - innerWidth / 2, cy = e.clientY - innerHeight / 2; view.tx = cx - (cx - view.tx) * view.k / k0; view.ty = cy - (cy - view.ty) * view.k / k0; }, { passive: false });

// ---------- ปุ่ม
const ui = document.getElementById("ui");
function btn(t, fn, on) { const b = document.createElement("button"); b.textContent = t; if (on) b.className = "on"; b.onclick = () => fn(b); ui.appendChild(b); return b; }
btn("กลางคืน", (b) => { night = !night; b.classList.toggle("on", night); });
btn("ตาราง", (b) => { showGrid = !showGrid; b.classList.toggle("on", showGrid); }, true);
btn("ป้าย", (b) => { showLabels = !showLabels; b.classList.toggle("on", showLabels); }, true);
btn("มุมเอียง", (b) => { const top = PITCH > 1; PITCH = (top ? 38 : 75) * Math.PI / 180; SN = Math.sin(PITCH); CS = Math.cos(PITCH); b.classList.toggle("on", !top); });
document.fonts.load("800 20px 'Noto Sans Thai'");
