<meta charset="utf-8">
<title>ศาลนารุโฮโดะ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kanit:ital,wght@0,400;0,600;0,800;1,800;1,900&family=Sarabun:wght@400;600;700&display=swap">
<style>
/* Layout: one 16:9 courtroom stage (camera strip defense | witness | counsel + judge/wide shots), dialogue box inside, controls below */
:root{
  --ink:#14100c; --wood:#5a3519; --wood-d:#3a200d; --wood-l:#8a5a2e; --wall:#b9a27c; --wall-d:#8f7955;
  --paper:#fbf6ea; --blue:#2f6fe0; --red:#e0372f; --green:#3ec46d; --gold:#f4c430;
  --panel:#1d1813; --panel-2:#2a231b; --line:#5b4a36; --muted:#b6a68e;
  --f-display:'Kanit',system-ui,sans-serif; --f-body:'Sarabun',system-ui,sans-serif;
  color-scheme:dark;
}
html,body{background:var(--ink);color:var(--paper)}
body{font-family:var(--f-body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 32px}
.app{max-width:1120px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.bar h1{font-family:var(--f-display);font-weight:800;font-style:italic;font-size:22px;margin:0 auto 0 0;letter-spacing:.02em;color:var(--gold)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--panel)}
.seg button{background:none;border:0;color:var(--muted);font:600 14px var(--f-body);padding:7px 14px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--paper);color:var(--ink)}
.btn{background:var(--paper);color:var(--ink);border:0;border-radius:999px;font:700 14px var(--f-body);padding:8px 18px;cursor:pointer}
.btn:focus-visible,.seg button:focus-visible,.card:focus-visible,.act:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

/* ---------- stage ---------- */
.stage{position:relative;width:100%;aspect-ratio:16/9;overflow:hidden;border-radius:6px;background:#000;user-select:none;container-type:inline-size}
.strip{position:absolute;inset:0;width:300%;display:flex;transition:transform .55s cubic-bezier(.6,.05,.3,1)}
.strip.cut{transition:none}
.scene{position:relative;width:33.3334%;height:100%;overflow:hidden}
.shot{position:absolute;inset:0;opacity:0;pointer-events:none;transition:opacity .15s}
.shot.on{opacity:1}
/* walls */
.wall{position:absolute;inset:0;background:
  repeating-linear-gradient(90deg,transparent 0 11%,rgba(0,0,0,.18) 11% 11.6%,transparent 11.6% 12%),
  linear-gradient(180deg,var(--wall) 0%,var(--wall-d) 62%,#4b3a26 62%,#3a2b1b 100%)}
.wall.dark{background:
  repeating-linear-gradient(90deg,transparent 0 14%,rgba(0,0,0,.22) 14% 15%),
  linear-gradient(180deg,#6d5a43 0%,#4a3b2a 70%,#2b2117 100%)}
.wall.judge{background:
  radial-gradient(ellipse at 50% 30%,rgba(255,230,170,.35),transparent 60%),
  repeating-linear-gradient(90deg,#4a2f18 0 8%,#3c2512 8% 8.6%),
  linear-gradient(#4a2f18,#2a190b)}
.col{position:absolute;top:0;bottom:38%;width:6%;background:linear-gradient(90deg,#d8c7a3,#f1e6cc 40%,#b39d74);box-shadow:0 0 0 2px rgba(0,0,0,.15)}
.desk{position:absolute;bottom:0;height:34%;background:linear-gradient(180deg,var(--wood-l) 0 7%,var(--wood) 7% 60%,var(--wood-d));border-top:4px solid #a8743e;box-shadow:0 -6px 18px rgba(0,0,0,.4)}
.desk::after{content:"";position:absolute;inset:18% 6% 14%;border:3px solid rgba(0,0,0,.18);border-radius:4px}
.desk.l{left:-4%;width:70%;transform:skewX(-8deg)}
.desk.r{right:-4%;width:70%;transform:skewX(8deg)}
.stand{position:absolute;bottom:0;left:30%;width:40%;height:30%;background:linear-gradient(180deg,var(--wood-l) 0 8%,var(--wood) 8% 70%,var(--wood-d));border-top:4px solid #a8743e;border-radius:8px 8px 0 0}
.bench{position:absolute;bottom:0;left:8%;right:8%;height:30%;background:linear-gradient(180deg,#9b6635 0 8%,#6b3f1b 8% 75%,#3d230d);border-top:5px solid #c08a4c}
/* characters */
.chr{position:absolute;bottom:22%;height:74%;aspect-ratio:200/230;transform-origin:50% 100%}
.chr svg{width:100%;height:100%;overflow:visible;display:block}
.chr.L{left:16%}.chr.C{right:16%}.chr.D{left:50%;margin-left:-16cqw}.chr.J{left:50%;margin-left:-15cqw;bottom:20%}
.chr.D{width:32cqw;height:auto}.chr.J{width:30cqw;height:auto}
.chr .arm{display:none}
.chr.point .arm{display:inline}
.chr.point .rest{display:none}
.chr.slam{animation:slam .35s}
.chr.sweat .drops{display:inline}
.chr .drops{display:none}
.chr.shake{animation:jit .1s linear 8}
.chr.break{animation:brk 1.6s forwards}
.chr.dead{filter:grayscale(1) brightness(.5)}
@keyframes slam{0%{transform:translateY(0)}40%{transform:translateY(5%)}100%{transform:none}}
@keyframes jit{0%,100%{transform:translateX(0)}50%{transform:translateX(2%)}}
@keyframes brk{0%{transform:none}25%{transform:rotate(-8deg) scale(1.05)}55%{transform:rotate(14deg) translateY(4%)}100%{transform:rotate(-80deg) translate(-30%,30%);opacity:.65}}

/* wide shot */
.wide .gal{position:absolute;left:0;right:0;bottom:0;height:34%;background:linear-gradient(#3b2a1a,#20160d);display:flex;justify-content:center;align-items:flex-end;gap:3.5%;padding-bottom:2%}
.spec{position:relative;width:8.5%;aspect-ratio:1/1.25;display:flex;flex-direction:column;align-items:center;transition:transform .2s,opacity .4s}
.spec .hd{width:70%;aspect-ratio:1;border-radius:50%;border:3px solid rgba(0,0,0,.35)}
.spec .bd{width:100%;flex:1;border-radius:40% 40% 0 0;margin-top:-6%}
.spec .nm{position:absolute;bottom:-2%;font:600 1.15cqw var(--f-body);background:rgba(0,0,0,.6);padding:0 .5cqw;border-radius:4px;white-space:nowrap}
.spec.out{opacity:.15;transform:translateY(40%)}
.spec .rx{position:absolute;top:-55%;font-size:3.2cqw;animation:pop .9s forwards}
.spec.hop{animation:hop .4s 2}
@keyframes hop{50%{transform:translateY(-12%)}}
@keyframes pop{0%{transform:scale(.3);opacity:0}30%{transform:scale(1.2);opacity:1}100%{transform:translateY(-40%);opacity:0}}
.wide .mini{position:absolute;bottom:34%;height:30%;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;font:700 1.4cqw var(--f-body)}
.mini .m{width:6cqw;height:6cqw;border-radius:50%}
.tomato{position:absolute;font-size:3cqw;z-index:6;transition:left .6s cubic-bezier(.3,.6,.5,1),top .6s cubic-bezier(.3,-.6,.6,1)}
.splat{position:absolute;font-size:5cqw;z-index:6;animation:splat .8s forwards}
@keyframes splat{0%{transform:scale(.4)}20%{transform:scale(1.3)}100%{transform:scale(1);opacity:0}}

/* HUD */
.hp{position:absolute;top:2.2%;width:31%;z-index:8;display:flex;flex-direction:column;gap:.4cqw}
.hp.L{left:2%}.hp.D{right:2%;align-items:flex-end}
.hp .tag{font:800 italic 1.7cqw var(--f-display);text-shadow:0 2px 0 #000,0 0 6px #000}
.hp .track{position:relative;width:100%;height:1.9cqw;background:#120d08;border:.25cqw solid var(--paper);border-radius:.4cqw;overflow:hidden;box-shadow:0 2px 6px rgba(0,0,0,.6)}
.hp .fill{position:absolute;inset:0;transform-origin:left;transition:transform .5s}
.hp.D .fill{transform-origin:right}
.hp.L .fill{background:linear-gradient(#7fb0ff,var(--blue) 55%,#173f96)}
.hp.D .fill{background:linear-gradient(#ff8f86,var(--red) 55%,#8c1611)}
.hp .glow{position:absolute;top:0;bottom:0;background:rgba(255,240,120,.85);animation:blink .6s infinite alternate;display:none}
.hp .ticks{position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 calc(20% - 2px),rgba(0,0,0,.6) calc(20% - 2px) 20%)}
.hp .n{font:700 1.4cqw var(--f-body);text-shadow:0 1px 0 #000}
@keyframes blink{to{opacity:.25}}
.round{position:absolute;top:2.4%;left:50%;transform:translateX(-50%);z-index:8;font:800 1.5cqw var(--f-display);background:rgba(0,0,0,.55);padding:.2cqw 1.2cqw;border-radius:999px;letter-spacing:.06em}
.alibis{position:absolute;top:9%;right:2%;z-index:8;font-size:2cqw;letter-spacing:.2cqw}

/* dialogue */
.dlg{position:absolute;left:2%;right:2%;bottom:2.5%;height:22%;z-index:9;background:linear-gradient(rgba(16,24,48,.92),rgba(8,12,28,.95));border:.3cqw solid #e9e2cf;border-radius:1cqw;padding:2.2cqw 2.6cqw;font:600 2.25cqw/1.45 var(--f-body);cursor:pointer;display:none}
.dlg.on{display:block}
.dlg .who{position:absolute;top:-2.9cqw;left:2cqw;background:#e9e2cf;color:#1b2030;font:800 1.7cqw var(--f-display);padding:.25cqw 1.4cqw;border-radius:.6cqw .6cqw 0 0}
.dlg .txt.green{color:#62f08a}
.dlg .txt.blue{color:#8fc3ff}
.dlg .txt.red{color:#ff8c84}
.dlg .nx{position:absolute;right:1.6cqw;bottom:1cqw;font-size:1.8cqw;animation:bob .6s infinite alternate;display:none}
.dlg.done .nx{display:block}
@keyframes bob{to{transform:translateY(30%)}}

/* cross-exam controls */
.cx{position:absolute;inset:0;z-index:10;pointer-events:none;display:none}
.cx.on{display:block}
.cx .act{pointer-events:auto;position:absolute;font:900 italic 2.3cqw var(--f-display);padding:.6cqw 2cqw;border-radius:.8cqw;border:.3cqw solid #fff;cursor:pointer;text-shadow:0 .2cqw 0 rgba(0,0,0,.5);box-shadow:0 .4cqw 0 rgba(0,0,0,.45)}
.cx .act:disabled{filter:grayscale(1) brightness(.6);cursor:not-allowed}
.cx .press{left:2%;top:10.5%;background:linear-gradient(#ffd25a,#e39a12);color:#fff}
.cx .present{right:2%;top:10.5%;background:linear-gradient(#ff6a5c,#c3221a);color:#fff}
.cx .arrow{top:52%;background:rgba(0,0,0,.6);color:#fff;font-size:2.4cqw;padding:.4cqw 1.4cqw}
.cx .prev{left:2%}.cx .next{right:2%}
.cx .end{left:50%;top:10.5%;transform:translateX(-50%);background:rgba(0,0,0,.6);color:#fff;font-size:1.6cqw;padding:.4cqw 1.6cqw}
.cx .dots{position:absolute;top:63%;left:50%;transform:translateX(-50%);display:flex;gap:.8cqw}
.cx .dots i{width:1.3cqw;height:1.3cqw;border-radius:50%;background:rgba(255,255,255,.35);border:.2cqw solid #fff}
.cx .dots i.cur{background:var(--green)}
.cx .dots i.done{background:#555}
.presses{position:absolute;left:2%;top:18%;font:700 1.5cqw var(--f-body);text-shadow:0 1px 0 #000}

/* banners & shouts */
.banner{position:absolute;left:0;right:0;top:38%;z-index:12;text-align:center;font:900 italic 5cqw var(--f-display);letter-spacing:.06em;pointer-events:none;display:none}
.banner.on{display:block;animation:ban 1.6s forwards}
.banner span{display:inline-block;padding:.4cqw 4cqw;background:linear-gradient(90deg,transparent,rgba(0,0,0,.75) 15% 85%,transparent)}
.banner.test{color:#ffb54a;text-shadow:0 0 .4cqw #000,0 .3cqw 0 #6a2d00}
.banner.cross{color:#5dff8a;text-shadow:0 0 .4cqw #000,0 .3cqw 0 #08451b}
@keyframes ban{0%{transform:translateX(100%)}18%,82%{transform:none}100%{transform:translateX(-100%)}}
.shout{position:absolute;inset:0;z-index:14;display:none;align-items:center;justify-content:center;pointer-events:none}
.shout.on{display:flex}
.shout .bub{position:relative;width:58%;aspect-ratio:2.1/1;animation:bub .9s forwards}
.shout .bub svg{position:absolute;inset:0;width:100%;height:100%}
.shout .bub b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:900 italic 7.2cqw var(--f-display);color:var(--c,#e0372f);-webkit-text-stroke:.35cqw #1a0a06;paint-order:stroke fill;transform:rotate(-6deg)}
.shout.two .bub{width:44%}
.shout.two .bub:first-child{animation:clashL 1.1s forwards}
.shout.two .bub:last-child{animation:clashR 1.1s forwards}
@keyframes bub{0%{transform:scale(.2) rotate(-10deg)}25%{transform:scale(1.1)}35%,85%{transform:scale(1)}100%{transform:scale(1);opacity:0}}
@keyframes clashL{0%{transform:translateX(-120%)}40%{transform:translateX(8%)}55%{transform:translateX(-4%) rotate(-8deg)}90%{opacity:1}100%{opacity:0}}
@keyframes clashR{0%{transform:translateX(120%)}40%{transform:translateX(-8%)}55%{transform:translateX(4%) rotate(8deg)}90%{opacity:1}100%{opacity:0}}
.flash{position:absolute;inset:0;background:#fff;z-index:13;opacity:0;pointer-events:none}
.flash.on{animation:fl .35s}
@keyframes fl{0%{opacity:.95}100%{opacity:0}}
.stage.quake{animation:quake .45s}
@keyframes quake{20%{transform:translate(-1.2%,.6%)}40%{transform:translate(1%,-.8%)}60%{transform:translate(-.8%,.4%)}80%{transform:translate(.5%,-.3%)}}
.stage.tremble .camera{animation:trem .18s infinite}
@keyframes trem{50%{transform:translate(.25%,.15%)}}
.camera{position:absolute;inset:0}
.float{position:absolute;z-index:11;font:900 italic 4cqw var(--f-display);-webkit-text-stroke:.25cqw #000;paint-order:stroke fill;animation:flt 1.4s forwards;pointer-events:none}
@keyframes flt{0%{transform:translateY(30%) scale(.6);opacity:0}20%{transform:none;opacity:1}100%{transform:translateY(-80%);opacity:0}}
.gavel{position:absolute;inset:0;z-index:12;display:none;align-items:center;justify-content:center;background:radial-gradient(circle,#5a3a1a,#1a0e05);pointer-events:none}
.gavel.on{display:flex}
.gavel .g{font-size:16cqw;transform-origin:80% 80%;animation:gv .45s}
.gavel .pang{position:absolute;font:900 italic 9cqw var(--f-display);color:#fff;-webkit-text-stroke:.3cqw #000;paint-order:stroke fill;animation:bub .8s forwards}
@keyframes gv{0%{transform:rotate(-55deg)}60%{transform:rotate(8deg)}100%{transform:none}}

/* verdict */
.verdict{position:absolute;inset:0;z-index:15;display:none;align-items:center;justify-content:center;flex-direction:column;gap:2cqw;background:radial-gradient(circle,rgba(0,0,0,.35),rgba(0,0,0,.85))}
.verdict.on{display:flex}
.verdict .word{display:flex;gap:1cqw}
.verdict .word span{font:900 9.5cqw var(--f-display);color:#fff;-webkit-text-stroke:.35cqw var(--vc,#c21);paint-order:stroke fill;text-shadow:0 0 2cqw var(--vc,#c21);opacity:0;transform:scale(3)}
.verdict .word span.in{animation:stamp .35s forwards}
@keyframes stamp{to{opacity:1;transform:scale(1)}}
.verdict .res{display:flex;gap:1.4cqw;flex-wrap:wrap;justify-content:center;font:700 2cqw var(--f-body)}
.verdict .res span{background:rgba(0,0,0,.6);border:.2cqw solid var(--line);padding:.4cqw 1.4cqw;border-radius:999px}
.verdict .confetti{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.verdict .confetti i{position:absolute;top:-5%;width:1cqw;height:1.6cqw;animation:fall 2.4s linear forwards}
@keyframes fall{to{transform:translateY(120cqw) rotate(720deg)}}

/* record drawer + builder (overlay panels) */
.panel{position:absolute;left:4%;right:4%;top:9%;bottom:4%;z-index:16;background:rgba(20,15,10,.96);border:.3cqw solid #d9c7a2;border-radius:1cqw;padding:1.6cqw 2cqw;display:none;flex-direction:column;gap:1.2cqw}
.panel.on{display:flex}
.panel h3{margin:0;font:800 italic 2.4cqw var(--f-display);color:var(--gold)}
/* evidence folder: square item slots + detail strip */
.slots{display:flex;flex-wrap:wrap;gap:1.4cqw;align-content:flex-start;flex:1}
.slot{width:11cqw;aspect-ratio:1;background:linear-gradient(#3b3226,#241d15);border:.3cqw solid #8b7a5c;border-radius:.4cqw;font-size:6cqw;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.slot[aria-pressed="true"]{border-color:var(--gold);box-shadow:0 0 1.2cqw rgba(244,196,48,.7);transform:translateY(-4%)}
.slot:disabled{opacity:.25;cursor:not-allowed}
.detail{display:flex;gap:2cqw;align-items:center;background:#e9e2cf;color:#1b1b1b;border-radius:.5cqw;padding:1cqw 1.6cqw;min-height:9cqw}
.detail .ic{font-size:6cqw}
.detail .t{font:800 2.3cqw var(--f-display)}
.detail .s{font:600 1.6cqw var(--f-body);color:#4b4033}
/* testimony picker: plain lines */
.lines{display:flex;flex-direction:column;gap:.6cqw;overflow:auto;flex:1}
.line{display:flex;align-items:center;gap:1.2cqw;background:none;border:0;border-bottom:.15cqw solid #4a3d2c;color:var(--paper);padding:.7cqw .4cqw;cursor:pointer;font:600 1.9cqw var(--f-body);text-align:left}
.line[aria-pressed="true"]{color:#62f08a}
.line .no{font:800 1.9cqw var(--f-display);width:2.4cqw;color:var(--gold)}
.line .sh{margin-left:auto;font-size:2.6cqw;opacity:.25;cursor:pointer;background:none;border:0;padding:0}
.line .sh.on{opacity:1}
.line .sh:disabled{opacity:.08}
.prow{display:flex;justify-content:flex-end;gap:1cqw;align-items:center}
.prow .btn{font-size:1.7cqw;padding:.6cqw 2.4cqw}
.prow .cnt{margin-right:auto;font:700 1.7cqw var(--f-body);color:var(--muted)}
.objbtn{position:absolute;z-index:17;right:3%;bottom:31%;font:900 italic 3cqw var(--f-display);color:#fff;background:linear-gradient(#ff6a5c,#c3221a);border:.35cqw solid #fff;border-radius:1cqw;padding:.6cqw 2.4cqw;cursor:pointer;display:none}
.objbtn.on{display:block;animation:jit .12s infinite}
.objbtn .tm{font-size:1.6cqw;margin-left:1cqw}

.start{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2cqw;background:radial-gradient(circle at 50% 40%,rgba(80,50,20,.55),rgba(0,0,0,.92))}
.start .big{font:900 italic 7cqw var(--f-display);color:var(--gold);-webkit-text-stroke:.25cqw #000;paint-order:stroke fill}
.start .btn{font-size:2.2cqw;padding:1cqw 4cqw}

.log{display:flex;flex-wrap:wrap;gap:8px;min-height:32px}
.log span{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font:600 13px var(--f-body);color:var(--muted)}
.log span b{color:var(--paper)}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}}
</style>

<div class="app">
  <div class="bar">
    <h1>เริ่มการไต่สวน</h1>
    <div class="seg" role="group" id="segMode">
      <button id="mPvp" aria-pressed="true" data-v="pvp">PVP</button>
      <button id="mDuo" aria-pressed="false" data-v="duo">Duo</button>
    </div>
    <div class="seg" role="group" id="segRole">
      <button id="rL" aria-pressed="true" data-v="L">ทนาย</button>
      <button id="rD" aria-pressed="false" data-v="D">จำเลย</button>
    </div>
    <div class="seg" role="group"><button id="mute" aria-pressed="false">🔊</button></div>
    <button class="btn" id="restart">เริ่มใหม่</button>
  </div>

  <div class="stage" id="stage">
    <div class="camera">
      <div class="strip" id="strip">
        <div class="scene" id="scL"><div class="wall"></div><div class="col" style="left:62%"></div><div class="col" style="left:88%"></div><div class="chr L" id="chL"></div><div class="desk l"></div></div>
        <div class="scene" id="scD"><div class="wall dark"></div><div class="col" style="left:6%"></div><div class="col" style="left:88%"></div><div class="chr D" id="chD"></div><div class="stand"></div></div>
        <div class="scene" id="scC"><div class="wall"></div><div class="col" style="left:4%"></div><div class="col" style="left:30%"></div><div class="chr C" id="chC"></div><div class="desk r"></div></div>
      </div>
      <div class="shot" id="shJ"><div class="wall judge"></div><div class="chr J" id="chJ"></div><div class="bench"></div></div>
      <div class="shot wide" id="shW"><div class="wall"></div>
        <div class="mini" style="left:8%"><div class="m" style="background:var(--blue)"></div>นารุโฮโดะ</div>
        <div class="mini" style="left:46%"><div class="m" style="background:var(--gold)"></div>ดิโอ</div>
        <div class="mini" id="miniC" style="right:8%"><div class="m" style="background:#3c9a5f"></div>ดิเอโก้</div>
        <div class="mini" style="left:47%;bottom:66%;height:auto"><div class="m" style="background:#222;width:5cqw;height:5cqw"></div></div>
        <div class="gal" id="gal"></div>
      </div>
    </div>

    <div class="round" id="round">คำให้การ 1/3</div>

    <div class="cx" id="cx">
      <button class="act press" id="bPress">เดี๋ยวก่อน!</button>
      <button class="act present" id="bPresent">คัดค้าน!</button>

  </div>


</div>

<script>
/* ===================== CONFIG (ปรับตัวเลขที่นี่) ===================== */
const CFG = {
  cred: 5,            // ความน่าเชื่อถือแต่ละฝ่าย
  testimonies: 3,     // จำนวนรอบคำให้การ
  statements: 3,      // ประโยคต่อคำให้การ
  alibi: 2,           // ข้อแก้ตัวของจำเลย
  pressPer: 1,        // เดี๋ยวก่อน! ต่อคำให้การ
  wrong: 1,           // ยื่นผิด = ทนาย −
  alibiBurn: 1,       // ยื่นใส่ข้อแก้ตัว = ทนาย −
  witnessBreak: 2,    // พยานทะลุข้อแก้ตัว = จำเลย −
  counselObj: 1,      // ฝ่ายค้านคัดค้านได้ต่อคำให้การ
  gallery: 5,
  types: {
    weapon:  { i:'🔪', n:'อาวุธ',   dmg:3 },
    foot:    { i:'👣', n:'รอยเท้า', dmg:2, reveal:true },
    receipt: { i:'💊', n:'ใบเสร็จ', dmg:2, heal:1 },
    witness: { i:'📜', n:'พยาน',    dmg:4, pierce:true },
  }
};
const ACTIONS = [
  { id:'knife', type:'weapon',  deny:'ฉันไม่ได้ขว้างมีดใส่ใครทั้งนั้น', ev:'มีดเงินปักพื้น',       evs:'ดิโอ · ขว้างมีด' },
  { id:'world', type:'witness', deny:'เวลาไม่เคยหยุด ฉันไม่ได้หยุดมัน',   ev:'คำให้การของผู้เห็นเหตุการณ์', evs:'ดิโอ · เดอะเวิลด์' },
  { id:'warp',  type:'foot',    deny:'ฉันยืนอยู่ตรงนี้ตลอด ไม่ได้ขยับไปไหน', ev:'รอยเท้ากลางสนาม',      evs:'ดิโอ · วาร์ปข้างหลัง' },
  { id:'drain', type:'receipt', deny:'แผลของฉันหายเอง ไม่ได้ดูดเลือดใคร',  ev:'รอยเขี้ยวที่คอ',        evs:'ดิโอ · ดูดเลือด' },
];
const FILLERS = ['ฉันมาที่สนามนี้เพื่อสู้อย่างยุติธรรม','ทนายคนนั้นจ้องฉันตลอดเวลา','ฉันไม่เคยแพ้ใครมาก่อน','ตอนนั้นฝนตกหนักมาก'];
const GALLERY = [
  {n:'เซลิน', h:'#ffd6e6', b:'#e46aa0'},{n:'เฟิร์น', h:'#e7d9ff', b:'#6c4cc2'},{n:'ลอว์', h:'#f0d2b4', b:'#2b2b2b'},
  {n:'ไจโร', h:'#f4d2a8', b:'#2e7bd1'},{n:'กิระ', h:'#d9e8c8', b:'#5c7d3a'},
];
const NAMES = { L:'นารุโฮโดะ', D:'ดิโอ', C:'ดิเอโก้', J:'ผู้พิพากษา' };

/* ===================== characters (SVG) ===================== */
function svgChar(k){
  const P = {
    L:{skin:'#f3cba3',hair:'#1d2340',suit:'#2b55b8',suit2:'#1d3c8a',tie:'#d8312a',spikes:true},
    D:{skin:'#f6dcc0',hair:'#f2cf3a',suit:'#e5b10c',suit2:'#b8860b',tie:'#3fae5a',band:'#2fa04f'},
    C:{skin:'#f2d0ae',hair:'#e6c86a',suit:'#2f7a4b',suit2:'#1f5534',tie:'#f2e6c0',helmet:'#7b5a2e'},
    J:{skin:'#efc9a3',hair:'#e9e9e9',suit:'#141414',suit2:'#000',tie:'#fff',beard:true}
  }[k];
  const hair = P.spikes
    ? `<polygon points="52,92 30,40 70,70 62,20 95,58 104,12 122,58 150,22 140,72 178,46 150,96" fill="${P.hair}"/>`
    : P.beard ? `<ellipse cx="100" cy="66" rx="44" ry="12" fill="${P.skin}"/><path d="M58 88 q-6 -28 10 -36 M142 88 q6 -28 -10 -36" stroke="${P.hair}" stroke-width="10" fill="none" stroke-linecap="round"/>`
    : `<path d="M54 92 Q50 30 100 26 Q152 30 148 92 Q140 60 100 58 Q62 60 54 92Z" fill="${P.hair}"/><path d="M58 70 Q40 110 50 130 M142 70 Q160 110 150 130" stroke="${P.hair}" stroke-width="12" fill="none" stroke-linecap="round"/>`;
  const extra = (P.band?`<rect x="58" y="58" width="84" height="9" rx="4" fill="${P.band}"/>`:'')
    + (P.helmet?`<path d="M56 64 Q100 18 144 64 L144 56 Q100 8 56 56Z" fill="${P.helmet}"/>`:'')
    + (P.beard?`<path d="M70 118 Q100 160 130 118 Q120 140 100 142 Q80 140 70 118Z" fill="${P.hair}"/>`:'');
  const eyes = `<ellipse cx="84" cy="94" rx="5" ry="6" fill="#1b1b1b"/><ellipse cx="116" cy="94" rx="5" ry="6" fill="#1b1b1b"/><path d="M74 82 L94 86 M126 82 L106 86" stroke="#1b1b1b" stroke-width="4" stroke-linecap="round"/>`;
  return `<svg viewBox="0 0 200 230" aria-hidden="true">
    <path d="M30 230 Q32 150 100 146 Q168 150 170 230Z" fill="${P.suit}"/>
    <path d="M100 150 L80 230 L120 230Z" fill="#fff"/><path d="M100 156 L92 176 L100 222 L108 176Z" fill="${P.tie}"/>
    <path d="M70 150 L100 200 L64 230 L40 230Z M130 150 L100 200 L136 230 L160 230Z" fill="${P.suit2}"/>
    <rect x="88" y="128" width="24" height="24" fill="${P.skin}"/>
    <ellipse cx="100" cy="98" rx="44" ry="48" fill="${P.skin}"/>
    ${hair}${extra}${eyes}
    <path d="M90 124 Q100 130 110 124" stroke="#7a3b2a" stroke-width="3" fill="none" stroke-linecap="round"/>
    <g class="rest"><path d="M40 230 Q44 196 58 180" stroke="${P.suit2}" stroke-width="22" fill="none" stroke-linecap="round"/></g>
    <g class="arm"><path d="M62 176 L190 140" stroke="${P.suit}" stroke-width="24" stroke-linecap="round"/><circle cx="194" cy="139" r="11" fill="${P.skin}"/><path d="M200 137 L228 130" stroke="${P.skin}" stroke-width="7" stroke-linecap="round"/></g>
    <g class="drops"><path d="M150 70 q8 12 0 18 q-8 -6 0 -18Z M58 66 q8 12 0 18 q-8 -6 0 -18Z M160 104 q7 10 0 15 q-7 -5 0 -15Z" fill="#9fd8ff"/></g>
    ${k==='J'?'<text x="150" y="215" font-size="46">🔨</text>':''}
  </svg>`;
}
['L','D','C','J'].forEach(k=>{ const el=document.getElementById('ch'+k); el.innerHTML=svgChar(k); if(k==='C') el.style.transform='scaleX(-1)'; });

/* ===================== audio (synth) ===================== */
let AC=null, muted=false;
function ac(){ if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } return AC; }
function tone(f,d,type='square',v=.05,slide=0){ const a=ac(); if(!a||muted) return; const o=a.createOscillator(), g=a.createGain(); o.type=type; o.frequency.value=f; if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),a.currentTime+d); g.gain.value=v; g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+d); o.connect(g).connect(a.destination); o.start(); o.stop(a.currentTime+d); }
function noise(d,v=.25){ const a=ac(); if(!a||muted) return; const b=a.createBuffer(1,a.sampleRate*d,a.sampleRate), c=b.getChannelData(0); for(let i=0;i<c.length;i++) c[i]=(Math.random()*2-1)*Math.pow(1-i/c.length,3); const s=a.createBufferSource(), g=a.createGain(); g.gain.value=v; s.buffer=b; s.connect(g).connect(a.destination); s.start(); }
const SFX = {
  blip(k){ tone(k==='L'?520:k==='D'?380:k==='J'?260:440,.03,'square',.025); },
  gavel(){ noise(.25,.5); tone(90,.25,'sine',.3,-40); },
  shout(){ noise(.15,.25); tone(220,.4,'sawtooth',.08,600); tone(330,.4,'square',.05,500); },
  hit(){ noise(.3,.4); tone(160,.35,'sawtooth',.12,-120); },
  pen(){ tone(300,.12,'square',.07); setTimeout(()=>tone(200,.25,'square',.07),120); },
  ok(){ tone(660,.08,'triangle',.08); setTimeout(()=>tone(990,.15,'triangle',.08),80); },
  boo(){ tone(140,.5,'sawtooth',.05,-40); },
  cheer(){ noise(.5,.12); },
  stamp(){ noise(.12,.5); tone(70,.3,'sine',.35); },
};

/* ===================== helpers ===================== */
const $ = id=>document.getElementById(id);
const wait = ms=>new Promise(r=>setTimeout(r,ms));
const rnd = a=>a[Math.floor(Math.random()*a.length)];
const shuffle = a=>{ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
let RUN=0; // incremented on restart to cancel flows
class Cancel extends Error{}
const guard = id=>{ if(id!==RUN) throw new Cancel(); };

/* ===================== state ===================== */
let S;
function fresh(){
  const mode = document.querySelector('#segMode [aria-pressed="true"]').dataset.v;
  const role = document.querySelector('#segRole [aria-pressed="true"]').dataset.v;
  const held = shuffle(ACTIONS).slice(0,3).map(a=>a.id);
  return {
    mode, role, t:0,
    cred:{L:CFG.cred, D:CFG.cred},
    evidence: held.map(id=>({id, used:false})),
    proven: new Set(), alibi: CFG.alibi, counselLeft:0,
    gallery: GALLERY.slice(0,CFG.gallery).map(g=>({...g, out:false, cheerL:0, cheerD:0})),
    gainT:{L:0,D:0},
  };
}
const act = id=>ACTIONS.find(a=>a.id===id);

/* ===================== view ===================== */
const POS={L:0,D:1,C:2};
let curScene='L';
function scene(k, cut=false){
  const strip=$('strip');
  $('shJ').classList.toggle('on',k==='J'); $('shW').classList.toggle('on',k==='W');
  if(k in POS){
    strip.classList.toggle('cut', cut || !(curScene in POS));
    strip.style.transform=`translateX(${-POS[k]*33.3334}%)`;
  }
  curScene=k;
}
/* no bars on screen: pressure shows only on the characters (sweat / tremble) */
function hpRender(){
  $('stage').classList.toggle('tremble', S.cred.L===1 || S.cred.D===1);
  $('chL').classList.toggle('sweat', S.cred.L<=2); $('chD').classList.toggle('sweat', S.cred.D<=2);
}
function glow(){}
function floatNum(){}
function quake(){ const s=$('stage'); s.classList.remove('quake'); void s.offsetWidth; s.classList.add('quake'); }
function flash(){ const f=$('flash'); f.classList.remove('on'); void f.offsetWidth; f.classList.add('on'); }
function pose(k,cls,ms){ const el=$('ch'+k); el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); if(ms) setTimeout(()=>el.classList.remove(cls),ms); }
function log(){}

async function damage(k,n,id){
  guard(id);
  S.cred[k]=Math.max(0,S.cred[k]-n); hpRender(); floatNum(k,'−'+n,'#ff6b5e'); SFX.hit(); quake();
  if(S.cred[k] < CFG.cred) {}
  await wait(500);
}
async function heal(k,n){ S.cred[k]=Math.min(CFG.cred,S.cred[k]+n); hpRender(); floatNum(k,'+'+n,'#7dffa0'); SFX.ok(); await wait(400); }

/* dialogue */
let dlgResolve=null, dlgFull=false, typing=null;
function say(k,text,color='',id){
  guard(id);
  return new Promise(res=>{
    if(k in POS || k==='J') scene(k);
    const d=$('dlg'); d.classList.add('on'); d.classList.remove('done');
    $('who').textContent=NAMES[k]||k; const t=$('txt'); t.className='txt '+color; t.textContent='';
    const chars=Array.from(text); let i=0; dlgFull=false;
    clearInterval(typing);
    typing=setInterval(()=>{ if(RUN!==id){clearInterval(typing);return;} t.textContent+=chars[i++]||''; if(i%2) SFX.blip(k); if(i>=chars.length){ clearInterval(typing); dlgFull=true; d.classList.add('done'); } },28);
    const auto=setTimeout(()=>finish(), 1500+chars.length*55);
    function finish(){ clearTimeout(auto); clearInterval(typing); t.textContent=text; dlgResolve=null; res(); }
    dlgResolve=()=>{ if(!dlgFull){ clearInterval(typing); t.textContent=text; dlgFull=true; d.classList.add('done'); } else finish(); };
  });
}
$('dlg').addEventListener('click',()=>dlgResolve&&dlgResolve());
function hideDlg(){ $('dlg').classList.remove('on'); }

const BUB = `<svg viewBox="0 0 210 100" preserveAspectRatio="none"><polygon points="10,18 40,22 52,4 72,20 100,2 118,20 150,6 160,24 200,12 184,40 208,56 182,64 196,92 150,78 132,98 108,80 74,96 60,78 20,92 30,66 2,52 24,40" fill="#fff" stroke="#1a0a06" stroke-width="4"/></svg>`;
async function shout(k,word,id,color){
  guard(id); hideDlg();
  if(k in POS) scene(k,true);
  pose(k,'point',1600);
  const c = color || (k==='L'?'#2f6fe0':k==='D'?'#e0a800':'#d4372c');
  const s=$('shout'); s.className='shout on'; s.innerHTML=`<div class="bub" style="--c:${c}">${BUB}<b>${word}</b></div>`;
  flash(); quake(); SFX.shout(); await wait(1000); s.className='shout';
}
async function clash(id){
  guard(id); hideDlg(); scene('W');
  const s=$('shout'); s.className='shout on two';
  s.innerHTML=`<div class="bub" style="--c:#2f6fe0">${BUB}<b>เดี๋ยวก่อน!</b></div><div class="bub" style="--c:#d4372c">${BUB}<b>คัดค้าน!</b></div>`;
  SFX.shout(); setTimeout(()=>{flash();quake();SFX.hit();},420); await wait(1150); s.className='shout';
}
async function banner(text,cls,id){ guard(id); hideDlg(); const b=$('banner'); $('bannerT').textContent=text; b.className='banner on '+cls; SFX.ok(); await wait(1650); b.className='banner'; }
async function gavel(id,n=1){ guard(id); hideDlg(); const g=$('gavel'); for(let i=0;i<n;i++){ g.classList.remove('on'); void g.offsetWidth; g.classList.add('on'); SFX.gavel(); quake(); await wait(520); } g.classList.remove('on'); }

/* ===================== gallery ===================== */
function galRender(){
  $('gal').innerHTML = S.mode==='pvp' ? S.gallery.map((g,i)=>`<div class="spec ${g.out?'out':''}" id="sp${i}"><div class="hd" style="background:${g.h}"></div><div class="bd" style="background:${g.b}"></div><div class="nm">${g.n}</div></div>`).join('') : '';
  $('miniC').style.visibility = S.mode==='duo' ? 'visible':'hidden';
}
async function galleryPhase(id){
  if(S.mode!=='pvp') return;
  guard(id); hideDlg(); scene('W'); await wait(400);
  const lead = S.gainT.L>S.gainT.D ? 'L' : S.gainT.D>S.gainT.L ? 'D' : null;
  let throws=0, lastThrower=-1, delta={L:0,D:0};
  for(let i=0;i<S.gallery.length;i++){
    const g=S.gallery[i]; if(g.out) continue; guard(id);
    const r=Math.random(); const side = lead && Math.random()<.65 ? lead : rnd(['L','D']);
    const el=$('sp'+i); let rx='';
    if(r<.42){ rx='👏'; delta[side]++; side==='L'?g.cheerL++:g.cheerD++; SFX.cheer(); el.classList.add('hop'); setTimeout(()=>el.classList.remove('hop'),900); }
    else if(r<.72){ rx='👎'; const other=side==='L'?'D':'L'; delta[other]--; SFX.boo(); }
    else { rx='🍅'; throws++; lastThrower=i; throwTomato(el, rnd(['L','D'])); }
    const p=document.createElement('div'); p.className='rx'; p.textContent=rx; el.appendChild(p); setTimeout(()=>p.remove(),950);
    await wait(380);
  }
  await wait(500);
  for(const k of ['L','D']){
    const n=delta[k]; if(!n) continue;
    if(n>0){ await heal(k,Math.min(n, CFG.cred-S.cred[k]) || 0); }
    else { S.cred[k]=Math.max(0,S.cred[k]+n); hpRender(); floatNum(k,String(n),'#ff6b5e'); SFX.boo(); await wait(400); }
  }
  log(`ประชาชน <b>👏👎 นารุโฮโดะ ${fmt(delta.L)} · ดิโอ ${fmt(delta.D)}</b>${throws?' · 🍅×'+throws:''}`);
  if(throws>3 || (throws>=3 && Math.random()<.5)){
    await gavel(id,2);
    await say('J','เงียบ! คนที่ปาของ ออกไปจากศาลเดี๋ยวนี้!','',id);
    S.gallery[lastThrower].out=true; galRender(); scene('W'); await wait(700);
    log(`<b>${S.gallery[lastThrower].n}</b> ถูกไล่ออก`);
  }
}
const fmt=n=>n>0?'+'+n:String(n);
function throwTomato(fromEl, side){
  const st=$('stage').getBoundingClientRect(), r=fromEl.getBoundingClientRect();
  const t=document.createElement('div'); t.className='tomato'; t.textContent='🍅';
  t.style.left=(r.left-st.left+r.width/2)+'px'; t.style.top=(r.top-st.top)+'px'; $('stage').appendChild(t);
  requestAnimationFrame(()=>{ t.style.left=(side==='L'?st.width*.12:st.width*.5)+'px'; t.style.top=(st.height*.42)+'px'; });
  setTimeout(()=>{ t.remove(); const s=document.createElement('div'); s.className='splat'; s.textContent='💥'; s.style.left=(side==='L'?st.width*.1:st.width*.48)+'px'; s.style.top=(st.height*.38)+'px'; $('stage').appendChild(s); noise(.12,.3); setTimeout(()=>s.remove(),900); },620);
}

/* ===================== testimony build ===================== */
function pool(){
  const denies = ACTIONS.filter(a=>!S.proven.has(a.id)).map(a=>({kind:'deny', id:a.id, text:a.deny}));
  const fill = FILLERS.map(f=>({kind:'fill', text:f}));
  return {denies, fill};
}
function aiTestimony(){
  const {denies,fill}=pool();
  let list = shuffle(denies).slice(0, Math.min(denies.length, Math.random()<.5?2:3));
  while(list.length<CFG.statements) list.push(rnd(fill.filter(f=>!list.includes(f))));
  list = shuffle(list).map(s=>({...s, alibi:false, pressed:false, done:false}));
  let a=S.alibi; for(const s of shuffle(list)) if(s.kind==='deny' && a>0 && Math.random()<.45){ s.alibi=true; a--; }
  return list;
}
function playerTestimony(id){
  return new Promise(res=>{
    const {denies,fill}=pool(); const all=[...denies,...fill];
    const chosen=new Map(); // idx -> alibi bool
    const draw=()=>{
      const used=[...chosen.values()].filter(Boolean).length;
      $('bGrid').innerHTML = all.map((s,i)=>{
        const on=chosen.has(i), al=chosen.get(i);
        const a = s.kind==='deny'? act(s.id):null;
        const no = on ? [...chosen.keys()].indexOf(i)+1 : '';
        return `<div class="line" role="button" tabindex="0" data-i="${i}" aria-pressed="${on}">
          <span class="no">${no}</span><span>${s.text}</span>
          ${a&&on?`<button class="sh ${al?'on':''}" data-al="${i}" ${(!al&&used>=S.alibi)?'disabled':''}>📍</button>`:''}</div>`;
      }).join('');
      $('bCnt').textContent = `${chosen.size}/${CFG.statements}  ·  📍×${S.alibi-used}`;
      $('bGo').disabled = chosen.size!==CFG.statements;
    };
    $('bGrid').onclick=e=>{
      const al=e.target.closest('[data-al]');
      if(al){ e.stopPropagation(); const i=+al.dataset.al; const used=[...chosen.values()].filter(Boolean).length; const cur=chosen.get(i); if(cur||used<S.alibi) chosen.set(i,!cur); draw(); return; }
      const c=e.target.closest('[data-i]'); if(!c) return; const i=+c.dataset.i;
      if(chosen.has(i)) chosen.delete(i); else if(chosen.size<CFG.statements) chosen.set(i,false);
      draw();
    };
    $('bGo').onclick=()=>{
      $('builder').classList.remove('on');
      res([...chosen.entries()].map(([i,al])=>({...all[i], alibi:al, pressed:false, done:false})));
    };
    draw(); $('builder').classList.add('on'); hideDlg(); scene('D');
  });
}

/* ===================== resolution ===================== */
async function doPress(st,id){
  await shout('L','เดี๋ยวก่อน!',id);
  st.pressed=true; S.pressLeft--;
  if(st.alibi){
    await say('D','ก็...ก็บอกแล้วไงว่าตอนนั้นฉันอยู่ไกล...','',id);
    pose('D','shake'); SFX.pen();
    await say('L','ไกลขนาดไหน? ใครเห็นคุณบ้าง?','blue',id);
    await say('D','ช...ช่างมันเถอะ!','',id);
    st.alibi=false; S.alibi=Math.max(0,S.alibi-1); hpRender();
    const a=act(st.id);
    if(!S.evidence.find(e=>e.id===a.id && !e.used)) S.evidence.push({id:a.id, used:false, fresh:true});
    SFX.ok(); await say('L',`ได้หลักฐานใหม่: ${CFG.types[a.type].i} ${a.ev}`,'blue',id);
    log(`เดี๋ยวก่อน! → 📍 แตก · ได้ <b>${CFG.types[a.type].i} ${a.ev}</b>`);
  } else {
    const lines = st.kind==='fill' ? ['ก็ตามนั้นแหละ ไม่มีอะไรมากกว่านี้','จะถามซ้ำทำไม ฉันพูดความจริง'] : ['ฉันมั่นใจ! ไม่ได้ทำแน่นอน','ถามอีกกี่ทีคำตอบก็เหมือนเดิม'];
    await say('D',rnd(lines),'',id);
    log(`เดี๋ยวก่อน! → <b>ไม่มีอะไร</b>`);
  }
}
async function counselCheck(id){
  if(S.mode!=='duo' || S.counselLeft<=0) return false;
  let yes;
  if(S.role==='D'){ yes = await objWindow(id); }
  else { yes = Math.random()<.45; }
  if(!yes) return false;
  S.counselLeft--;
  await shout('C','คัดค้าน!',id,'#d4372c');
  await say('C','หลักฐานชิ้นนี้ยังพิสูจน์อะไรไม่ได้! ศาลไม่ควรรับฟัง!','',id);
  await gavel(id); await say('J','อืม...ศาลขอไม่รับหลักฐานชิ้นนั้นไว้ก่อน','',id);
  log(`ฝ่ายค้าน <b>คัดค้าน!</b> → หลักฐานถูกปัด`);
  return true;
}
function objWindow(id){
  return new Promise(res=>{
    const b=$('objBtn'); b.classList.add('on'); let t=3; $('objTm').textContent=t;
    const iv=setInterval(()=>{ if(RUN!==id){done(false);return;} t--; $('objTm').textContent=t; if(t<=0) done(false); },1000);
    function done(v){ clearInterval(iv); b.classList.remove('on'); b.onclick=null; res(v); }
    b.onclick=()=>done(true);
  });
}
async function doPresent(st,ev,id){
  const a=act(ev.id), T=CFG.types[a.type];
  await shout('L','คัดค้าน!',id);
  await say('L',`${T.i} ${a.ev} — เอานี่ไปดู!`,'blue',id);
  if(await counselCheck(id)) { st.presentTried=true; return; }
  st.done=true;
  if(st.kind==='fill'){
    await gavel(id); await say('J','ทนาย! หลักฐานนี้เกี่ยวอะไรกับคำให้การ?','',id);
    pose('L','shake'); await damage('L',CFG.wrong,id); S.gainT.D+=CFG.wrong;
    log(`${T.i} ใส่ "${st.text}" → <b>ทนาย −${CFG.wrong}</b>`); return;
  }
  if(st.id!==ev.id){
    await gavel(id); await say('J','หลักฐานไม่ตรงกับประโยคนี้เลยนะ ทนาย!','',id);
    pose('L','shake'); await damage('L',CFG.wrong,id); S.gainT.D+=CFG.wrong;
    log(`${T.i} ผิดชิ้น → <b>ทนาย −${CFG.wrong}</b>`); return;
  }
  if(st.alibi && !T.pierce){
    await shout('D','เดี๋ยวก่อน!',id,'#e0a800');
    await say('D','ตอนนั้นฉันอยู่อีกฟากของสนาม! มีคนเห็นด้วย!','',id);
    st.alibi=false; S.alibi=Math.max(0,S.alibi-1); ev.used=true; hpRender();
    await say('J','ข้อแก้ตัวฟังขึ้น...หลักฐานชิ้นนั้นตกไป','',id);
    await damage('L',CFG.alibiBurn,id); S.gainT.D+=CFG.alibiBurn;
    log(`${T.i} ชน 📍 → หลักฐานเสีย · <b>ทนาย −${CFG.alibiBurn}</b>`); return;
  }
  ev.used=true;
  if(st.alibi && T.pierce){
    await say('L','คำให้การของพยานยืนยันว่าคุณอยู่ตรงนั้น! ข้อแก้ตัวของคุณใช้ไม่ได้!','blue',id);
    st.alibi=false; S.alibi=Math.max(0,S.alibi-1); hpRender();
    pose('D','shake'); await damage('D',CFG.witnessBreak,id); S.gainT.L+=CFG.witnessBreak;
    log(`📜 ทะลุ 📍 → <b>ดิโอ −${CFG.witnessBreak}</b>`); return;
  }
  S.proven.add(a.id);
  pose('D','shake');
  await say('D',rnd(['ก...กรอ๊ากกก!!','เป็นไปไม่ได้...!','ม...ไม่จริง!!']),'red',id);
  await damage('D',T.dmg,id); S.gainT.L+=T.dmg;
  let extra='';
  if(T.heal){ await heal('L',T.heal); extra=` · ทนาย +${T.heal}`; }
  if(T.reveal){ S.revealAlibi=true; extra=' · 👁️ 📍'; renderCx(); }
  log(`${T.i} ${a.ev} → <b>ดิโอ −${T.dmg}</b>${extra}`);
}

/* ===================== cross-exam (player = lawyer) ===================== */
let cxIdx=0, cxState=null;
function renderCx(){
  if(!cxState) return;
  const L=cxState.list;
  $('dots').innerHTML=L.map((s,i)=>`<i class="${i===cxIdx?'cur':''} ${s.done?'done':''}"></i>`).join('');
  $('presses').textContent = `เดี๋ยวก่อน! ×${S.pressLeft}`;
  const st=L[cxIdx];
  $('bPress').disabled = st.done || st.pressed || S.pressLeft<=0;
  $('bPresent').disabled = st.done || st.presentTried || !S.evidence.some(e=>!e.used);
  const d=$('dlg'); d.classList.add('on','done'); $('who').textContent=NAMES.D;
  const t=$('txt'); t.className='txt green'; t.textContent=(S.revealAlibi&&st.alibi?'📍 ':'')+st.text;
  scene('D');
}
function playerCross(list,id){
  return new Promise(res=>{
    cxState={list}; cxIdx=0; $('cx').classList.add('on'); renderCx();
    const finish=()=>{ $('cx').classList.remove('on'); cxState=null; res(); };
    const busy=async fn=>{ $('cx').classList.remove('on'); try{ await fn(); }catch(e){ if(e instanceof Cancel) return; throw e; }
      if(RUN!==id) return;
      if(S.cred.L<=0||S.cred.D<=0||list.every(s=>s.done)) return finish();
      $('cx').classList.add('on'); renderCx(); };
    $('bPrev').onclick=()=>{ cxIdx=(cxIdx-1+list.length)%list.length; renderCx(); };
    $('bNext').onclick=()=>{ cxIdx=(cxIdx+1)%list.length; renderCx(); };
    $('bEnd').onclick=finish;
    $('bPress').onclick=()=>busy(()=>doPress(list[cxIdx],id));
    $('bPresent').onclick=async()=>{ const ev=await pickEvidence(list[cxIdx]); if(ev) busy(()=>doPresent(list[cxIdx],ev,id)); };
  });
}
function evCard(e,sel){
  const a=act(e.id), T=CFG.types[a.type];
  return `<button class="slot" data-e="${S.evidence.indexOf(e)}" aria-pressed="${sel}" aria-label="${a.ev}" ${e.used?'disabled':''}>${T.i}</button>`;
}
function pickEvidence(st){
  return new Promise(res=>{
    let sel=S.evidence.find(e=>!e.used)||null;
    const draw=()=>{ $('recGrid').innerHTML=S.evidence.map(e=>evCard(e,sel===e)).join(''); $('recGo').disabled=!sel;
      if(sel){ const a=act(sel.id); $('recDetail').innerHTML=`<span class="ic">${CFG.types[a.type].i}</span><div><div class="t">${a.ev}</div><div class="s">${CFG.types[a.type].n} · ${a.evs}</div></div>`; } else $('recDetail').innerHTML=''; };
    $('recGrid').onclick=e=>{ const c=e.target.closest('[data-e]'); if(!c||c.disabled) return; sel=S.evidence[+c.dataset.e]; draw();
      const T=CFG.types[act(sel.id).type]; glow('D',T.dmg); glow('L',CFG.wrong); };
    const close=v=>{ $('record').classList.remove('on'); glow('L',0); glow('D',0); res(v); };
    $('recGo').onclick=()=>close(sel); $('recClose').onclick=()=>close(null);
    draw(); $('record').classList.add('on');
  });
}

/* ===================== cross-exam (AI lawyer, player = defendant) ===================== */
async function aiCross(list,id){
  const order=shuffle(list.map((_,i)=>i));
  for(const i of order){
    const st=list[i]; guard(id);
    if(S.cred.L<=0||S.cred.D<=0) return;
    scene('D'); const d=$('dlg'); d.classList.add('on','done'); $('who').textContent=NAMES.D;
    const t=$('txt'); t.className='txt green'; t.textContent=(st.alibi?'📍 ':'')+st.text; await wait(1300);
    if(st.kind==='deny' && S.pressLeft>0 && Math.random()<.4){ await doPress(st,id); }
    if(S.cred.L<=0||S.cred.D<=0) return;
    const ev = st.kind==='deny' ? S.evidence.find(e=>!e.used && e.id===st.id) : null;
    if(ev && Math.random()<.9) await doPresent(st,ev,id);
    else if(Math.random()<.15 && S.evidence.some(e=>!e.used)) await doPresent(st, rnd(S.evidence.filter(e=>!e.used)), id);
  }
}

/* ===================== main flow ===================== */
async function trial(id){
  hpRender(); galRender(); scene('W',true);
  await gavel(id,3);
  await say('J','ศาลขอเปิดการไต่สวน คดีของจำเลย ดิโอ บรันโด','',id);
  await say('L','ฝ่ายทนายพร้อมแล้วครับ ศาลที่เคารพ','blue',id);
  if(S.mode==='duo') await say('C','ฝ่ายค้านพร้อม ลูกความของเราบริสุทธิ์!','',id);
  else { scene('W'); await say('J','ประชาชนในศาล โปรดอยู่ในความสงบ','',id); }
  await say('D','ฮ่ะ! จะกล่าวหาข้างั้นรึ? ลองดูสิ','',id);

  for(S.t=1; S.t<=CFG.testimonies; S.t++){
    guard(id);
    $('round').textContent=`คำให้การ ${S.t}/${CFG.testimonies}`;
    S.pressLeft=CFG.pressPer; S.counselLeft=CFG.counselObj; S.revealAlibi=false; S.gainT={L:0,D:0};
    const list = S.role==='D' ? await playerTestimony(id) : aiTestimony();
    guard(id);
    await banner('~ คำให้การ ~','test',id);
    for(const st of list){ await say('D',(S.role==='D'&&st.alibi?'📍 ':'')+st.text,'',id); }
    await banner('~ ซักค้าน ~','cross',id);
    if(S.role==='L') await playerCross(list,id); else await aiCross(list,id);
    guard(id); hideDlg();
    if(await checkEnd(id)) return;
    await galleryPhase(id);
    if(await checkEnd(id)) return;
    if(S.t<CFG.testimonies){ await gavel(id); await say('J','ศาลขอให้จำเลยให้การต่อ','',id); }
  }
  // after all testimonies
  const w = S.cred.D<S.cred.L ? 'guilty' : S.cred.L<S.cred.D ? 'free' : 'tie';
  await verdict(w,id);
}
async function checkEnd(id){
  if(S.cred.D<=0){ await verdict('guilty',id); return true; }
  if(S.cred.L<=0){ await verdict('free',id); return true; }
  return false;
}
async function verdict(w,id){
  guard(id); hideDlg(); $('cx').classList.remove('on'); $('stage').classList.remove('tremble');
  if(w==='guilty'){ pose('D','break'); SFX.hit(); await wait(1300); $('chD').classList.add('dead'); }
  if(w==='free'){ pose('L','break'); SFX.hit(); await wait(1300); }
  await gavel(id); scene('J');
  if(w==='tie'){ await say('J','ศาลยังตัดสินไม่ได้ คดีนี้ขอยุติไว้เท่านี้','',id); }
  else await say('J','ศาลขอตัดสินว่า จำเลย ดิโอ บรันโด...','',id);
  hideDlg();
  const V=$('verdict'); V.classList.add('on');
  const words = w==='guilty'?['มี','ความ','ผิด'] : w==='free'?['ไม่','มี','ความ','ผิด'] : ['—'];
  V.style.setProperty('--vc', w==='guilty'?'#c21':'#2a7be0');
  $('vWord').innerHTML=words.map(x=>`<span>${x}</span>`).join('');
  for(const sp of $('vWord').children){ guard(id); sp.classList.add('in'); SFX.stamp(); quake(); await wait(420); }
  if(w==='free'){ $('confetti').innerHTML=Array.from({length:60},(_,i)=>`<i style="left:${Math.random()*100}%;background:${rnd(['#f4c430','#e0372f','#2f6fe0','#3ec46d','#fff'])};animation-delay:${Math.random()*1.2}s"></i>`).join(''); }
  const res=[];
  if(w==='guilty') res.push('💀 ดิโอ ตาย');
  if(w==='free') res.push('นารุโฮโดะ ❤ −3','😵 สตั้น 2 เทิร์น');
  if(S.mode==='pvp' && w!=='tie'){
    const key = w==='guilty'?'cheerL':'cheerD';
    const best=Math.max(...S.gallery.filter(g=>!g.out).map(g=>g[key]));
    if(best>0) S.gallery.filter(g=>!g.out && g[key]===best).forEach(g=>res.push(`🏆 ${g.n} ❤ +1`));
  }
  $('vRes').innerHTML=res.map(r=>`<span>${r}</span>`).join('') + `<span style="cursor:pointer;background:var(--paper);color:var(--ink)" id="again">เริ่มใหม่</span>`;
  $('again').onclick=start;
  log(`<b>${w==='guilty'?'มีความผิด':w==='free'?'ไม่มีความผิด':'เสมอ'}</b>`);
}

/* ===================== boot ===================== */
function start(){
  RUN++; const id=RUN;
  dlgResolve=null; clearInterval(typing);
  ['record','builder','verdict','cx','objBtn'].forEach(k=>$(k).classList.remove('on'));
  $('startScr').style.display='none'; $('confetti').innerHTML='';
  ['L','D','C','J'].forEach(k=>$('ch'+k).classList.remove('dead','break','shake','sweat'));
  S=fresh(); hpRender(); galRender(); glow('L',0); glow('D',0);
  $('round').textContent=`คำให้การ 1/${CFG.testimonies}`;
  ac(); if(AC&&AC.state==='suspended') AC.resume();
  trial(id).catch(e=>{ if(!(e instanceof Cancel)) console.error(e); });
}
function seg(groupId){ $(groupId).addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b) return; $(groupId).querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed', x===b)); if($('startScr').style.display==='none') start(); }); }
seg('segMode'); seg('segRole');
$('restart').onclick=start; $('startBtn').onclick=start;
$('mute').onclick=()=>{ muted=!muted; $('mute').textContent=muted?'🔇':'🔊'; $('mute').setAttribute('aria-pressed',muted); };
document.addEventListener('keydown',e=>{ if((e.key===' '||e.key==='Enter') && dlgResolve && !$('cx').classList.contains('on')){ e.preventDefault(); dlgResolve(); } });
// initial still frame
S=fresh(); hpRender(); galRender(); scene('W',true);
</script>
