<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ECHO Colony</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Kanit:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --azure:#3d8bd9; --navy:rgba(12,22,46,.88); --navy-solid:#0c1630; --line:rgba(127,184,230,.35);
  --text:#eaf3fc; --mute:#9db8da; --hp:#e0564f; --armor:#5fa8ee; --gold:#e6b44c; --warn:#ff8a3d;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#010208;font-family:"Chakra Petch","Kanit",system-ui,sans-serif;color:var(--text)}
#stage{position:absolute;left:50%;top:50%;width:1280px;height:720px;transform-origin:50% 50%;user-select:none;overflow:hidden;background:#010208}
#cv{position:absolute;left:0;top:0;width:1280px;height:720px;cursor:grab}
#cv.drag{cursor:grabbing}
.panel{position:absolute;background:var(--navy);border:1px solid var(--line)}
.panel::before,.panel::after{content:"";position:absolute;width:10px;height:10px;border:2px solid var(--azure);pointer-events:none}
.panel::before{left:-2px;top:-2px;border-right:0;border-bottom:0}
.panel::after{right:-2px;bottom:-2px;border-left:0;border-top:0}
.hide{display:none!important}

#hdr{left:16px;top:14px;padding:7px 14px;display:flex;gap:12px;align-items:center}
#hdr b{font-size:20px;font-weight:700;letter-spacing:.5px}
#hdr span{font-size:14px;color:var(--mute)}
#hdr i{font-style:normal;font-size:16px}
#seal{left:16px;top:62px;padding:6px 12px;display:flex;gap:10px;align-items:center}
#seal .ring{width:22px;height:22px;border-radius:50%;border:4px solid #b9c4d0;box-shadow:inset 0 0 0 2px #2a3a55}
#seal b{font-size:22px;font-weight:700;min-width:26px;text-align:center}
#seal.warn .ring{border-color:var(--warn);animation:pulse .6s steps(2) infinite}
#seal.warn b{color:var(--warn)}
#seal.boom .ring{border-color:var(--hp);background:radial-gradient(#ff7a6e,#7a1410)}
#seal.boom b{color:#ff8a82}
@keyframes pulse{50%{opacity:.35}}

#order{left:50%;top:10px;transform:translateX(-50%);display:flex;gap:6px;padding:6px 8px}
.chip{position:relative;width:60px;display:flex;flex-direction:column;align-items:center;gap:2px;transition:transform .25s,opacity .25s}
.chip .pf{width:42px;height:42px;background-size:cover;background-position:50% 15%;border:2px solid var(--c);background-color:#22324f;display:flex;align-items:center;justify-content:center;font-weight:700}
.chip .nm{font-size:11px;color:var(--mute);white-space:nowrap;line-height:1}
.chip.cur{transform:translateY(3px)}
.chip.cur .pf{box-shadow:0 0 0 2px #fff,0 0 14px 2px var(--azure)}
.chip.done{opacity:.5}
.chip.dead{opacity:.2}

#side{right:16px;top:14px;width:176px;padding:8px;display:flex;flex-direction:column;gap:8px;align-items:center}
#mini{width:160px;height:230px;cursor:pointer}
.cams{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;width:100%}
.cams button{padding:4px 0;font-size:16px}
.cams button.on{background:var(--azure);border-color:#9fd0ff}

#unit{left:16px;bottom:16px;width:330px;padding:10px;display:flex;gap:12px}
#unit .pf{width:80px;height:92px;flex:none;background-size:cover;background-position:50% 15%;border:2px solid var(--c);background-color:#22324f;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:700}
#unit .nm{font-size:18px;font-weight:600;line-height:1.2}
#unit .row{display:flex;gap:14px;font-size:14px;color:var(--mute);margin-top:6px;align-items:center}
#unit .row b{color:var(--text);font-weight:600}
.pips{display:flex;gap:3px;margin-top:6px;align-items:center}
.pip{width:13px;height:13px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.06)}
.pip.h{background:var(--hp);border-color:#ff9b94}
.pip.a{background:var(--armor);border-color:#a8d4ff;transform:rotate(45deg) scale(.82)}
.pip.sep{width:6px;border:0;background:none}
.coin{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--gold);box-shadow:inset 0 0 0 2px #b8862a;vertical-align:-1px;margin-right:4px}

#act{right:16px;bottom:16px;padding:10px;display:flex;gap:8px;align-items:center}
button{font:inherit;font-size:16px;font-weight:600;color:var(--text);background:rgba(255,255,255,.07);border:1px solid var(--line);padding:8px 16px;cursor:pointer;position:relative}
button:hover:not(:disabled){background:rgba(255,255,255,.15)}
button:disabled{opacity:.35;cursor:default}
button.pri{background:#7b4ddb;border-color:#a98af0}
button.pri:hover:not(:disabled){background:#8b5ff0}
button.jump{background:#1f6fb8;border-color:#7fbaf2}
button.jump:hover:not(:disabled){background:#2d84d4}
button .cd{position:absolute;right:-7px;top:-9px;background:var(--hp);color:#fff;font-size:12px;padding:0 6px;border:1px solid #ff9b94}

#shop{right:16px;bottom:84px;width:300px;padding:12px}
#shop .hd{display:flex;justify-content:space-between;align-items:center;font-size:17px;font-weight:600;margin-bottom:8px}
#shop .hd button{padding:2px 10px}
#shop .it{display:flex;align-items:center;gap:10px;padding:6px 0;border-top:1px solid rgba(127,184,230,.15)}
#shop .it .ic{width:18px;height:18px;background:var(--armor);transform:rotate(45deg) scale(.8);border:1px solid #a8d4ff;flex:none}
#shop .it .n{flex:1;font-size:15px}
#shop .it .q{font-size:13px;color:var(--mute)}
#shop .it button{padding:4px 12px;font-size:14px}

#banner{position:absolute;left:0;right:0;top:290px;height:120px;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;opacity:0;
  background:linear-gradient(90deg,rgba(8,14,30,0),rgba(8,14,30,.86) 22%,rgba(8,14,30,.86) 78%,rgba(8,14,30,0))}
#banner small{font-size:15px;color:var(--mute);font-weight:600}
#banner b{font-size:46px;font-weight:700;line-height:1.15}
#banner.red b{color:#ff8a82}
#banner.gold b{color:#ffd27a}
#banner.on{animation:ban var(--dur,1.5s) ease forwards}
#banner.stay{opacity:1}
@keyframes ban{0%{opacity:0;transform:scaleY(.3)}10%{opacity:1;transform:scaleY(1)}78%{opacity:1}100%{opacity:0}}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
#vign{position:absolute;inset:0;pointer-events:none;opacity:0;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 55%,rgba(200,20,20,.55) 100%)}
</style>
</head>
<body>
<div id="stage">
  <canvas id="cv"></canvas>
  <div id="vign"></div>
  <div id="hdr" class="panel"><b>Colony</b><span id="turnNo">เทิร์น 1</span><i id="dn">☀</i><button id="bSnd" style="padding:2px 8px;font-size:15px">🔊</button></div>
  <div id="seal" class="panel"><div class="ring"></div><b id="sealN">5</b></div>
  <div id="order" class="panel"></div>
  <div id="side" class="panel">
    <canvas id="mini" width="160" height="230"></canvas>
    <div class="cams">
      <button id="bRotL" title="Q">⟲</button>
      <button id="bRotR" title="E">⟳</button>
      <button id="bHome" title="Space">⌖</button>
      <button id="bSpeed">⏩</button>
      <button id="bOrbit" class="on">◉</button>
      <button id="bAxis" title="V">◎</button>
      <button id="bFlat" title="M">▦</button>
      <button id="bReset">↻</button>
    </div>
  </div>
  <div id="unit" class="panel"></div>
  <div id="act" class="panel">
    <button id="bJump" class="jump">กระโดด</button>
    <button id="bShop">ร้านค้า</button>
    <button id="bEnd" class="pri">จบตา</button>
  </div>
  <div id="shop" class="panel hide"></div>
  <div id="banner"></div>
  <div id="flash"></div>
</div>
<script>

const TERR = {};
const isBlock = (x, y) => !!BLOCK[TERR[K(x, y)]];
const isWater = (x, y) => TERR[K(x, y)] === "water";
function genMap() {
  const R = mulberry32(11);
  LIFTS.forEach(([x, y]) => (TERR[K(x, y)] = "lift"));
  const keep = new Set();
  LIFTS.forEach(([x, y]) => { keep.add(K(x, y)); keep.add(K(x, y + 4)); keep.add(K(x, y + 3)); keep.add(K(x, y + 5)); });
  const free = (cx, cy, s) => !GLASS.has(cx) && !TERR[K(cx, cy)] && !keep.has(K(cx, cy)) && !(s === 0 && cy <= 2) && cy % SEC !== SEC - 1 && cy % SEC !== 0;
  const place = (s, n, type, shapes) => {
    let placed = 0, guard = 0;
    while (placed < n && guard++ < 800) {
      const x = Math.floor(R() * COLS), y = s * SEC + 1 + Math.floor(R() * (SEC - 2));
      const sh = shapes[Math.floor(R() * shapes.length)];
      const cells = sh.map(([dx, dy]) => [mod(x + dx, COLS), y + dy]);
      if (!cells.every(([cx, cy]) => free(cx, cy, s))) continue;
      cells.forEach(([cx, cy]) => (TERR[K(cx, cy)] = type));
      placed++;
    }
  };
  const ONE = [[0, 0]], H2 = [[0, 0], [1, 0]], V2 = [[0, 0], [0, 1]];
  // บึง/สระ (น้ำตื้น เดินกิน 2) วางก่อน แล้วค่อยวางของขวาง
  const pond = (s, w, h) => { for (let g = 0; g < 200; g++) { const x = Math.floor(R() * COLS), y = s * SEC + 2 + Math.floor(R() * (SEC - 3 - h)); const cells = []; for (let i = 0; i < w; i++) for (let j = 0; j < h; j++) if (!((i === 0 || i === w - 1) && (j === 0 || j === h - 1)) || w < 3) cells.push([mod(x + i, COLS), y + j]); if (cells.every(([cx, cy]) => free(cx, cy, s))) { cells.forEach(([cx, cy]) => (TERR[K(cx, cy)] = "water")); return; } } };
  place(0, 11, "house", [ONE, H2, ONE]);

  place(2, 9, "tower", [ONE, V2, H2]); place(2, 3, "tree", [ONE]);
  pond(3, 3, 2); place(3, 6, "tree", [ONE]);
}

const nrm = phi => [-Math.cos(phi), -Math.sin(phi), 0];   // ทิศ "ขึ้น" ของพื้น = เข้าหาแกน

const AX = [0, 0, 1];
const tileP = (x, y, h = 0) => surf(x * DPHI, y + 0.5, h);

// =====================================================================================
//  ระบบกล้อง
//   rig = { phi, z, yaw, pitch, dist, axis, roll, fov }
//    - phi/z = จุดโฟกัสบนพื้น · yaw = หันรอบแนวตั้งฉากพื้น (0 = มองขึ้นตามแกน) · pitch = มุมก้ม · dist = ระยะ
//    - axis 0→1 = ผสมจากกล้องวงโคจรรอบตัวละคร ไปเป็นกล้องบนแกนกลางมองตามอุโมงค์
//   ผู้เล่นตั้ง yaw/pitch/dist เองได้ และค่าที่ตั้งคงอยู่ข้ามตาเดิน (เลื่อนโฟกัสเท่านั้นที่รีเซ็ตเมื่อเปลี่ยนคนเดิน)
//   อีเวนต์เรียก shot() — ยึดกล้องชั่วคราวด้วยค่าเฉพาะ แล้วคืนให้ผู้เล่น · กด Space ระหว่างฉาก = ข้าม
// =====================================================================================
const V = {
  mode: "orbit",                                           // orbit | flat
  axisView: false,                                          // ◎ มุมมองตามแกน (ผู้เล่นเปิดเอง)
  user: { yaw: 0, pitch: 0.7, dist: 6, panX: 0, panZ: 0 },
  tgt: { yaw: 0, pitch: 0.7, dist: 6 },                 // ค่าเป้าของ user (นุ่ม)
  cur: { phi: 0, z: 1.5, yaw: 0, pitch: 0.7, dist: 6, axis: 0, roll: 0, fov: 1.22 },
  shot: null, shotEnd: 0, shotSkip: null,
  shake: 0, punch: 0, alarm: 0, focusId: null, flatZoom: 1,
};
const CAM = { C: [0, 0, 0], f: [0, 0, 1], r: [1, 0, 0], u: [0, 1, 0], focal: 500 };
let lastT = performance.now();

function focusUnit() {
  if (V.focusId) { const u = G.units.find(q => q.id === V.focusId && q.alive); if (u) return u; }
  return G.actor || human() || alive()[0] || G.units[0];
}
function followTarget() {
  const f = focusUnit();
  const phi = (f.fx + V.user.panX) * DPHI, z = clamp(f.fy + 0.5 + V.user.panZ, minRow() + 0.5, ROWS - 0.5);
  // ระยะที่กล้องต้องเคลื่อน → ถอยกล้องออกระหว่างเดินทาง (มองเห็นเส้นทาง ไม่ตัดภาพ)
  const travel = Math.abs(angD(V.cur.phi, phi)) * Rc + Math.abs(z - V.cur.z);
  const bump = Math.min(3.5, travel * 0.32);
  return {
    phi, z, yaw: V.tgt.yaw, pitch: clamp(V.tgt.pitch + Math.min(.3, travel * .03), .1, 1.4),
    dist: V.tgt.dist + bump - V.punch * 1.2, axis: V.axisView ? 1 : 0, roll: 0, fov: 1.22, k: 0.09,
  };
}
async function shot(p, ms) {
  const base = followTarget();
  V.shot = { ...base, yaw: V.tgt.yaw, ...p };
  V.shotEnd = performance.now() + ms / SPEED;
  await new Promise(res => {
    V.shotSkip = res;
    const tick = () => { if (!V.shot || performance.now() >= V.shotEnd) return res(); setTimeout(tick, 30); };
    tick();
  });
}
function release() { V.shot = null; V.shotSkip = null; }
function kick(s) { V.shake = Math.max(V.shake, s); }

function stepCamera(dt) {
  V.user.yaw = V.tgt.yaw; // (แยกไว้เผื่อปรับ ภายหลัง)
  const t = V.shot || followTarget();
  const a = 1 - Math.pow(1 - (t.k || 0.09), dt * 60);
  const c = V.cur;
  c.phi = mod(c.phi + angD(c.phi, t.phi) * a, 2 * Math.PI);
  c.z += (t.z - c.z) * a;
  c.yaw += angD(c.yaw, t.yaw) * a;
  c.pitch += (t.pitch - c.pitch) * a;
  c.dist += (t.dist - c.dist) * a;
  c.axis += (t.axis - c.axis) * a;
  c.roll += angD(c.roll, t.roll || 0) * a;
  c.fov += ((t.fov || 1.22) - c.fov) * a;
  V.shake *= Math.pow(0.86, dt * 60);
  V.punch *= Math.pow(0.88, dt * 60);
  rigToCam(c);
}
function rigToCam(c) {
  const n = nrm(c.phi), T = tan(c.phi);
  const F = surf(c.phi, c.z, 0.45);
  const fwd = add(mul(AX, Math.cos(c.yaw)), mul(T, Math.sin(c.yaw)));
  let D = c.dist, C = null;
  const zMin = minRow() + 0.15;
  const back = add(mul(fwd, -Math.cos(c.pitch)), mul(n, Math.sin(c.pitch)));
  // แขนกล้อง (spring arm): ไล่จากโฟกัสออกไปหาตำแหน่งกล้อง เจอผนังโค้ง/อาคาร/วงแหวน/ประตูที่ปิด → หยุดก่อนชน
  const maxD = D;
  D = maxD;
  for (let s = 1; s <= 24; s++) {
    const d = maxD * s / 24, P = add(F, mul(back, d));
    if (Math.hypot(P[0], P[1]) > Rc * 0.86 || P[2] < zMin || P[2] > ROWS - 0.2 || solidAt3(P)) { D = Math.max(0.6, maxD * (s - 1.4) / 24); break; }
  }
  // ระยะที่ถูกบังเปลี่ยนแบบนุ่ม (ไม่กระตุกเข้าออก)
  V.armD = V.armD == null ? D : (D < V.armD ? D : V.armD + (D - V.armD) * 0.08);
  C = add(F, mul(back, V.armD));
  let L = add(F, mul(fwd, 1.1));
  // กล้องบนแกน: อยู่กลางกระบอก ถอยหลังโฟกัส มองตามแกน
  const Ca = [0, 0, Math.max(zMin + 0.1, c.z - 2.2 - c.dist * 0.55)], La = [0, 0, c.z + 9];
  C = lerp3(C, Ca, c.axis); L = lerp3(L, La, c.axis);
  if (V.shake > 0.002) {
    const s = V.shake * 0.12;
    C = add(C, [(Math.random() - .5) * s, (Math.random() - .5) * s, (Math.random() - .5) * s]);
  }
  const f = norm(sub(L, C));
  let r = cross(n, f);
  if (len(r) < 1e-4) r = cross(T, f);
  r = norm(r);
  let u = cross(f, r);
  const roll = c.roll + (V.shake > 0.002 ? (Math.random() - .5) * V.shake * 0.05 : 0);
  if (roll) { const cs = Math.cos(roll), sn = Math.sin(roll); const r2 = add(mul(r, cs), mul(u, sn)); u = sub(mul(u, cs), mul(r, sn)); r = r2; }
  CAM.C = C; CAM.f = f; CAM.r = r; CAM.u = u;
  CAM.focal = (H / 2) / Math.tan(c.fov / 2);
}
// จุด 3D อยู่ในอาคาร/วงแหวนกั้นไหม (ใช้กับแขนกล้อง)
function solidAt3(P) {
  const h = Rc - Math.hypot(P[0], P[1]);
  if (h > 1.5) return false;
  const x = mod(Math.round(Math.atan2(P[1], P[0]) / DPHI), COLS), y = Math.floor(P[2]);
  if (isBlock(x, y) && h < BLOCK[TERR[K(x, y)]] + 0.12 && y >= minRow()) return true;
  const zr = P[2] / SEC, k = Math.round(zr);
  if (k >= 1 && k <= 3 && Math.abs(P[2] - k * SEC) < 0.2 && h < 0.85 && !DOORS.has(x)) return true;
  return false;
}
const NEAR = 0.06;
function toCam(p) { const d = sub(p, CAM.C); return [dot(d, CAM.r), dot(d, CAM.u), dot(d, CAM.f)]; }
function scr(pc) { return [W / 2 + pc[0] / pc[2] * CAM.focal, H / 2 - pc[1] / pc[2] * CAM.focal]; }
function projPt(p) { const pc = toCam(p); if (pc[2] < NEAR) return null; const s = scr(pc); return { x: s[0], y: s[1], z: pc[2] }; }
function clipNear(pts) {
  const out = [];
  for (let i = 0; i < pts.length; i++) {
    const a = pts[i], b = pts[(i + 1) % pts.length];
    const ain = a[2] >= NEAR, bin = b[2] >= NEAR;
    if (ain) out.push(a);
    if (ain !== bin) { const t = (NEAR - a[2]) / (b[2] - a[2]); out.push([lerp(a[0], b[0], t), lerp(a[1], b[1], t), NEAR]); }
  }

}
function projPoly(pts3) {
  const pc = pts3.map(toCam);
  let zs = 0; for (const p of pc) zs += p[2];
  if (pc.every(p => p[2] < NEAR)) return null;
  const cl = clipNear(pc);
  if (cl.length < 3) return null;
  return { pts: cl.map(scr), z: zs / pc.length, zmax: Math.max(...pc.map(p => p[2])) };
}
// ยิงเมาส์ → ช่องบนผิวกระบอก (จุดตัดด้านไกลของรังสีกับทรงกระบอก)
function pickOrbit(mx, my) {
  const d = norm(add(CAM.f, add(mul(CAM.r, (mx - W / 2) / CAM.focal), mul(CAM.u, -(my - H / 2) / CAM.focal))));
  const C = CAM.C;
  const a = d[0] * d[0] + d[1] * d[1], b = 2 * (C[0] * d[0] + C[1] * d[1]), c = C[0] * C[0] + C[1] * C[1] - Rc * Rc;
  if (a < 1e-6) return null;
  const disc = b * b - 4 * a * c; if (disc < 0) return null;
  const t = (-b + Math.sqrt(disc)) / (2 * a); if (t <= 0) return null;
  const p = add(C, mul(d, t));
  const y = Math.floor(p[2]); if (y < 0 || y >= ROWS) return null;
  const x = mod(Math.round(Math.atan2(p[1], p[0]) / DPHI), COLS);
  return [x, y];
}

// =====================================================================================
//  สีและแสง
// =====================================================================================
const FOG = [3, 6, 16];
function shade(rgb, fog, lit = 1) {
  const a = rgb.map(v => v * lit);
  const al = alarmTint();
  if (al > 0) { a[0] = a[0] + (220 - a[0]) * al * 0.35; a[1] *= 1 - al * 0.3; a[2] *= 1 - al * 0.3; }
  return `rgb(${Math.round(lerp(a[0], FOG[0], fog))},${Math.round(lerp(a[1], FOG[1], fog))},${Math.round(lerp(a[2], FOG[2], fog))})`;
}
function alarmTint() { return V.alarm * (0.5 + 0.5 * Math.sin(performance.now() / 260)); }
function tileRGB(x, y) {
  const night = isNight(), chk = (x + y) & 1;
  if (y < minRow()) return [70, 16, 18];
  const t = TERR[K(x, y)];
  if (GLASS.has(x)) {
    const earth = Math.cos(x * DPHI - 1.2) > 0.4 ? 1 : 0;
    return night ? (earth ? [14, 30, 64] : [6, 12, 30]) : (earth ? [196, 228, 246] : [176, 214, 238]);
  }
  if (G.patched.has(K(x, y))) return night ? [56, 60, 70] : [120, 126, 136];
  if (t === "water") return night ? [14, 34, 60] : [38, 104, 150];
  const d = DISTRICT[Math.min(3, Math.floor(y / SEC))];
  const v = (hash(x, y, 9) - .5) * 10;
  let c;
  if (d === "town") c = (x % 4 === 3 || y % 5 === 0) ? [150, 146, 136] : (chk ? [118, 158, 104] : [110, 150, 98]);        // ถนน + สนามหญ้า
  else if (d === "forest") c = chk ? [70, 118, 72] : [64, 110, 66];
  else if (d === "city") c = (x % 3 === 2 || y % 4 === 1) ? [132, 136, 146] : (chk ? [162, 160, 154] : [154, 152, 146]);  // ถนน + ลานคอนกรีต
  else c = chk ? [128, 170, 120] : [120, 162, 112];
  if (t === "tree") c = [52, 92, 54];
  c = c.map(q => q + v);
  return night ? c.map((q, i) => q * (i === 2 ? .42 : .32)) : c;
}
// สีหลังคาบ้าน (สุ่มตามช่อง)
function roofRGB(x, y) { return [[176, 82, 64], [86, 112, 160], [190, 150, 90], [120, 120, 128]][Math.floor(hash(x, y, 4) * 4)]; }
const fogOf = z => clamp((z - 6) / 30, 0, 0.86);

// =====================================================================================
//  ตัววาด 3D (painter's algorithm — เรียงไกล→ใกล้)
// =====================================================================================
const cv = document.getElementById("cv"), ctx = cv.getContext("2d");
cv.width = W * DPR; cv.height = H * DPR;
const STARS = Array.from({ length: 260 }, () => [Math.random() * W, Math.random() * H, Math.random() * 1.3 + .2, Math.random()]);
const fx = [], floats = [], parts = [];

function polyPath(c, pts) { c.beginPath(); c.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < pts.length; i++) c.lineTo(pts[i][0], pts[i][1]); c.closePath(); }
function tileCorners(x, y, h = 0, inset = 0) {
  const p0 = (x - 0.5 + inset) * DPHI, p1 = (x + 0.5 - inset) * DPHI, pm = x * DPHI, z0 = y + inset, z1 = y + 1 - inset;
  return [surf(p0, z0, h), surf(pm, z0, h), surf(p1, z0, h), surf(p1, z1, h), surf(pm, z1, h), surf(p0, z1, h)];
}

function overlayFill(x, y, now) {
  // คืนสีทับช่อง (ลำดับสำคัญ: อันตราย → พื้นที่เดินได้)
  const out = [];
  const pulse = 0.5 + 0.5 * Math.sin(now / 170);
  const sl = sealLeft();
  if (sl !== null && sl <= 1 && y < (G.sealed + 1) * SEC && y >= minRow()) out.push(`rgba(255,60,40,${(sl === 0 ? .22 : .1) + pulse * .12})`);
  for (const h of G.holes) { const d = holeDist(h, x, y); if (d > 0 && d <= h.radius) out.push(`rgba(150,70,255,${.04 + .1 * (h.radius - d) / h.radius})`); }
  for (const t of G.tele) {
    if (t.type === "meteor") { const d = wdist(x, y, t.x, t.y); if (d <= t.radius) out.push(`rgba(255,50,40,${d === 0 ? .35 + pulse * .3 : .1 + pulse * .1})`); }
    else if (t.type === "beam" && t.y === y) out.push(`rgba(255,80,60,${.18 + pulse * .22})`);
    else if (t.type === "capsule" && t.x === x && t.y === y) out.push(`rgba(255,210,90,${.3 + pulse * .3})`);
  }
  if (UI.reach && UI.reach.has(K(x, y))) out.push("rgba(80,170,255,.30)");
  return out;
}
function tileStroke(x, y) {
  if (UI.hover && UI.hover[0] === x && UI.hover[1] === y) return ["#ffffff", 2.5];
  const a = G.actor;
  if (a && a.human && !a.acted) { const o = unitAt(x, y); if (o && o !== a && nbrs(a.x, a.y).some(([p, q]) => p === x && q === y)) return ["#ff6a60", 3]; }
  if (UI.pathSet && UI.pathSet.has(K(x, y))) return ["#bfe3ff", 2];
  return null;
}

function buildItems(now) {
  const items = [];
  const night = isNight();
  const yLo = G.sealed > 0 && !G.iris ? minRow() : 0;
  // ---- พื้น
  for (let y = yLo; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
    const rock = isBlock(x, y) && y >= minRow();
    const P = projPoly(tileCorners(x, y));
    if (!P) continue;
    if (P.pts.every(p => p[0] < -200 || p[0] > W + 200 || p[1] < -200 || p[1] > H + 200)) continue;
    const dead = y < minRow();
    items.push({ z: dead ? 1e6 + P.z : P.z + 0.02, draw: c => drawTile(c, x, y, P, now, night, rock) });
    if (rock) pushBlock(items, x, y, night, now);
  }
  // ---- เสาลิฟต์ (ซี่ลวดขึ้นแกน)
  for (const [x, y] of LIFTS) {
    if (y < minRow()) continue;
    const phi = x * DPHI, a = surf(phi, y + 0.5, 0.05), b = [0, 0, y + 0.5];
    const mid = projPt(lerp3(a, b, 0.5)); if (!mid) continue;
    items.push({ z: mid.z, draw: c => drawSpoke(c, a, b, now) });
  }
  // ---- วงแหวนกั้นปล้อง
  for (let k = 1; k <= 3; k++) pushWall(items, k, now);
  // ---- ฝาปลายกระบอก
  pushCap(items, ROWS, now, true);
  if (G.sealed === 0) pushCap(items, 0, now, false);
  if (G.iris) pushIris(items, G.iris.k * SEC, G.iris.open);
  else if (G.sealed > 0) pushIris(items, G.sealed * SEC, 0);   // ม่านเหล็กที่ปิดแล้วค้างเป็นพื้นปลายกระบอกใหม่
  // ---- แคปซูล
  if (G.capsule) { const p = projPt(tileP(G.capsule.x, G.capsule.y, 0.02)); if (p) items.push({ z: p.z - 0.25, draw: c => drawCapsule(c, G.capsule, now) }); }
  // ---- ตัวละคร
  for (const u of G.units) {
    if (!u.alive && now - u.dieT > 900) continue;
    const pos = unitWorld(u, now);
    const p = projPt(pos.foot); if (!p) continue;
    items.push({ z: p.z - 0.3, draw: c => drawUnit3(c, u, pos, now) });
  }
  // ---- อนุภาคดูด / เอฟเฟกต์
  for (const q of parts) { const p = projPt(q.p); if (p) items.push({ z: p.z - 0.1, draw: c => drawPart(c, q, now) }); }
  return items;
}

function drawTile(c, x, y, P, now, night, rock) {
  const fog = fogOf(P.z);
  const hole = holeAt(x, y);
  polyPath(c, P.pts);
  if (hole) {
    c.fillStyle = "#000"; c.fill();
    // มองทะลุรูเห็นอวกาศ
    c.save(); c.clip();
    const cx = P.pts.reduce((s, p) => s + p[0], 0) / P.pts.length, cy = P.pts.reduce((s, p) => s + p[1], 0) / P.pts.length;
    for (let i = 0; i < 9; i++) { c.fillStyle = `rgba(255,255,255,${.4 + hash(x, y, i) * .6})`; c.fillRect(cx + (hash(x, i, 3) - .5) * 60, cy + (hash(i, y, 5) - .5) * 40, 1.5, 1.5); }
    const g = c.createRadialGradient(cx, cy, 2, cx, cy, 60); g.addColorStop(0, "rgba(40,90,200,.5)"); g.addColorStop(1, "rgba(0,0,0,0)");
    c.fillStyle = g; c.fillRect(cx - 60, cy - 60, 120, 120);
    c.restore();
    polyPath(c, P.pts); c.strokeStyle = `rgba(255,${90 + 60 * Math.sin(now / 120)},40,${1 - fog})`; c.lineWidth = 3; c.stroke();
    return;
  }
  const rgb = tileRGB(x, y);
  c.fillStyle = shade(rgb, fog, 1); c.fill();
  if (GLASS.has(x) && y >= minRow()) {
    c.save(); c.clip();
    if (night) for (let i = 0; i < 4; i++) {
      const a = hash(x, y, i), b = hash(y, x, i + 7);
      const pt = projPt(surf((x - .5 + a) * DPHI, y + b, -0.01)); if (pt) { c.fillStyle = `rgba(255,255,255,${(1 - fog) * (.5 + .5 * a)})`; c.fillRect(pt.x, pt.y, 1.6, 1.6); }
    } else {
      const pa = P.pts[0], pb = P.pts[Math.floor(P.pts.length / 2)];
      const g = c.createLinearGradient(pa[0], pa[1], pb[0], pb[1]); g.addColorStop(0, "rgba(255,255,255,.0)"); g.addColorStop(.5, `rgba(220,240,255,${.28 * (1 - fog)})`); g.addColorStop(1, "rgba(255,255,255,0)");
      c.fillStyle = g; c.fill();
    }
    c.restore();
  }
  if (isWater(x, y) && y >= minRow() && fog < .8) { // ประกายน้ำ
    c.save(); c.clip();
    for (let i = 0; i < 3; i++) {
      const a = (hash(x, y, i) + now / 4000) % 1, b = hash(y, x, i + 3);
      const pt = projPt(surf((x - .5 + a) * DPHI, y + b, 0)); if (!pt) continue;
      c.strokeStyle = `rgba(220,240,255,${(1 - fog) * .45})`; c.lineWidth = 1.5; c.beginPath(); c.moveTo(pt.x - 5, pt.y); c.lineTo(pt.x + 5, pt.y); c.stroke();
    }
    c.restore();
  }
  if (TERR[K(x, y)] === "lift" && y >= minRow()) {
    const q = projPoly(tileCorners(x, y, 0.005, 0.2));
    if (q) { polyPath(c, q.pts); c.strokeStyle = `rgba(255,214,90,${(1 - fog) * (.65 + .35 * Math.sin(now / 200))})`; c.lineWidth = 2.5; c.stroke(); }
  }
  for (const col of overlayFill(x, y, now)) { polyPath(c, P.pts); c.fillStyle = col; c.fill(); }
  polyPath(c, P.pts);

}
async function onClick(mx, my) {

  const o = unitAt(t[0], t[1]);

}

async function startRound() {

  if (G.turn === SEALS[2] + 1) {
    // เริ่มนับถอยหลัง: กล้องขึ้นแกน ถอยให้เห็นปล้องสุดท้ายทั้งปล้องและแกนกลางที่ส่องแดง
    V.alarm = .35;
    await shot({ phi: V.cur.phi, z: 31, axis: 1, dist: 4, k: .06 }, 900);
    V.shot.z = 35; V.shot.k = .03;
    await banner(String(BOOM - G.turn + 1), "Colony", "red", 1900);
    await sleep(700);
    release();
  } else if (countdown()) {
    const n = BOOM - G.turn + 1;
    SFX.beep(); kick(.2 + (10 - n) * .07); SFX.rumble(.05 + (10 - n) * .025);
    await banner(String(n), "Colony", "red", 1100);
  } else {
    await banner(`เทิร์น ${G.turn}`, "", "", 1000);
    const n = SEALS[G.sealed] - G.turn + 1;
    if (n <= 3) await sealWarning(n);
  }
  const due = G.tele.filter(t => t.at === G.turn); G.tele = G.tele.filter(t => t.at !== G.turn);
  const older = G.holes.slice();
  for (const t of due.filter(t => t.type === "beam")) { await impactBeam(t); if (checkOver()) return release(); }
  for (const t of due.filter(t => t.type === "meteor")) { await impactMeteor(t); if (checkOver()) return release(); }
  for (const t of due.filter(t => t.type === "capsule")) await landCapsule(t);
  for (const h of older) {
    if (!G.holes.includes(h)) continue;
    const vic = alive().some(u => holeDist(h, u.x, u.y) <= h.radius);
    if (vic) await shot(eventShot(h.cells[0][0], h.cells[0][1]), 550);
    await pullHole(h);
    if (checkOver()) return release();
  }

  scheduleNext();
  SFX.hiss(G.holes.length ? .1 : 0);

}
async function nextActor() {

    const u = G.order[G.cur]; if (!u.alive) continue;
    G.actor = u; V.user.panX = 0; V.user.panZ = 0; V.focusId = null;
    renderOrder(); renderUnit(); renderAct();
    if (u.human) { await sleep(350); UI.reach = reach(u); renderAct(); return; }

// =====================================================================================
//  บอท
// =====================================================================================
// ระยะเดินจริง (ผ่านประตู) จากแต่ละช่องถึงปล้องสุดท้าย — บอทปีนตามนี้ ไม่ใช่แค่ "แถวสูงสุด"
let FIELD = null;
function climbField() {
  const dist = new Map(), q = [];
  for (let y = 30; y < ROWS; y++) for (let x = 0; x < COLS; x++) if (!solid(x, y)) { dist.set(K(x, y), 0); q.push([x, y]); }
  for (let i = 0; i < q.length; i++) {

    for (const [nx, ny] of nbrs(x, y)) { const k = K(nx, ny); if (dist.has(k) || solid(nx, ny)) continue; dist.set(k, d + 1); q.push([nx, ny]); }
  }

function score(u, x, y) {

    if (sl !== null && y < safe) s -= sl <= 0 ? 400 : sl === 1 ? 70 : sl === 2 ? 22 : 0;
  } else s += 74;

    if (t.type === "meteor") { const d = wdist(x, y, t.x, t.y); if (d === 0) s -= 200; else if (d <= t.radius) s -= (t.radius - d + 1) * 9; }

    else if (t.type === "capsule" && t.x === x && t.y === y) s -= 40;
  }
  for (const h of G.holes) if (h.born === G.turn) { const d = holeDist(h, x, y); if (d <= h.radius) s -= (h.radius - d + 1) * 14; }
  if (TERR[K(x, y)] === "lift") s += 10;
  const strong = u.hp + u.armor >= 5;
  for (const o of alive()) if (o !== u) { const d = wdist(x, y, o.x, o.y); if (d === 1) s += strong ? 5 : -4; else if (y >= 30 && d <= 3) s += strong ? 2 : 0; }
  if (G.capsule && wdist(x, y, G.capsule.x, G.capsule.y) === 1 && u.armor < 3 && u.gold >= 3) s += 6;
  return s + Math.random() * 1.5;
}
async function botTurn(u) {

  for (const n of R.values()) { const s = score(u, n.x, n.y); if (s > bs) { bs = s; best = n; } }
  let jumped = false;
  if (u.jumpCd === 0) { const L = jumpLanding(u); if (L && score(u, L[0], L[1]) + 3 > bs + 4) { await doJump(u); jumped = true; } }
  if (!jumped && best && (best.x !== u.x || best.y !== u.y)) {
    UI.path = pathOf(R, K(best.x, best.y)); UI.pathSet = new Set(UI.path.map(([x, y]) => K(x, y)));
    await sleep(250); UI.path = null; UI.pathSet = null;
    await walk(u, pathOf(R, K(best.x, best.y))); u.moved = true; await checkLift(u);
    if (u.alive && u.jumpCd === 0 && !u.jumped) { const L = jumpLanding(u); if (L && score(u, L[0], L[1]) > score(u, u.x, u.y) + 6) await doJump(u); }
  }
  if (!u.alive) return;
  if (capAdj(u) && u.armor < 3) { const it = G.capsule.stock.find(i => i.qty > 0 && u.gold >= i.price); if (it) { u.gold -= it.price; it.qty--; it.use(u); float(u, "+◆", "#9fd0ff"); await sleep(300); } }
  const foes = nbrs(u.x, u.y).map(([x, y]) => unitAt(x, y)).filter(o => o && o !== u).sort((a, b) => (a.hp + a.armor) - (b.hp + b.armor));
  if (foes.length) { await sleep(200); await attack(u, foes[0]); }
  await sleep(300);
}

// =====================================================================================
//  HUD
// =====================================================================================
const pfStyle = u => `--c:${u.color};${u.im.bad ? "" : `background-image:url('${PORTRAITS[u.id]}')`}`;
function renderOrder() {
  const el = document.getElementById("order");
  const list = G.order.length ? G.order : G.units;
  el.innerHTML = list.map((u, i) => `<div class="chip ${u === G.actor ? "cur" : ""} ${!u.alive ? "dead" : i < G.cur ? "done" : ""}"><div class="pf" style="${pfStyle(u)}">${u.im.ok ? "" : u.name[0]}</div><div class="nm">${u.name}</div></div>`).join("");
}
function renderUnit() {
  const u = (G.actor && G.actor.human) || !G.actor ? human() : G.actor;
  const el = document.getElementById("unit");
  if (!u) return;
  const pips = Array.from({ length: 7 }, (_, i) => `<i class="pip ${i < u.hp ? "h" : ""}"></i>`).join("") + `<i class="pip sep"></i>` + Array.from({ length: 3 }, (_, i) => `<i class="pip ${i < u.armor ? "a" : ""}"></i>`).join("");
  el.innerHTML = `<div class="pf" style="${pfStyle(u)}">${u.im.ok ? "" : u.name[0]}</div><div><div class="nm">${u.name}</div><div class="pips">${pips}</div>
    <div class="row"><span>เดิน <b>${u.mov}</b></span><span><i class="coin"></i><b>${u.gold}</b></span><span>แถว <b>${u.y + 1}</b></span></div></div>`;
  el.style.opacity = u.alive ? 1 : .45;
}
function renderAct() {
  const a = G.actor, mine = a && a.human && !UI.busy && !G.over;
  const bj = document.getElementById("bJump");
  bj.disabled = !mine || a.jumped || a.jumpCd > 0 || a.shopped;
  const me = human();
  bj.innerHTML = "กระโดด" + (me && me.jumpCd > 0 ? `<span class="cd">${me.jumpCd}</span>` : "");
  document.getElementById("bShop").disabled = !mine || !capAdj(a);
  document.getElementById("bEnd").disabled = !mine;
}
function renderHdr() {
  document.getElementById("turnNo").textContent = `เทิร์น ${G.turn}`;
  document.getElementById("dn").textContent = isNight() ? "☾" : "☀";
  const el = document.getElementById("seal"), n = document.getElementById("sealN");
  if (countdown()) { el.className = "panel boom"; n.textContent = BOOM - G.turn + 1; }
  else { const left = SEALS[G.sealed] - G.turn + 1; n.textContent = left; el.className = "panel" + (left <= 2 ? " warn" : ""); }
}

// =====================================================================================
//  loop
// =====================================================================================
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (now - lastT) / 1000); lastT = now;
  stepTweens(now);
  stepCamera(dt);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  if (V.mode === "flat") renderFlat(now); else renderOrbit(now);
  vignEl.style.opacity = alarmTint() * 0.9;
  drawMini(now);
}
genMap();
makeUnits();
renderOrder(); renderUnit(); renderAct();
{ const h = human(); V.cur.phi = h.x * DPHI; V.cur.z = h.y + .5; }
requestAnimationFrame(frame);
setTimeout(startRound, 500);
</script>
