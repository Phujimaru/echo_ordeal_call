const LW = 1280, LH = 720, BC = 14, BR = 14;
const PITCH = 32, CAM_D = 22, NEAR_Y = 528, OXC = 640;
const SN = Math.sin(PITCH * Math.PI / 180), CS = Math.cos(PITCH * Math.PI / 180);
const HCe = BC / 2, HRe = BR / 2;
const FOC = (() => {
  const foc0 = 66.25 * (CAM_D - 6 * CS);

  const dn = CAM_D - HRe * CS, df = CAM_D + HRe * CS, farY = far0 - (HRe - 6) * 7.5;
  return Math.min((NEAR_Y - farY) / (HRe * SN * (1 / dn + 1 / df)), 1140 * dn / (2 * HCe));
})();
const OY = NEAR_Y - HRe * SN * FOC / (CAM_D - HRe * CS);
// กระดาน (x, y, สูง z) → [sx, sy, สเกล]
function P(x, y, z = 0) {

  g.beginPath(); g.moveTo(a[0], a[1]); g.lineTo(b[0], b[1]); g.lineTo(c[0], c[1]); g.lineTo(d[0], d[1]); g.closePath();
}

  for (let i = pts.length - 1; i >= 0; i--) { const p = pts[i]; while (up.length >= 2 && cr(up[up.length - 2], up[up.length - 1], p) <= 0) up.pop(); up.push(p); }

// เส้นโซ่บนจอ: pts = [[sx, sy, s], …] (หนาแน่น) → วางชิ้นทองตามความยาว · prog = สัดส่วนที่โผล่แล้ว
function chainPieces(pts, size = .5) {
  const out = []; let acc = 0, next = 0;

    for (let j = 0; j < 7; j++) { a += (r() - .5) * .5; px += Math.cos(a) * L / 7; py += Math.sin(a) * L / 7; c.lineTo(px, py); }

  }
  c.restore();
}

// =================================================================== วาดเฟรม
function compositeLayer(src) { g.save(); g.setTransform(1, 0, 0, 1, 0, 0); g.drawImage(src, 0, 0); g.restore(); }
function prepLayer(i) { const c = layers[i].getContext("2d"); c.setTransform(1, 0, 0, 1, 0, 0); c.clearRect(0, 0, layers[i].width, layers[i].height); setView(c); return c; }
function zeroOpts(extra = {}) { return { sv: stage(), edges: liveEdges(), tokens: 1, pickup: true, pips: true, ...extra }; }
function beam(c, h, w, a) {
  if (a <= 0) return;
  const [bx, by, s] = P(CENTER[0], CENTER[1], 0), [, ty] = P(CENTER[0], CENTER[1], 26 * h);
  c.save(); c.globalCompositeOperation = "lighter";
  const W1 = (14 + 40 * w) * s / 60;
  const gr = c.createLinearGradient(bx - W1, 0, bx + W1, 0);
  gr.addColorStop(0, "rgba(255,90,180,0)"); gr.addColorStop(.5, `rgba(255,120,200,${.55 * a})`); gr.addColorStop(1, "rgba(255,90,180,0)");
  c.fillStyle = gr; c.fillRect(bx - W1, ty, W1 * 2, by - ty);
  const W2 = (2 + 6 * w) * s / 60;
  c.fillStyle = `rgba(255,255,255,${a})`; c.fillRect(bx - W2, ty, W2 * 2, by - ty);
  c.fillStyle = `rgba(255,170,225,${.7 * a})`; c.beginPath(); c.ellipse(bx, by, (1.2 + 2 * w) * s, (1.2 + 2 * w) * s * SN, 0, 0, Math.PI * 2); c.fill();
  glow(c, bx, by, (2 + 3 * w) * s, "255,150,215", .6 * a);
  c.restore();
}
function waveRing(c, cx, cy, r, a, rgb) {
  if (a <= 0) return;
  c.save(); c.globalCompositeOperation = "lighter";
  for (const [z, al, lw] of [[0, 1, 7], [.35, .55, 4], [.9, .35, 3], [1.7, .2, 2], [2.8, .1, 2]]) {
    gEllipse(c, cx, cy, r, z, 96); c.strokeStyle = `rgba(${rgb},${al * a})`; c.lineWidth = lw; c.stroke();
  }
  gEllipse(c, cx, cy, r, 0, 96); c.strokeStyle = `rgba(255,255,255,${.8 * a})`; c.lineWidth = 2; c.stroke();
  c.restore();
}
function sealFxAt(t, i) {
  const fx = []; fx[i] = { crack: seg(t, .2, .7), shake: 6 * seg(t, .1, .7), hp: Math.ceil(3 * (1 - seg(t, .45, .68))), ar: Math.ceil(2 * (1 - seg(t, .2, .42))) };
  return fx;
}
function lungeAt(t) {
  const ch = st.breaker, [sx, sy] = sealPos(st.breakIdx);
  return { id: ch.id, dx: Math.sign(sx - ch.zero[0] - .5) * .35, dy: Math.sign(sy - ch.zero[1] - .5) * .35, k: Math.sin(seg(t, .35, .85) * Math.PI) };
}
function render(dt) {
  const shx = (Math.random() - .5) * st.shake, shy = (Math.random() - .5) * st.shake;
  g.setTransform(1, 0, 0, 1, 0, 0); g.fillStyle = "#07060c"; g.fillRect(0, 0, cv.width, cv.height);
  setView(g, shx, shy);
  const t = st.t;
  if (st.mode === "normal") {
    renderNormal(g, 0);
  } else if (st.mode === "enter") {
    // 0–0.8 เวลาหยุด · 0.8–1.6 ลำแสง · 1.8–3.4 คลื่น · 3.4–4.6 โซ่ทองล้อมขอบ · 4.3–5.2 ผนึก · 5.0–5.8 โซ่พันผนึก · 5.6–7.9 ชื่อ
    renderNormal(g, seg(t, 0, .8));
    const r = 15 * easeInOut(seg(t, 1.8, 3.4));
    if (r > 0) {
      const edges = {}; for (let i = 0; i < 4; i++) edges["e" + i] = easeInOut(seg(t, 3.4 + i * .12, 4.5 + i * .12));
      const z = prepLayer(0);
      renderZero(z, { sv: 1, edges, tokens: seg(t, 3.2, 3.8), pickup: t > 5.6, pips: t > 5.6,
        seals: [0, 1, 2, 3].map((i) => seg(t, 4.3 + i * .18, 4.8 + i * .18)), wraps: [0, 1, 2, 3].map((i) => seg(t, 5.0 + i * .12, 5.6 + i * .12)) });
      g.save(); wavePath(g, CENTER[0], CENTER[1], r); g.clip(); compositeLayer(layers[0]); g.restore();
      waveRing(g, CENTER[0], CENTER[1], r, 1 - seg(t, 3.0, 3.5), "255,140,210");
    }
    const bh = easeOut(seg(t, .8, 1.5)), bw = seg(t, 1.5, 1.9) * (1 - seg(t, 3.0, 3.6)), ba = seg(t, .8, .9) * (1 - seg(t, 3.2, 3.8));
    beam(g, bh, bw, ba);
    for (let i = 0; i < 4; i++) if (!(st.ign & (1 << i)) && t >= 4.45 + i * .18) { st.ign |= 1 << i; const [x, y] = sealPos(i), [sx, sy, s] = P(x, y, SEAL_Z); burst(sx, sy, s, 14, "255,122,200"); st.shake = 6; }
    if (!(st.ign & 16) && t >= 5.65) { st.ign |= 16; st.shake = 9; }
    drawParts(g, dt);
    drawHud(g, seg(t, 6.6, 7.4));
    drawTitle(g, seg(t, 5.6, 7.9), true, 1);
  } else if (st.mode === "zero") {
    renderZero(g, zeroOpts());
    drawParts(g, dt);
    drawHud(g, 1);
  } else if (st.mode === "break") {
    const i = st.breakIdx, [sx, sy] = sealPos(i), lunge = lungeAt(t);
    const oldL = prepLayer(0); renderZero(oldL, zeroOpts({ sv: st.fromStage, lunge, sealFx: t < .7 ? sealFxAt(t, i) : null }));
    compositeLayer(layers[0]);
    const r = 24 * easeInOut(seg(t, .8, 2.1));
    if (r > 0) {
      const nl = prepLayer(1), nv = st.fromStage + 1;
      renderZero(nl, zeroOpts({ sv: nv, lunge }));
      g.save(); wavePath(g, sx, sy, r); g.clip(); compositeLayer(layers[1]); g.restore();
      waveRing(g, sx, sy, r, 1 - seg(t, 1.8, 2.2), ST[nv].acc);
    }
    drawParts(g, dt);
    drawHud(g, 1);
    drawTitle(g, seg(t, 1.5, 3.3), false, st.fromStage + 1);
  } else if (st.mode === "release") {
    const i = st.breakIdx, ch = st.breaker;
    if (t < 1.45) {
      const z = prepLayer(0);
      renderZero(z, zeroOpts({ sv: 4, lunge: lungeAt(t), sealFx: t < .7 ? sealFxAt(t, i) : null }));
      compositeLayer(layers[0]);
      drawScreenCracks(g, easeOut(seg(t, .9, 1.42)));
      drawParts(g, dt);
      drawHud(g, 1 - seg(t, 1.0, 1.4));
      g.save(); g.globalCompositeOperation = "lighter"; const [cx, cy] = crackOrigin(); glow(g, cx, cy, 1400 * seg(t, 1.1, 1.45), "255,220,245", seg(t, 1.1, 1.45)); g.restore();
    } else {
      renderNormal(g, 0, false);
      for (const c of CHARS) drawToken(g, c, c.home[0], c.home[1], seg(t, 1.6, 2.1));
      const k = t - 1.45;
      for (const sh of st.shards || []) {
        const tt = Math.max(0, k - sh.delay), dx = sh.vx * tt, dy = sh.vy * tt + 900 * tt * tt, rot = sh.vr * tt;
        const a = 1 - clamp01(tt / 1.3); if (a <= 0) continue;
        g.save(); g.globalAlpha = a;
        g.translate(sh.mx + dx, sh.my + dy); g.rotate(rot); g.translate(-sh.mx, -sh.my);
        g.beginPath(); sh.pts.forEach((p, j) => j ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1])); g.closePath(); g.clip();
        const [vx, vy, vw, vh] = visRect(); g.drawImage(snap, vx, vy, vw, vh);
        g.strokeStyle = "rgba(255,220,240,.8)"; g.lineWidth = 2; g.stroke();
        g.restore();
      }
      drawParts(g, dt);
      // ความเสียหาย 2 ทุกคน ยกเว้นคนทุบผนึกสุดท้าย
      const dk = seg(t, 2.3, 4.2);
      if (dk > 0 && dk < 1) for (const c of CHARS) {
        const [hx, hy, s] = P(c.home[0] + .5, c.home[1] + .5, 1.6 + dk * .8), a = Math.min(1, dk / .1, (1 - dk) / .25);
        g.save(); g.globalAlpha = a; g.textAlign = "center"; g.textBaseline = "middle";
        if (c === ch) {
          g.strokeStyle = "#ff9fd6"; g.lineWidth = 3; g.shadowColor = "#ff5fb4"; g.shadowBlur = 14;
          const [px, py, ps] = P(c.home[0] + .5, c.home[1] + .5, .95); g.beginPath(); g.arc(px, py, .62 * ps * (1 + .1 * Math.sin(t * 12)), 0, Math.PI * 2); g.stroke();
        } else {
          g.font = `800 ${Math.round(.62 * s)}px Chakra Petch`; g.lineWidth = 5; g.strokeStyle = "#2a0710"; g.strokeText("-2", hx, hy); g.fillStyle = "#ff5f6f"; g.fillText("-2", hx, hy);
        }
        g.restore();
      }
    }
  }
  if (st.flash > 0 || (st.mode === "release" && t > 1.2 && t < 2.2)) {
    const f = Math.max(st.flash, st.mode === "release" ? Math.max(0, 1 - Math.abs(t - 1.45) / .45) : 0);
    g.save(); g.setTransform(1, 0, 0, 1, 0, 0); g.fillStyle = `rgba(255,240,250,${f})`; g.fillRect(0, 0, cv.width, cv.height); g.restore();
  }
}
function loop(now) {
  const dt = Math.min(.05, (now - last) / 1000) * speed; last = now; time += dt;
  if (cv.width !== Math.round(innerWidth * DPR) || cv.height !== Math.round(innerHeight * DPR)) resize();
  update(dt); if (cv.width > 0 && cv.height > 0) render(dt);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

// =================================================================== ปุ่ม (เฉพาะหน้าต้นแบบ)
const sealBox = document.getElementById("seals");
const sealBtns = SEALS.map((s, i) => { const b = document.createElement("button"); b.textContent = s.name; b.onclick = () => startBreak(i); sealBox.appendChild(b); return b; });
const enterBtn = document.getElementById("enter"), slowBtn = document.getElementById("slow"), musicBtn = document.getElementById("music");
function syncButtons() {
  enterBtn.disabled = st.mode !== "normal";
  sealBtns.forEach((b, i) => { b.disabled = st.mode !== "zero" || st.broken[i]; });
}
enterBtn.onclick = () => { if (st.mode !== "normal") return; st.mode = "enter"; st.t = 0; st.fired = false; st.ign = 0; syncButtons(); };
slowBtn.onclick = () => { speed = speed === 1 ? .35 : 1; slowBtn.classList.toggle("on", speed !== 1); };
document.getElementById("reset").onclick = () => { resetAll(); setMusic(0); };
musicBtn.onclick = () => { musicOn = !musicOn; musicBtn.classList.toggle("on", musicOn); if (musicOn && musicWant) { const n = musicWant; musicWant = 0; setMusic(n); } };
cv.addEventListener("click", (e) => {
  if (st.mode !== "zero") return;
  const lx = (e.clientX - view.ox) / view.k, ly = (e.clientY - view.oy) / view.k;
  for (let i = 0; i < 4; i++) {
    if (st.broken[i]) continue;
    const [x, y] = sealPos(i), [sx, sy, s] = P(x, y, SEAL_Z);
    if (Math.hypot(lx - sx, ly - sy) < 1.1 * s) { startBreak(i); return; }
  }
});
// ?at=1..4 — ข้ามไประดับนั้นทันที (ตรวจภาพ)
const q = new URLSearchParams(location.search);
if (q.get("at")) {
  st.mode = "zero";
  const n = Math.max(1, Math.min(4, +q.get("at") || 1));
  for (let i = 0; i < n - 1; i++) { st.broken[i] = true; st.snapped.add("w" + i); st.snapped.add("e" + i); st.snapped.add("e" + ((i + 3) % 4)); }
}
syncButtons();
