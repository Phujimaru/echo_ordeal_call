<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Road Trip Van</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root { --panel: rgba(255,255,255,.88); --ink: #1f2a33; --line: rgba(31,42,51,.14); --on: #ff8a3d; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #cfe6f2; color: var(--ink);
    font-family: "Noto Sans Thai", system-ui, sans-serif; }
  canvas { display: block; }
  #ui { position: fixed; left: 12px; top: 12px; display: flex; flex-direction: column; gap: 6px; max-width: min(560px, calc(100vw - 24px)); }
  .row { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; background: var(--panel); padding: 5px; border-radius: 10px;
    border: 1px solid var(--line); backdrop-filter: blur(6px); }
  .row b { font-size: 12px; padding: 0 4px; opacity: .6; }
  button { font: inherit; font-size: 13px; border: 1px solid var(--line); background: #fff; color: var(--ink);
    border-radius: 7px; padding: 4px 9px; cursor: pointer; }
  button:hover { border-color: var(--on); }
  button.on { background: var(--on); color: #fff; border-color: var(--on); }
  .sw { width: 24px; height: 24px; padding: 0; border-radius: 50%; }
  .sw.on { outline: 3px solid var(--ink); outline-offset: 1px; }
  #plate { font: inherit; font-weight: 700; font-size: 14px; width: 110px; padding: 3px 8px; border: 2px solid var(--ink); border-radius: 6px; background: #fbf8ef; text-align: center; }
  #tip { position: fixed; pointer-events: none; padding: 3px 9px; border-radius: 8px; background: rgba(31,42,51,.9); color: #fff;
    font-size: 13px; font-weight: 700; transform: translate(14px, 10px); display: none; white-space: nowrap; }
  #hud { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); display: none; align-items: flex-end; gap: 18px;
    background: rgba(17,24,33,.78); color: #fff; padding: 10px 18px; border-radius: 16px; backdrop-filter: blur(6px); }
  #hud .spd { font-size: 46px; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
  #hud .u { font-size: 12px; opacity: .7; margin-left: 4px; }
  #hud .col { display: flex; flex-direction: column; gap: 5px; min-width: 120px; }
  #hud .km { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
  #hud .bar { height: 8px; border-radius: 4px; background: rgba(255,255,255,.18); overflow: hidden; }
  #hud .bar i { display: block; height: 100%; width: 100%; background: linear-gradient(90deg, #38e8ff, #a26bff); }
  #hud .st { font-size: 13px; color: #ffd27a; font-weight: 700; }
  #drivecams { display: none; }
  #yt { font: inherit; font-size: 13px; width: 170px; padding: 4px 8px; border: 1px solid var(--line); border-radius: 7px; }
  #ytbtn.on { background: #ff3b30; border-color: #ff3b30; }
  #ytq { font-size: 12px; font-weight: 700; opacity: .6; min-width: 14px; }
  #ytwrap { position: fixed; right: 14px; bottom: 14px; width: 320px; height: 200px; border-radius: 12px; overflow: hidden;
    box-shadow: 0 8px 28px rgba(0,0,0,.35); background: #000; visibility: hidden; }
  #ytwrap.on { visibility: visible; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="ui">
  <div class="row" id="views"></div>
  <div class="row" id="drivecams"></div>
  <div class="row" id="styles"></div>
  <div class="row" id="modes"></div>
  <div class="row" id="radio"><b>วิทยุ</b></div>
  <div class="row" id="paint"><input id="plate" maxlength="9" value="กข 4567"></div>
  <div class="row" id="parts"></div>
</div>
<div id="tip"></div>
<div id="ytwrap"><div id="ytbox"></div></div>
<div id="hud">
  <div><span class="spd" id="spd">0</span><span class="u">กม./ชม.</span></div>
  <div class="col">
    <div class="km" id="km">0.0 กม.</div>
    <div class="bar"><i id="nb"></i></div>
    <div class="st" id="st"></div>
  </div>
</div>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { RoundedBoxGeometry } from "three/addons/geometries/RoundedBoxGeometry.js";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";

// =====================================================================  renderer / scene
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
const envTex = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environment = envTex;

const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.05, 700);
camera.position.set(11, 6.5, 11);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.7, 0);
controls.enableDamping = true;
controls.minDistance = 3;
controls.maxDistance = 45;
controls.maxPolarAngle = Math.PI * 0.497;

const hemi = new THREE.HemisphereLight(0xe3f3ff, 0x7d6c56, 0.7);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff0d8, 2.6);
sun.position.set(9, 15, 7);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -12, right: 12, top: 12, bottom: -12, near: 1, far: 50 });
sun.shadow.bias = -0.0004;
sun.shadow.normalBias = 0.02;
scene.add(sun); scene.add(sun.target);

const TAU = Math.PI * 2;
const hash = (a, b = 0, c = 0) => { let h = (a * 374761393 + b * 668265263 + c * 2147483647) | 0; h = (h ^ (h >>> 13)) * 1274126177; return ((h ^ (h >>> 16)) >>> 0) / 4294967296; };
const rand = (a, b) => a + Math.random() * (b - a);
const std = (color, o = {}) => new THREE.MeshStandardMaterial({ color, roughness: 0.7, metalness: 0.05, ...o });
const box = (w, h, d) => new THREE.BoxGeometry(w, h, d);
const rbox = (w, h, d, r = 0.05) => new RoundedBoxGeometry(w, h, d, 3, Math.min(r, w / 2 - 0.001, h / 2 - 0.001, d / 2 - 0.001));
function shadowAll(o) { o.traverse((m) => { if (m.isMesh) { m.castShadow = true; m.receiveShadow = true; } }); return o; }
function canvasTex(w, h, draw) {
  const c = document.createElement("canvas"); c.width = w; c.height = h; draw(c.getContext("2d"), w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t;
}

// =====================================================================  sky / world
const skyU = { top: { value: new THREE.Color(0x5fa8e6) }, bot: { value: new THREE.Color(0xeaf3f6) } };
const sky = new THREE.Mesh(new THREE.SphereGeometry(500, 32, 16), new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, fog: false, uniforms: skyU,
  vertexShader: "varying vec3 vP; void main(){ vP = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.); }",
  fragmentShader: "uniform vec3 top; uniform vec3 bot; varying vec3 vP; void main(){ float h = clamp(vP.y*1.8+0.05,0.,1.); gl_FragColor = vec4(mix(bot,top,pow(h,0.65)),1.); }",
}));
scene.add(sky);
const stars = (() => {
  const p = [];
  for (let i = 0; i < 700; i++) { const u = Math.random() * TAU, v = Math.random() * 0.45 + 0.08; p.push(Math.cos(u) * Math.cos(v) * 450, Math.sin(v) * 450, Math.sin(u) * Math.cos(v) * 450); }
  const g = new THREE.BufferGeometry(); g.setAttribute("position", new THREE.Float32BufferAttribute(p, 3));
  return new THREE.Points(g, new THREE.PointsMaterial({ color: 0xffffff, size: 1.6, sizeAttenuation: false, fog: false, transparent: true, opacity: 0.85 }));
})();
stars.visible = false; scene.add(stars);

const grassTex = canvasTex(256, 256, (g) => {
  g.fillStyle = "#9fbf6e"; g.fillRect(0, 0, 256, 256);
  for (let i = 0; i < 2600; i++) { g.fillStyle = `hsl(${85 + Math.random() * 30},${35 + Math.random() * 25}%,${38 + Math.random() * 22}%)`; g.fillRect(Math.random() * 256, Math.random() * 256, 2, 2 + Math.random() * 4); }
});
grassTex.wrapS = grassTex.wrapT = THREE.RepeatWrapping; grassTex.repeat.set(100, 100);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(500, 500), new THREE.MeshStandardMaterial({ map: grassTex, roughness: 1 }));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);

const LANE = 3.3, ROAD_W = 10.8;
const asphaltTex = canvasTex(256, 256, (g) => {
  g.fillStyle = "#575c64"; g.fillRect(0, 0, 256, 256);
  for (let i = 0; i < 5000; i++) { const l = 28 + Math.random() * 22; g.fillStyle = `hsl(215,6%,${l}%)`; g.fillRect(Math.random() * 256, Math.random() * 256, 1.5, 1.5); }
  for (let i = 0; i < 6; i++) { g.strokeStyle = "rgba(20,22,26,.25)"; g.lineWidth = 2; g.beginPath(); g.moveTo(Math.random() * 256, Math.random() * 256); g.lineTo(Math.random() * 256, Math.random() * 256); g.stroke(); }
});
asphaltTex.wrapS = asphaltTex.wrapT = THREE.RepeatWrapping; asphaltTex.repeat.set(60, 1.4);
const road = new THREE.Mesh(new THREE.PlaneGeometry(500, ROAD_W), new THREE.MeshStandardMaterial({ map: asphaltTex, roughness: 0.92 }));
road.rotation.x = -Math.PI / 2; road.position.y = 0.012; road.receiveShadow = true; scene.add(road);
const lineMat = std(0xf3efe2, { roughness: 0.6 });
for (const z of [-ROAD_W / 2 + 0.25, ROAD_W / 2 - 0.25]) {
  const e = new THREE.Mesh(new THREE.PlaneGeometry(500, 0.16), lineMat); e.rotation.x = -Math.PI / 2; e.position.set(0, 0.02, z); scene.add(e);
}
const shoulderMat = std(0xc9b48a, { roughness: 1 });
for (const z of [-ROAD_W / 2 - 0.9, ROAD_W / 2 + 0.9]) {
  const s = new THREE.Mesh(new THREE.PlaneGeometry(500, 1.8), shoulderMat); s.rotation.x = -Math.PI / 2; s.position.set(0, 0.008, z); s.receiveShadow = true; scene.add(s);
}

const SPAN = 180; // ของข้างทางวนทุก 180 หน่วย
const scrollers = [];
function scroller(o, k = 1) { o.userData.k = k; scrollers.push(o); scene.add(o); return o; }
for (let x = -SPAN / 2; x < SPAN / 2; x += 5) for (const z of [-LANE / 2, LANE / 2]) {
  const d = new THREE.Mesh(new THREE.PlaneGeometry(2.4, 0.16), lineMat); d.rotation.x = -Math.PI / 2; d.position.set(x, 0.022, z); d.receiveShadow = true; scroller(d);
}
const leafMats = [std(0x5f9a4a, { roughness: 0.9 }), std(0x76ad52, { roughness: 0.9 }), std(0x4e8a5a, { roughness: 0.9 }), std(0x8db85a, { roughness: 0.9 })];
const barkMat = std(0x7a5636, { roughness: 1 });
function makeTree(i) {
  const g = new THREE.Group(), kind = i % 3, leaf = leafMats[i % leafMats.length];
  const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.16, 0.24, 1.6, 8), barkMat); trunk.position.y = 0.8; g.add(trunk);
  if (kind === 0) { for (let k = 0; k < 3; k++) { const c = new THREE.Mesh(new THREE.ConeGeometry(1.5 - k * 0.35, 1.7, 9), leaf); c.position.y = 1.9 + k * 0.85; g.add(c); } }
  else if (kind === 1) { for (let k = 0; k < 4; k++) { const s = new THREE.Mesh(new THREE.IcosahedronGeometry(0.85 + hash(i, k) * 0.4, 1), leaf); s.position.set((hash(i, k, 1) - 0.5) * 1.2, 2.2 + hash(i, k, 2) * 0.9, (hash(i, k, 3) - 0.5) * 1.2); g.add(s); } }
  else { trunk.scale.set(0.8, 2.2, 0.8); trunk.position.y = 1.75; for (let k = 0; k < 6; k++) { const f = new THREE.Mesh(new THREE.ConeGeometry(0.28, 2.2, 5), leaf); f.position.set(0, 3.6, 0); f.rotation.set(1.15, k / 6 * TAU, 0, "YXZ"); f.translateY(0.9); g.add(f); } }
  const s = 0.8 + hash(i, 9) * 0.7; g.scale.setScalar(s); return shadowAll(g);
}
for (let i = 0; i < 90; i++) {
  const t = makeTree(i), side = i % 2 ? 1 : -1;
  t.position.set(-SPAN / 2 + hash(i, 1) * SPAN, 0, side * (ROAD_W / 2 + 3 + hash(i, 2) * 40));
  t.rotation.y = hash(i, 3) * TAU; scroller(t);
}
for (let i = 0; i < 70; i++) {
  const b = new THREE.Mesh(new THREE.IcosahedronGeometry(0.35 + hash(i, 5) * 0.35, 0), leafMats[(i + 1) % 4]);
  b.position.set(-SPAN / 2 + hash(i, 6) * SPAN, 0.2, (i % 2 ? 1 : -1) * (ROAD_W / 2 + 2 + hash(i, 7) * 12)); b.scale.y = 0.7; shadowAll(b); scroller(b);
}
const lampMats = [];
for (let x = -SPAN / 2; x < SPAN / 2; x += 18) {
  const g = new THREE.Group(), m = std(0x9aa3ad, { metalness: 0.6, roughness: 0.35 });
  const p = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.11, 5.4, 10), m); p.position.y = 2.7; g.add(p);
  const arm = new THREE.Mesh(box(0.08, 0.08, 1.6), m); arm.position.set(0, 5.3, 0.75); g.add(arm);
  const lm = new THREE.MeshStandardMaterial({ color: 0xfff3d0, emissive: 0xffd68a, emissiveIntensity: 0 }); lampMats.push(lm);
  const head = new THREE.Mesh(rbox(0.5, 0.14, 0.3, 0.05), lm); head.position.set(0, 5.22, 1.5); g.add(head);
  g.position.set(x, 0, -ROAD_W / 2 - 1.2); shadowAll(g); scroller(g);
}
const hills = new THREE.Group(); scene.add(hills);
for (let i = 0; i < 14; i++) {
  const h = new THREE.Mesh(new THREE.SphereGeometry(1, 20, 10), std(i % 2 ? 0x7da86a : 0x6b9a78, { roughness: 1 }));
  const side = i % 2 ? 1 : -1; h.scale.set(30 + hash(i, 1) * 40, 10 + hash(i, 2) * 14, 18 + hash(i, 3) * 10);
  h.position.set(-200 + i * 32, -2, side * (110 + hash(i, 4) * 60)); hills.add(h);
}
const clouds = [];
const cloudMat = std(0xffffff, { roughness: 1, emissive: 0xffffff, emissiveIntensity: 0.15 });
for (let i = 0; i < 12; i++) {
  const g = new THREE.Group();
  for (let k = 0; k < 5; k++) { const s = new THREE.Mesh(new THREE.IcosahedronGeometry(2 + hash(i, k) * 2.2, 1), cloudMat); s.position.set(k * 2.4 - 5, hash(i, k, 1) * 1.5, (hash(i, k, 2) - 0.5) * 3); s.scale.y = 0.6; g.add(s); }
  g.position.set(-150 + i * 27, 36 + hash(i, 5) * 14, -80 + hash(i, 6) * 160); scene.add(g); clouds.push(g);
}

// =====================================================================  traffic
const traffic = [];
const CAR_COLS = [0xe8504a, 0xf2c94c, 0x5aa0e0, 0xf0f0ea, 0x3fae7a, 0x9b6bd8];
function makeCar(i) {
  const g = new THREE.Group(), paintC = new THREE.MeshPhysicalMaterial({ color: CAR_COLS[i % CAR_COLS.length], roughness: 0.35, clearcoat: 0.8, clearcoatRoughness: 0.2 });
  const b = new THREE.Mesh(rbox(4.3, 0.85, 2.0, 0.25), paintC); b.position.y = 0.85; g.add(b);
  const c = new THREE.Mesh(rbox(2.3, 0.75, 1.8, 0.25), paintC); c.position.set(-0.3, 1.6, 0); g.add(c);
  const gl = new THREE.Mesh(rbox(2.32, 0.5, 1.82, 0.2), std(0x22323f, { roughness: 0.1, metalness: 0.3 })); gl.position.set(-0.3, 1.65, 0); gl.scale.set(0.98, 1, 1.002); g.add(gl);
  for (const x of [1.35, -1.35]) for (const z of [0.9, -0.9]) { const w = new THREE.Mesh(new THREE.CylinderGeometry(0.42, 0.42, 0.3, 18), std(0x1e1f22)); w.rotation.x = Math.PI / 2; w.position.set(x, 0.42, z); g.add(w); }
  const tl = new THREE.MeshStandardMaterial({ color: 0xd8342c, emissive: 0xff2a1a, emissiveIntensity: 0.6 });
  for (const z of [0.7, -0.7]) { const l = new THREE.Mesh(box(0.06, 0.18, 0.36), tl); l.position.set(-2.16, 1.0, z); g.add(l); }
  g.userData.tail = tl;
  return shadowAll(g);
}
for (let i = 0; i < 5; i++) {
  const car = makeCar(i); car.visible = false; scene.add(car);
  traffic.push({ car, lane: [-1, 0, 1][i % 3], v: 0, x: 0 });
}
function respawnCar(t, ahead) {
  t.lane = [-1, 0, 1][Math.floor(Math.random() * 3)];
  t.v = rand(9, 17); t.x = ahead ? rand(60, 110) : rand(-70, -50);
  if (!ahead) t.v = drive.v + rand(4, 8);
}

// =====================================================================  van
// ด้านหน้ารถ = +X · ขวามือคนขับ = +Z (พวงมาลัยขวาแบบไทย) · ห้องใน 3 × 7 ช่อง
const W = 3.4, HW = W / 2, T = 0.12;
const tileX = (i) => 2.5 - i;
const FLOOR = 0.62;

const van = new THREE.Group(); scene.add(van);
const body = new THREE.Group(); van.add(body);
const wheelRig = new THREE.Group(); van.add(wheelRig);
function mesh(geo, mat, x = 0, y = 0, z = 0, parent = body) { const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); parent.add(m); return shadowAll(m); }
function grp(x = 0, y = 0, z = 0, parent = body) { const g = new THREE.Group(); g.position.set(x, y, z); parent.add(g); return g; }
const interactives = [];
const animated = [];
function anim(obj, prop, axis) { const a = { obj, prop, axis, tgt: obj[prop][axis] }; animated.push(a); return a; }
function interactive(g, name, act) {
  g.userData.act = act; g.userData.iname = name;
  g.traverse((m) => { if (m.isMesh) { const o = m.material; m.material = o.clone(); if (o === paint) m.material.userData.isPaint = true; m.userData.owner = g; m.userData.baseEm = m.material.emissive ? m.material.emissive.clone() : null; } });
  interactives.push(g); return g;
}


const paint = new THREE.MeshPhysicalMaterial({ color: 0x7fb8d8, roughness: 0.32, metalness: 0.1, clearcoat: 1, clearcoatRoughness: 0.12 });
const cream = new THREE.MeshPhysicalMaterial({ color: 0xf6efe0, roughness: 0.4, clearcoat: 0.6, clearcoatRoughness: 0.2 });
const trim = std(0x2d333b, { roughness: 0.55 });
const chrome = std(0xe3e7ec, { roughness: 0.15, metalness: 1 });
const glass = new THREE.MeshPhysicalMaterial({ color: 0x29445a, roughness: 0.03, metalness: 0.1, transparent: true, opacity: 0.38, side: THREE.DoubleSide, depthWrite: false });
const lining = std(0xece3d0, { roughness: 0.9, side: THREE.DoubleSide });
const headMat = new THREE.MeshStandardMaterial({ color: 0xfff6d8, emissive: 0xfff2c0, emissiveIntensity: 0.15, roughness: 0.1 });
const tailMat = new THREE.MeshStandardMaterial({ color: 0xd8342c, emissive: 0xff2a1a, emissiveIntensity: 0.1, roughness: 0.25 });
const floorMat = new THREE.MeshStandardMaterial({ map: canvasTex(256, 256, (g) => {
  for (let i = 0; i < 8; i++) { g.fillStyle = `hsl(28,${38 + (i % 3) * 6}%,${36 + (i * 37 % 9)}%)`; g.fillRect(0, i * 32, 256, 32); g.fillStyle = "rgba(0,0,0,.25)"; g.fillRect(0, i * 32, 256, 2); g.fillRect((i * 97) % 256, i * 32, 2, 32); }
}), roughness: 0.65 });

function bottomWithArches(s) {
  s.moveTo(-4.1, 0.5);
  s.lineTo(-3.35, 0.5); s.absarc(-2.6, 0.5, 0.75, Math.PI, 0, true);
  s.lineTo(1.85, 0.5); s.absarc(2.6, 0.5, 0.75, Math.PI, 0, true);
  s.lineTo(4.1, 0.5);
}
function fullProfile() {
  const s = new THREE.Shape(); bottomWithArches(s);
  s.lineTo(4.1, 1.35); s.quadraticCurveTo(4.1, 1.72, 3.75, 1.76);
  s.lineTo(3.35, 1.85); s.lineTo(2.72, 3.18); s.quadraticCurveTo(2.62, 3.4, 2.36, 3.4);
  s.lineTo(-3.8, 3.4); s.quadraticCurveTo(-4.1, 3.4, -4.1, 3.1); s.lineTo(-4.1, 0.5);
  return s;
}
function lowProfile() { const s = new THREE.Shape(); bottomWithArches(s); s.lineTo(4.1, 1.3); s.lineTo(-4.1, 1.3); s.lineTo(-4.1, 0.5); return s; }
const WINDOWS = [
  [[1.95, 2.02], [3.12, 2.02], [2.62, 3.1], [1.95, 3.1]],
  [[0.1, 2.05], [1.75, 2.05], [1.75, 3.1], [0.1, 3.1]],
  [[-1.9, 2.05], [-0.1, 2.05], [-0.1, 3.1], [-1.9, 3.1]],
  [[-3.75, 2.05], [-2.1, 2.05], [-2.1, 3.1], [-3.75, 3.1]],
];
const winPath = (pts, Cls = THREE.Path) => { const p = new Cls(); p.moveTo(...pts[0]); pts.slice(1).forEach((q) => p.lineTo(...q)); p.closePath(); return p; };

// ---------- ผนัง/หลังคา/หัวรถ (ใช้ร่วมทั้งมองนอกและข้างใน)
function sideWall(z0, full, lineZ) {
  const g = grp(); const s = full ? fullProfile() : lowProfile();

function portraitTex(col, k) {
  return canvasTex(256, 256, (g) => {
    g.fillStyle = "#22324f"; g.beginPath(); g.arc(128, 128, 122, 0, TAU); g.fill();
    g.save(); g.beginPath(); g.arc(128, 128, 116, 0, TAU); g.clip();
    const gr = g.createLinearGradient(0, 0, 0, 256); gr.addColorStop(0, col); gr.addColorStop(1, "#22324f"); g.fillStyle = gr; g.fillRect(0, 0, 256, 256);
    g.fillStyle = "#f6e2cc"; g.beginPath(); g.arc(128, 110, 48, 0, TAU); g.fill();
    g.fillStyle = ["#3a2a22", "#e8e2ff", "#2d3b4a"][k]; g.beginPath(); g.arc(128, 96, 54, Math.PI, 0); g.fill();
    g.fillStyle = col; g.beginPath(); g.ellipse(128, 250, 90, 70, 0, 0, TAU); g.fill();
    g.fillStyle = "#1f2a33"; g.beginPath(); g.arc(110, 116, 6, 0, TAU); g.arc(146, 116, 6, 0, TAU); g.fill();
    g.restore(); g.strokeStyle = col; g.lineWidth = 12; g.beginPath(); g.arc(128, 128, 116, 0, TAU); g.stroke();
  });
}

addEventListener("keydown", (e) => {

  if (!drive.on) { if (k === "enter") toggleDrive(); return; }
  if (keys[k]) return; keys[k] = true;
  if (k === "arrowleft" || k === "a") { if (drive.lane > -1) { drive.lane--; sfx("lane"); } }
  if (k === "arrowright" || k === "d") { if (drive.lane < 1) { drive.lane++; sfx("lane"); } }
  if (k === " ") { sfx(style === "ติ๊งต๊อง" ? "goofyHorn" : "horn"); e.preventDefault(); }
  if (k === "shift" && drive.nitro > 0.15) sfx("whoosh");
  if (k === "r") setStation(station + 1 >= STATIONS.length ? -1 : station + 1);
  if (k === "c") setCam({ chase: "driver", driver: "inside", inside: "chase" }[camMode]);
  if (k === "escape" || k === "enter") toggleDrive();
});
addEventListener("keyup", (e) => { keys[e.key.toLowerCase()] = false; });

function updateDrive(dt, t) {
  const up = keys.arrowup || keys.w, down = keys.arrowdown || keys.s;
  drive.boosting = !!keys.shift && drive.nitro > 0.02;
  drive.nitro = Math.max(0, Math.min(1, drive.nitro + (drive.boosting ? -0.35 : 0.08) * dt));
  const tgt = drive.boosting ? 46 : up ? 31 : down ? 5 : 19;
  drive.v += (tgt - drive.v) * Math.min(1, dt * (drive.boosting ? 1.5 : down ? 2.2 : 0.75));
  const acc = (drive.v - drive.lastV) / Math.max(dt, 1e-3); drive.lastV = drive.v;
  const tz = drive.lane * LANE, pz = drive.z;
  drive.z += (tz - drive.z) * Math.min(1, dt * 4.2);
  drive.zv = (drive.z - pz) / Math.max(dt, 1e-3);
  drive.km += drive.v * 4 * dt / 360;
  // ท่าทางรถ
  drive.roll += (-drive.zv * 0.022 - drive.roll) * Math.min(1, dt * 6);
  drive.pitch += (THREE.MathUtils.clamp(acc * 0.004, -0.05, 0.05) - drive.pitch) * Math.min(1, dt * 4);
  van.position.z = drive.z; van.rotation.y = -drive.zv * 0.012;
  body.rotation.x = drive.roll; body.rotation.z = drive.pitch;
  body.position.y += Math.sin(t * 13) * 0.008 * drive.v / 20 + (Math.random() - 0.5) * 0.004 * drive.v / 20;
  wheels.forEach((w) => { if (w.position.x > 0) w.rotation.y = -drive.zv * 0.05; });
  steer.rotation.x = drive.zv * 0.35;
  garlandV += (drive.zv * 0.04 - garland.rotation.x) * 0.0 + (-drive.roll * 4 - garland.rotation.x) * dt * 10; garland.rotation.x += garlandV * dt; garlandV *= 0.92;
  // ของข้างทาง
  const dx = drive.v * dt;
  for (const o of scrollers) { o.position.x -= dx * o.userData.k; if (o.position.x < -SPAN / 2) o.position.x += SPAN; }
  grassTex.offset.x += dx / 5; asphaltTex.offset.x += dx * 60 / 500;
  clouds.forEach((c) => { c.position.x -= dx * 0.03 + dt * 0.5; if (c.position.x < -170) c.position.x += 340; });
  // รถคันอื่น
  drive.hitCd -= dt;
  for (const tr of traffic) {
    tr.x += (tr.v - drive.v) * dt;
    if (tr.x < -75) respawnCar(tr, true); else if (tr.x > 130) respawnCar(tr, false);
    tr.car.position.set(tr.x, 0, tr.lane * LANE);
    tr.car.userData.tail.emissiveIntensity = night ? 2 : 0.6;
    if (Math.abs(tr.x) < 6.3 && Math.abs(tr.lane * LANE - drive.z) < 2.6 && drive.hitCd <= 0) {
      drive.hitCd = 0.6; sfx("crash"); bump(0.6);
      if (tr.x > 0) { tr.x = 6.5; drive.v = Math.min(drive.v, tr.v) * 0.6; } else { tr.x = -6.5; tr.v *= 0.6; }
    }
  }
  boostFx.visible = drive.boosting;
  if (drive.boosting) boostFx.children.forEach((f) => { f.scale.set(1, 0.8 + Math.random() * 0.6, 1); });
  if (engine) {
    engine.o1.frequency.value = 36 + drive.v * 2.4 + (drive.boosting ? 20 : 0); engine.o2.frequency.value = engine.o1.frequency.value;
    engine.g.gain.value = camMode === "chase" ? 0.06 : 0.035; engine.wg.gain.value = drive.v / 46 * (camMode === "chase" ? 0.07 : 0.025);
  }
  needle.rotation.z = -(Math.PI * 0.75 + Math.min(drive.v * 4, 180) / 180 * Math.PI * 1.5) + Math.PI;
  document.getElementById("spd").textContent = Math.round(drive.v * 4);
  document.getElementById("km").textContent = drive.km.toFixed(1) + " กม.";
  document.getElementById("nb").style.width = (drive.nitro * 100).toFixed(0) + "%";
  // กล้อง
  drive.shake = Math.max(0, drive.shake - dt * 1.6);
  const sh = drive.shake + (drive.boosting ? 0.06 : 0);
  const fov = drive.boosting ? 54 : 40 + drive.v * 0.15;
  camera.fov += (fov - camera.fov) * Math.min(1, dt * 3); camera.updateProjectionMatrix();
  const jitter = new THREE.Vector3((Math.random() - 0.5) * sh, (Math.random() - 0.5) * sh, (Math.random() - 0.5) * sh);
  if (camMode === "chase") {
    const p = new THREE.Vector3(-13 - drive.v * 0.08, 5.2, drive.z * 0.55);
    camera.position.lerp(p, Math.min(1, dt * 3)); camera.position.add(jitter);
    camera.lookAt(6, 1.6, drive.z * 0.8);
  } else if (camMode === "driver") {
    body.updateMatrixWorld();
    camera.position.copy(body.localToWorld(new THREE.Vector3(2.3, 2.42, 1.0))).add(jitter.multiplyScalar(0.2));
    camera.lookAt(body.localToWorld(new THREE.Vector3(14, 1.6, 1.0 - drive.zv * 0.4)));
  } else {
    camera.position.lerp(new THREE.Vector3(-3.5, 10, drive.z + 7.5), Math.min(1, dt * 3)); camera.lookAt(-0.3, 0.8, drive.z);
  }
}

// =====================================================================  UI
const $ = (id) => document.getElementById(id);
function btn(parent, text, fn, cls = "") { const b = document.createElement("button"); b.textContent = text; b.className = cls; b.onclick = () => fn(b); $(parent).appendChild(b); return b; }
let camAnim = null;
function flyTo(pos, tgt) { camAnim = { t: 0, p0: camera.position.clone(), t0: controls.target.clone(), p1: new THREE.Vector3(...pos), t1: new THREE.Vector3(...tgt) }; }
const VIEWS = [
  ["เฉียงหน้า", [10, 6, 10], [0, 1.7, 0], "out"], ["หน้า", [15, 2.6, 0], [0, 1.7, 0], "out"], ["ขวา", [0, 2.6, 15], [0, 1.7, 0], "out"],
  ["หลัง", [-15, 2.6, 0], [0, 1.7, 0], "out"], ["ซ้าย", [0, 2.6, -15], [0, 1.7, 0], "out"], ["เฉียงหลัง", [-10, 6, -10], [0, 1.7, 0], "out"],
  ["บน", [0.01, 19, 0.01], [0, 0, 0], "out"], ["ภายใน", [3.5, 9.5, 8], [-0.5, 0.6, 0], "cut"], ["ในห้องโดยสาร", [-3.6, 2.5, 0.6], [2.5, 1.6, 0], "drv"],
  ["ที่นั่งคนขับ", [2.3, 2.42, 1], [8, 1.9, 1], "drv"],
];
VIEWS.forEach(([n, p, t, m]) => btn("views", n, () => { setShell(m); controls.minDistance = m === "drv" ? 0.05 : 3; flyTo(p, t); }));
for (const [m, n] of [["chase", "ไล่หลัง"], ["driver", "คนขับ"], ["inside", "ในรถ"]]) { const b = btn("drivecams", n, () => setCam(m)); b.dataset.m = m; }
Object.keys(STYLES).forEach((n) => btn("styles", n, () => applyStyle(n)));
btn("modes", "ผ่าภายใน", () => setShell(shell === "cut" ? "out" : "cut"));
btn("modes", "ตาราง 3×7", (b) => { gridOn = !gridOn; b.classList.toggle("on", gridOn); setShell(shell); }, "on");
btn("modes", "ป้าย", (b) => { labelsOn = !labelsOn; b.classList.toggle("on", labelsOn); setShell(shell); }, "on");
let night = false;
btn("modes", "กลางคืน", (b) => { night = !night; b.classList.toggle("on", night); applyTime(); });
btn("modes", "หมุนรอบ", (b) => { controls.autoRotate = !controls.autoRotate; b.classList.toggle("on", controls.autoRotate); });
const driveBtn = btn("modes", "ขับ", () => toggleDrive());
const rearBtn = btn("modes", "เปิดท้าย", () => toggleRear());
btn("radio", "ปิด", () => { station = -1; ytStop(); drawRadio(); document.querySelectorAll("#radio button").forEach((b, k) => b.classList.toggle("on", k === 0)); $("st").textContent = ""; }, "on");
STATIONS.forEach((s, i) => btn("radio", s.name, () => setStation(i)));
const ytBtn = btn("radio", "YouTube", () => { if (ytOn) return; if (ytCurrent) ytPlay(ytCurrent); else if (ytQueue.length) ytPlay(ytQueue.shift()); else $("yt").focus(); });
ytBtn.id = "ytbtn";
{ const inp = document.createElement("input"); inp.id = "yt"; inp.autocomplete = "off"; inp.spellcheck = false; $("radio").appendChild(inp);
  const add = () => { const it = parseYT(inp.value); inp.style.borderColor = it ? "" : "#ff3b30"; if (!it) return; inp.value = "";
    if (ytOn) { ytQueue.push(it); ytQueueUI(); } else ytPlay(it); };
  inp.addEventListener("keydown", (e) => { if (e.key === "Enter") add(); });
  inp.addEventListener("paste", () => setTimeout(add, 0));
  btn("radio", "+", add); btn("radio", "⏭", () => ytNext());
  const q = document.createElement("span"); q.id = "ytq"; $("radio").appendChild(q); }
const PAINTS = [["ฟ้า", 0x7fb8d8], ["ส้ม", 0xf08a4b], ["เหลือง", 0xf2c94c], ["มิ้นต์", 0x8fd3b0], ["ชมพู", 0xf2a1b5], ["แดง", 0xd9534f], ["กรม", 0x34497a], ["ขาว", 0xeeeeea]];
PAINTS.forEach(([n, c], i) => {
  const b = document.createElement("button"); b.className = "sw" + (i === 0 ? " on" : ""); b.title = n; b.style.background = "#" + c.toString(16).padStart(6, "0");
  b.onclick = () => { paint.color.setHex(c); interactives.forEach((g) => g.traverse((m) => { if (m.isMesh && m.material.userData?.isPaint) m.material.color.setHex(c); })); document.querySelectorAll("#paint .sw").forEach((x) => x.classList.remove("on")); b.classList.add("on"); };
  $("paint").insertBefore(b, $("plate"));
});
Object.keys(parts).forEach((n) => btn("parts", n, (b) => { parts[n].on = !parts[n].on; b.classList.toggle("on", parts[n].on); setShell(shell); }));
const plateIn = $("plate");
plateIn.addEventListener("input", () => drawPlate(plateIn.value.trim() || " "));
document.fonts.load("800 62px 'Noto Sans Thai'").finally(() => drawPlate(plateIn.value));

function applyTime() {
  skyU.top.value.setHex(night ? 0x050a1c : 0x5fa8e6); skyU.bot.value.setHex(night ? 0x1a2446 : 0xeaf3f6);
  stars.visible = night;
  scene.fog = new THREE.Fog(night ? 0x141d3a : 0xe2eef4, 40, night ? 120 : 230);
  scene.environment = night ? null : envTex;
  hemi.intensity = night ? 0.35 : 0.7; hemi.color.setHex(night ? 0x6f86c8 : 0xe3f3ff);
  sun.intensity = night ? 0.45 : 2.6; sun.color.setHex(night ? 0x9fb6ff : 0xfff0d8);
  headLights.forEach((l) => (l.intensity = night ? 70 : 0));
  headMat.emissiveIntensity = night ? 2.6 : 0.15; tailMat.emissiveIntensity = night ? 1.8 : 0.1;
  rearDoors.traverse((m) => { if (m.isMesh && m.userData.baseEm && m.userData.baseEm.getHex() === 0xff2a1a) m.material.emissiveIntensity = night ? 1.8 : 0.1; });
  lampMats.forEach((m) => (m.emissiveIntensity = night ? 2.5 : 0));
  cloudMat.color.setHex(night ? 0x4a5578 : 0xffffff); cloudMat.emissiveIntensity = night ? 0 : 0.15;
  glowLight.intensity = night && style === "เท่" ? 14 : 0;
  applyLights();
}

// =====================================================================  picking
const ray = new THREE.Raycaster(), mouse = new THREE.Vector2(), tip = $("tip");
let hovered = null, downAt = null;
const isShown = (o) => { while (o) { if (!o.visible) return false; o = o.parent; } return true; };
function setHover(g) {
  if (hovered === g) return;
  const paintHL = (grp, on) => grp && grp.traverse((m) => { if (m.isMesh && m.userData.baseEm) m.material.emissive.copy(on ? new THREE.Color(0x6a4210) : m.userData.baseEm); });
  paintHL(hovered, false); hovered = g; paintHL(hovered, true);
  renderer.domElement.style.cursor = g ? "pointer" : "";
  tip.style.display = g ? "block" : "none"; if (g) tip.textContent = g.userData.iname;
}
renderer.domElement.addEventListener("pointermove", (e) => {
  mouse.set(e.clientX / innerWidth * 2 - 1, -e.clientY / innerHeight * 2 + 1);
  tip.style.left = e.clientX + "px"; tip.style.top = e.clientY + "px";
  ray.setFromCamera(mouse, camera);
  const hits = ray.intersectObject(van, true);
  let found = null;
  for (const h of hits) {
    const o = h.object; if (o.isSprite || !isShown(o)) continue;
    if (o.material.transparent && o.material.opacity < 0.6 && !o.userData.owner) continue;
    let p = o; while (p && !p.userData.act) p = p.parent; found = p || null; break;
  }
  setHover(found);
});
renderer.domElement.addEventListener("pointerdown", (e) => { downAt = [e.clientX, e.clientY]; });
renderer.domElement.addEventListener("pointerup", (e) => {
  if (downAt && Math.hypot(e.clientX - downAt[0], e.clientY - downAt[1]) < 6 && hovered) { initAudio(); hovered.userData.act(); }
  downAt = null;
});

// =====================================================================  loop
applyTime(); applyStyle("ปกติ"); setShell("out");
const clock = new THREE.Clock();
function frame() {
  const dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime;
  const S = STYLES[style];
  body.position.y = S.bottom - 0.5 * S.s[1];
  if (style === "ติ๊งต๊อง") {
    const k = Math.sin(t * (drive.on ? 11 : 3)) * (drive.on ? 0.045 : 0.015);
    body.scale.set(S.s[0] * (1 - k * 0.5), S.s[1] * (1 + k), S.s[2] * (1 - k * 0.5));
    pupils.forEach((p, i) => { p.position.y = p.userData.y + Math.sin(t * 6 + i * 2) * 0.07; p.position.z = p.userData.z + Math.cos(t * 4.3 + i) * 0.07; });
    antenna.rotation.x = Math.sin(t * (drive.on ? 12 : 5)) * 0.32; antenna.rotation.z = Math.cos(t * 4) * 0.12;
  }
  if (drive.on) updateDrive(dt, t);
  else if (camAnim) {
    camAnim.t = Math.min(1, camAnim.t + dt / 0.9); const k = 1 - Math.pow(1 - camAnim.t, 3);
    camera.position.lerpVectors(camAnim.p0, camAnim.p1, k); controls.target.lerpVectors(camAnim.t0, camAnim.t1, k);
    if (camAnim.t >= 1) camAnim = null;
  }
  wheels.forEach((w) => (w.rotation.z -= drive.v * dt / (0.56 * S.wr)));
  // จังหวะเพลง → ของในรถเต้น
  let beatPulse = 0;
  if (ac) { while (beats.length && beats[0] <= ac.currentTime) { beats.shift(); lastBeat = ac.currentTime; } if (station >= 0 && lastBeat > 0) beatPulse = Math.max(0, 1 - (ac.currentTime - lastBeat) * 4); }
  if (ytOn && ytPlaying) beatPulse = Math.max(0, 1 - ((t * 2) % 1) * 4);
  if (ytOn && ytPlayer && ytPlayer.setVolume) { const v = shell !== "out" ? 100 : 40; if (v !== ytVol) { ytVol = v; ytPlayer.setVolume(v); } }
  bobKick = Math.max(0, bobKick - dt * 0.8);
  bobHead.rotation.z = Math.sin(t * 14) * 0.35 * bobKick + beatPulse * 0.25 + (drive.on ? Math.sin(t * 9) * 0.06 : 0);
  bobHead.rotation.x = Math.sin(t * 11) * 0.3 * bobKick - drive.roll * 4;
  if (!drive.on) { garland.rotation.x = Math.sin(t * 1.3) * 0.05; }
  garland.rotation.z = Math.sin(t * 2.1) * 0.04 + drive.pitch * 3;
  radio.children[1].material.emissiveIntensity = 0.7 + beatPulse * 0.6;
  if (fanOn) fanBlades.rotation.x += dt * 30; fanHead.rotation.y = 0.3 + (fanOn ? Math.sin(t * 0.8) * 0.6 : 0);
  dice.forEach((d) => { if (d.userData.spin > 0) { d.userData.spin -= dt * 1.2; d.rotation.x += dt * 25 * d.userData.spin; d.rotation.z += dt * 19 * d.userData.spin; d.position.y = 0.77 + Math.abs(Math.sin(t * 20)) * 0.06 * d.userData.spin; } else d.position.y = 0.77; });
  if (microT > 0) { microT -= dt; microWin.material.emissiveIntensity = microT > 0 ? 1.2 : 0; }
  fridgeLight.intensity = fridgeA.tgt ? 2.5 : 0;
  guitar.rotation.x *= Math.pow(0.02, dt);
  for (const a of animated) a.obj[a.prop][a.axis] += (a.tgt - a.obj[a.prop][a.axis]) * Math.min(1, dt * 8);
  if (flag) { const p = flag.geometry.attributes.position; for (let i = 0; i < p.count; i++) { const x = p.getX(i); p.setZ(i, Math.sin(t * (drive.on ? 12 : 3) + x * 6) * 0.07 * (x + 0.45)); } p.needsUpdate = true; }
  if (ac && carFilter) {
    const inside = shell !== "out";
    carFilter.frequency.value += ((inside ? 16000 : 900) - carFilter.frequency.value) * Math.min(1, dt * 6);
    musicBus.gain.value = inside ? 0.6 : 0.5;
  }
  if (!drive.on && engine) { engine.g.gain.value = 0; engine.wg.gain.value = 0; }
  sky.position.copy(camera.position); stars.position.copy(camera.position);
  if (!drive.on) controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
frame();
addEventListener("resize", () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
