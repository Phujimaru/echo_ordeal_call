<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Echo Diary</title>
<style>
  :root { --bg: #0b0716; --ink: #e9e2ff; --mute: #9c8fc4; --line: #2a2140; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: system-ui, "Noto Sans Thai", sans-serif; }
  .wrap { max-width: 1280px; margin: 0 auto; padding: 16px; }
  .stage { position: relative; width: 100%; aspect-ratio: 2000 / 1116; overflow: hidden; border-radius: 10px;
    background: radial-gradient(ellipse at 50% 60%, #2b1b4d 0%, #120b24 55%, #07040f 100%); }
  .stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .shot { position: absolute; inset: 0; opacity: 0; will-change: transform, opacity; }
  .shot img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
  /* ไพ่ตัวละคร: ลอยกลางไดอารี่ หมุน 2 รอบ (ผู้ใช้สั่ง) · หน้าไพ่ = ภาพตัวละคร · หลังไพ่ = ลายปกไดอารี่ · ไม่มีเอฟเฟคที่ตัวภาพ */
  #apparition { position: absolute; left: 0; top: 0; width: 15%; aspect-ratio: 2 / 3; opacity: 0; perspective: 1000px; }
  .card-in { position: absolute; inset: 0; transform-style: preserve-3d; }
  .card-face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: 6% / 4%;
    overflow: hidden; background: #f4ead2; padding: 5.5%; box-shadow: inset 0 0 0 2px #e3c27a, inset 0 0 0 5px #f4ead2, inset 0 0 0 6px #b99a5a; }
  .card-front { background: linear-gradient(160deg, #5b4699, #3a2a6c 55%, #2b1f52); padding: 0; }
  .card-art { position: absolute; left: 10.5%; top: 8%; width: 79%; height: 84%; overflow: hidden; border-radius: 2px; background: #241a40; }
  .card-art img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 18%; display: block; }
  .card-frame { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .card-back { transform: rotateY(180deg); background: linear-gradient(160deg, #6f58b8, #4a3685 60%, #3a2a6c); padding: 0; }
  .card-back svg { width: 100%; height: 100%; display: block; }
  /* โทนสีเดียวกันทุกช็อต: ลดความสดนิด + ม่วงกลางคืนบางๆ (ภาพเจนต่างชุดให้เข้ากัน) */
  .shot img { filter: saturate(.93) contrast(1.03); }
  #grade { position: absolute; inset: 0; pointer-events: none; mix-blend-mode: soft-light;
    background: radial-gradient(ellipse 80% 75% at 50% 45%, rgba(150, 120, 230, .16), rgba(60, 35, 130, .42)); }
  #vignette { position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse 75% 70% at 50% 50%, transparent 55%, rgba(6, 3, 14, .55) 100%); }
  #flash { position: absolute; inset: 0; opacity: 0; pointer-events: none;
    background: radial-gradient(circle at var(--fx, 50%) var(--fy, 50%), #fff8e6 0%, rgba(255, 236, 190, .9) 22%, rgba(214, 190, 255, .45) 50%, transparent 80%); }
  .bar { display: flex; gap: 8px; margin: 12px 0; flex-wrap: wrap; }
  select { background: #2a1f47; color: var(--ink); border: 1px solid #4b3b7a; border-radius: 8px; padding: 8px 10px; font: inherit; }
  button { background: #2a1f47; color: var(--ink); border: 1px solid #4b3b7a; border-radius: 8px; padding: 8px 16px; font: inherit; cursor: pointer; }
  button:hover { background: #3a2b62; }
  .strip { display: grid; grid-template-columns: repeat(8, 1fr); gap: 6px; }
  .strip figure { margin: 0; background: #140e26; border: 1px solid var(--line); border-radius: 8px; padding: 4px; cursor: pointer; }
  .strip img { width: 100%; aspect-ratio: 2000 / 1116; object-fit: contain; display: block; }
  .strip figcaption { font-size: 12px; color: var(--mute); padding-top: 3px; text-align: center; }
  .strip figure.on { border-color: #b69cff; }
  .strip figure.on figcaption { color: var(--ink); }
</style>
</head>
<body>
<div class="wrap">
  <div class="stage" id="stage">
    <canvas id="sky"></canvas>
    <div class="shot" id="s_fclosed"><img src="echo-diary/front_closed.webp" alt=""></div>
    <div class="shot" id="s_flift"><img src="echo-diary/front_lift.webp" alt=""></div>
    <div class="shot" id="s_reading"><img src="echo-diary/reading.webp" alt=""></div>
    <div class="shot" id="s_pov">
      <img src="echo-diary/pov.webp" alt="">
      <div id="apparition"><div class="card-in">
        <div class="card-face card-front"><div class="card-art"><img id="cardArt" src="echo-diary/sample.jpg" alt=""></div>
          <svg class="card-frame" viewBox="0 0 200 300" aria-hidden="true">
            <defs>
              <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#fff1c4"/><stop offset=".35" stop-color="#e3c27a"/><stop offset=".6" stop-color="#b8904a"/><stop offset="1" stop-color="#f3d897"/>
              </linearGradient>
              <g id="corner">
                <path d="M6 34 Q6 6 34 6" fill="none" stroke="url(#gold)" stroke-width="2.2"/>
                <path d="M12 40 Q12 12 40 12" fill="none" stroke="url(#gold)" stroke-width="1"/>
                <circle cx="13" cy="13" r="5.5" fill="#3a2a6c" stroke="url(#gold)" stroke-width="1.4"/>
                <path d="M13 8.6 l1.2 3.2 3.2 1.2 -3.2 1.2 -1.2 3.2 -1.2 -3.2 -3.2 -1.2 3.2 -1.2 Z" fill="#fff3d2"/>
                <circle cx="44" cy="8.5" r="1.3" fill="#e3c27a"/><circle cx="8.5" cy="44" r="1.3" fill="#e3c27a"/>
              </g>
            </defs>
            <!-- ขอบนอกทองหนา + เส้นในบาง (ทับขอบภาพให้ภาพจมอยู่ในกรอบ) -->
            <rect x="3" y="3" width="194" height="294" rx="11" fill="none" stroke="url(#gold)" stroke-width="3.2"/>
            <rect x="8.5" y="8.5" width="183" height="283" rx="8" fill="none" stroke="#e3c27a" stroke-width=".8" opacity=".75"/>
            <rect x="20" y="23" width="160" height="254" rx="2" fill="none" stroke="url(#gold)" stroke-width="2.4"/>
            <rect x="23.5" y="26.5" width="153" height="247" rx="1" fill="none" stroke="#fff1c4" stroke-width=".6" opacity=".7"/>
            <use href="#corner"/>
            <use href="#corner" transform="translate(200 0) scale(-1 1)"/>
            <use href="#corner" transform="translate(0 300) scale(1 -1)"/>
            <use href="#corner" transform="translate(200 300) scale(-1 -1)"/>
            <!-- เหรียญพระจันทร์บน / ดาวล่าง กึ่งกลางขอบ -->
            <path d="M78 23 Q100 9 122 23" fill="none" stroke="url(#gold)" stroke-width="1.6"/>
            <circle cx="100" cy="17" r="9" fill="#3a2a6c" stroke="url(#gold)" stroke-width="1.8"/>
            <path d="M103.5 11.2 A6.4 6.4 0 1 0 103.5 22.8 A5 5 0 1 1 103.5 11.2 Z" fill="#f2d48c"/>
            <path d="M78 277 Q100 291 122 277" fill="none" stroke="url(#gold)" stroke-width="1.6"/>
            <circle cx="100" cy="283" r="8" fill="#3a2a6c" stroke="url(#gold)" stroke-width="1.8"/>
            <path d="M100 277.4 l1.6 4 4 1.6 -4 1.6 -1.6 4 -1.6 -4 -4 -1.6 4 -1.6 Z" fill="#fff3d2"/>
            <!-- จุดทองข้างขอบ -->
            <circle cx="11" cy="150" r="2" fill="#e3c27a"/><circle cx="189" cy="150" r="2" fill="#e3c27a"/>
            <path d="M11 132 V142 M11 158 V168 M189 132 V142 M189 158 V168" stroke="#e3c27a" stroke-width="1" opacity=".8"/>
          </svg>
        </div>
        <div class="card-face card-back"><svg viewBox="0 0 200 300" aria-hidden="true">
          <rect x="9" y="9" width="182" height="282" rx="10" fill="none" stroke="#e3c27a" stroke-width="2.4"/>
          <rect x="17" y="17" width="166" height="266" rx="7" fill="none" stroke="#e3c27a" stroke-width="1" opacity=".7"/>
          <circle cx="100" cy="150" r="58" fill="none" stroke="#e3c27a" stroke-width="1.4" opacity=".8"/>
          <circle cx="100" cy="150" r="47" fill="none" stroke="#e3c27a" stroke-width=".8" opacity=".6"/>
          <path d="M112 112 A40 40 0 1 0 112 188 A32 32 0 1 1 112 112 Z" fill="#f2d48c"/>
          <path d="M128 132 l3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3 Z" fill="#fff3d2"/>
          <path d="M100 34 l2.4 6.6 6.6 2.4 -6.6 2.4 -2.4 6.6 -2.4 -6.6 -6.6 -2.4 6.6 -2.4 Z" fill="#e3c27a"/>
          <path d="M100 252 l2.4 6.6 6.6 2.4 -6.6 2.4 -2.4 6.6 -2.4 -6.6 -6.6 -2.4 6.6 -2.4 Z" fill="#e3c27a"/>
          <circle cx="30" cy="30" r="3" fill="#e3c27a"/><circle cx="170" cy="30" r="3" fill="#e3c27a"/><circle cx="30" cy="270" r="3" fill="#e3c27a"/><circle cx="170" cy="270" r="3" fill="#e3c27a"/>
        </svg></div>
      </div></div>
      <canvas id="povFx"></canvas>
    </div>
    <div class="shot" id="s_touch">
      <img src="echo-diary/touch_plate.webp" alt="">
      <canvas id="trail"></canvas>
      <img id="hand" src="echo-diary/touch_hand.webp" alt="">
    </div>
    <div class="shot" id="s_face"><img src="echo-diary/face_lit.webp" alt=""></div>
    <div class="shot" id="s_closed"><img src="echo-diary/book_closed.webp" alt=""></div>
    <div id="grade"></div>
    <canvas id="fx"></canvas>
    <div id="vignette"></div>
    <div id="flash"></div>
  </div>
  <div class="bar">
    <button id="playFull">เต็ม</button>
    <button id="playShort">สั้น</button>
    <select id="cardPick"></select>
  </div>
  <div class="strip" id="strip"></div>
</div>
<script>
// ============================================================
//  ฉากไดอารี่ความทรงจำ (ต้นแบบ) — ภาพนิ่งทั้งหมด + กล้อง/แสง/อนุภาคด้วยโค้ด
//  ไม่วาดรูปทรงกระดาษ/บิดภาพทับภาพวาด (ผู้ใช้: "เบี้ยว") · มือในช่วงนิ้วลากแยกเป็นชั้น (touch_hand) ทับแผ่นที่เติมกระดาษแล้ว (touch_plate)
// ============================================================
const $ = (id) => document.getElementById(id);
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const ease = (x) => x * x * (3 - 2 * x);
const easeOut = (x) => 1 - Math.pow(1 - x, 3);
const easeIn = (x) => x * x * x;
const easeInOut = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const lerp = (a, b, k) => a + (b - a) * k;
const inOut = (t, a, b, c, d) => ease(seg(t, a, b)) * (1 - ease(seg(t, c, d)));

const stage = $("stage");
const CANVASES = ["sky", "povFx", "trail", "fx"].map($);
let W = 0, H = 0, DPR = 1;
function resize() {
  const r = stage.getBoundingClientRect();
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = r.width; H = r.height;
  for (const c of CANVASES) { c.width = W * DPR; c.height = H * DPR; }
}
addEventListener("resize", resize); resize();
const ctx = (c) => { const g = c.getContext("2d"); g.setTransform(DPR, 0, 0, DPR, 0, 0); return g; };

// ---------- จุดบนภาพ (สัดส่วน 0..1 ของภาพ 2000×1116) ----------
const BOOK_IN_READING = [0.505, 0.62];
// ภาพมุมถือสมุด: หน้าซ้าย/ขวา (ขอบกระดาษ) + จุดลายดาวที่ขอบหน้า
const POV = {
  left: [[0.120, 0.296], [0.405, 0.215], [0.566, 0.753], [0.300, 0.878]],
  right: [[0.405, 0.215], [0.660, 0.075], [0.690, 0.660], [0.566, 0.753]],
  center: [0.545, 0.40],
  glints: [[0.150, 0.330], [0.265, 0.255], [0.380, 0.240], [0.440, 0.205], [0.575, 0.140], [0.640, 0.110], [0.690, 0.590], [0.555, 0.690], [0.330, 0.800], [0.220, 0.640]],
};
const FINGER0 = [0.500, 0.418];  // ปลายนิ้วในภาพนิ้วแตะ
const DRAG = [-0.018, 0.17];     // ระยะลากนิ้ว (สัดส่วนของภาพ)

// ---------- ฟ้าดาว (เลื่อนสวนกล้อง = มีมิติ) ----------
const stars = Array.from({ length: 180 }, () => ({ x: Math.random(), y: Math.random(), r: Math.random() * 1.4 + 0.3, p: Math.random() * 6.28, z: 0.3 + Math.random() }));
function drawSky(now, a) { const cam = { x: 0, y: 0, z: 0 }; // ฟ้าดาวนิ่ง ไม่ขยับตามช็อต (ห้ามซูม)
  const g = ctx($("sky")); g.clearRect(0, 0, W, H);
  for (const s of stars) {
    const tw = 0.5 + 0.5 * Math.sin(now / 700 + s.p);
    const x = (((s.x - cam.x * 0.04 * s.z + now * 0.000003 * s.z) % 1) + 1) % 1 * W;
    const y = (((s.y - cam.y * 0.04 * s.z) % 1) + 1) % 1 * H;
    g.fillStyle = `rgba(230,220,255,${(0.25 + 0.6 * tw) * a})`;
    g.beginPath(); g.arc(x, y, s.r * (0.8 + cam.z * 0.3), 0, 6.28); g.fill();
  }
}

// ---------- อนุภาค ----------
let parts = [];
function spawn(n, x, y, mode, o = {}) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * 6.28, sp = mode === "burst" ? 160 + Math.random() * 420 : 20 + Math.random() * 50;
    parts.push({ x, y, vx: mode === "wind" ? 40 + Math.random() * 90 : Math.cos(a) * sp * (mode === "rise" ? 0.4 : 1),
      vy: mode === "rise" || mode === "wind" ? -(40 + Math.random() * 90) : Math.sin(a) * sp,
      life: 0, max: (o.max || 1) * (0.9 + Math.random() * 1.1), r: (o.r || 1) * (1 + Math.random() * 2.4), gold: Math.random() < (o.gold ?? 0.7), mode, wob: Math.random() * 6.28 });
  }
}
// ตัดช็อต = ประกายของช็อตเก่าจางเร็ว (ไม่ให้ลอยค้างบังหน้าในช็อตถัดไป)
function fadeParts(sec) { for (const p of parts) p.max = Math.min(p.max, p.life + sec); }
function drawParts(g, dt, now) {
  g.globalCompositeOperation = "lighter";
  parts = parts.filter((p) => (p.life += dt) < p.max);
  for (const p of parts) {
    if (p.mode === "burst") { p.vx *= 0.96; p.vy *= 0.96; }
    if (p.mode === "rise" || p.mode === "wind") p.vx *= 1; // ไม่ส่าย
    p.x += p.vx * dt; p.y += p.vy * dt;
    const k = Math.sin(Math.PI * p.life / p.max);
    const col = p.gold ? "255,214,140" : "205,180,255";
    glow(g, p.x, p.y, p.r * 5, `rgba(${col},${0.9 * k})`, `rgba(${col},0)`);
  }
  g.globalCompositeOperation = "source-over";
}
function glow(g, x, y, R, c0, c1, mid) {
  const grd = g.createRadialGradient(x, y, 0, x, y, R);
  grd.addColorStop(0, c0); if (mid) grd.addColorStop(mid[0], mid[1]); grd.addColorStop(1, c1);
  g.fillStyle = grd; g.beginPath(); g.arc(x, y, R, 0, 6.28); g.fill();
}
function sparkle(g, x, y, s, a) { // ประกายสี่แฉก
  g.save(); g.translate(x, y); g.globalAlpha = a; g.globalCompositeOperation = "lighter";
  glow(g, 0, 0, s * 1.6, "rgba(255,240,200,.9)", "rgba(255,220,150,0)");
  g.fillStyle = "rgba(255,250,230,1)";
  for (let i = 0; i < 2; i++) {
    g.rotate(Math.PI / 2 * i);
    g.beginPath(); g.moveTo(0, -s * 2.4); g.quadraticCurveTo(s * 0.18, -s * 0.18, s * 2.4, 0); g.quadraticCurveTo(s * 0.18, s * 0.18, 0, s * 2.4);
    g.quadraticCurveTo(-s * 0.18, s * 0.18, -s * 2.4, 0); g.quadraticCurveTo(-s * 0.18, -s * 0.18, 0, -s * 2.4); g.fill();
  }
  g.restore();
}

// ---------- กล้อง: ตั้ง transform ของช็อต (ดัน/แพนช้าๆ ไม่หมุน ไม่บิด) ----------
function shot(id, op, cam) {
  const s = $(id).style;
  s.opacity = op;
  s.transformOrigin = `${cam.ox * 100}% ${cam.oy * 100}%`;
  s.transform = "none"; // ผู้ใช้: ห้ามซูมเข้า/ออก (และไม่แพน — ภาพนิ่งเต็มจอ ขยับได้แค่แสง/อนุภาค/ไพ่)
}
const drift = () => ({}); // ผู้ใช้: ห้ามเด้ง/ส่าย — กล้องเคลื่อนเป็นเส้นตรงนุ่มๆ เท่านั้น

// ---------- ช่วงต่างๆ ----------
// 1 เปิดอ่าน → 2 หน้ากระดาษตื่น → 3 นิ้วลาก เส้นแสงตาม → 4 ภาพตัวละครลอยขึ้นจากหน้า → 5 ใบหน้าต้องแสง (จบ — ผู้ใช้ตัดแสงวาบออก)
// เวลาเป็นของทั้งฉาก (รวมช่วงเปิดฉาก 1400 ms ข้างหน้า)
const FULL = [
  { k: "closed", img: "front_closed", at: 400, until: 750 },
  { k: "lift", img: "front_lift", at: 1300, until: 1800 },
  { k: "reading", img: "reading", at: 2700, until: 3700 },
  { k: "open", img: "face_lit", at: 4300, until: 4900 },
  ...[
    { k: "drag", img: "touch", at: 4700, until: 5450 },
    { k: "reveal", img: "pov", at: 6900, until: 99999 },
  ].map((s) => {
    const back = (v) => (v >= 3850 ? v - 1950 : v) + 3000; // ช่วงหน้ากระดาษตื่นถูกตัด · ช่วงเปิดฉาก 3000 ms
    return { ...s, at: back(s.at), until: back(s.until) };
  }),
];

// การ์ดตัวละครจริง: ภาพปกของแต่ละตัว + จุดครอป (x,y %) และซูม (z) ให้เห็นหน้าในกรอบการ์ด (ข้อ 3)
//  ในเกมจะย้ายตารางนี้ไปไว้ฝั่ง client (ตัวที่ไม่อยู่ในตาราง = กลางภาพ 50% 18% ไม่ซูม)
const CARD_ROSTER = [
  { id: "muimi", name: "มุยมิ", img: "/client/public/characters/muimi/muimi.webp", x: 55, y: 0, z: 1.7 },
  { id: "oberon_summer", name: "โอเบรอน (ฤดูร้อน)", img: "/client/public/characters/oberon(summer)/oberon_summer.webp", x: 50, y: 8, z: 1.4 },
  { id: "sliver_bullet", name: "นักบินปริศนา", img: "/client/public/characters/sliver_bullet/sliver_bullet_banagher.png", x: 22, y: 12, z: 1.3 },
  { id: "sora_otosumi", name: "โซระ โอโตสุมิ", img: "/client/public/characters/sora_otosumi/sora.jpg", x: 50, y: 18, z: 1 },
  { id: "raido_hikaru", name: "ไรโด ฮิคารุ", img: "/client/public/characters/raido_hikaru/hikaru.jpg", x: 50, y: 18, z: 1 },
  { id: "ice_spike", name: "Ice Spike", img: "/client/public/characters/ice_spike/ice_spike.webp", x: 50, y: 18, z: 1 },
  { id: "kira", name: "ราชาแมลงอวกาศ", img: "/client/public/characters/kira/kira.webp", x: 50, y: 18, z: 1 },
  { id: "yuna", name: "เด็กสาวเสื้อคลุมขาว", img: "/client/public/characters/yuna/yuna.webp", x: 50, y: 18, z: 1 },
  { id: "gray", name: "เกรย์", img: "/client/public/characters/gray/gray.webp", x: 50, y: 18, z: 1 },
  { id: "gyro_zeppeli", name: "ไจโร เซปเปลี่", img: "/client/public/characters/gyro_zeppeli/gyro.webp", x: 45, y: 12, z: 1.3 },

      glow(fxg, x, y, W * 0.035, `rgba(255,222,150,${0.32 * leak})`, "rgba(255,214,140,0)");
    }
    if (Math.random() < 0.35 * leak) { const k = Math.random(); spawn(1, lerp(SLIT[0][0], SLIT[1][0], k) * W, lerp(SLIT[0][1], SLIT[1][1], k) * H, "rise", { max: 0.9, r: 0.7 }); }
  }
  // สมุดเปิด: แสงอุ่นจากหน้ากระดาษส่องขึ้นหน้า
  if (open > 0) {
    const warm = 0.25 + 0.75 * ease(seg(t, OPEN_AT, OPEN_AT + 700));
    glow(fxg, 0.45 * W, 1.02 * H, W * 0.42, `rgba(255,205,130,${0.48 * warm})`, "rgba(255,200,120,0)");
    if (Math.random() < 0.4) spawn(1, (0.3 + Math.random() * 0.42) * W, (0.9 + Math.random() * 0.08) * H, "rise", { max: 0.45, r: 0.8 });
  }
  fxg.restore();
  if ((t > OPEN_AT && t - dt <= OPEN_AT) || (t > OPEN_END && t - dt <= OPEN_END)) fadeParts(0.2);
  hiliteAt(t);
  return more;
}

// ---------- สั้น (~2.4 วิ): หนังสือลอย → เปิด (มุมถือ) → ตื่น → ภาพตัวละครขึ้น → วาบ ----
function frameShort(t, dt, now) {
  const fxg = ctx($("fx")); fxg.clearRect(0, 0, W, H);
  ctx($("povFx")).clearRect(0, 0, W, H); ctx($("trail")).clearRect(0, 0, W, H);
  shot("s_closed", inOut(t, 0, 250, 750, 950), { ox: 0.5, oy: 0.5, z: lerp(0.92, 1.06, easeOut(seg(t, 0, 750))) });
  shot("s_pov", inOut(t, 450, 700, 1950, 2350), { ox: POV.center[0], oy: POV.center[1], z: lerp(1.08, 1, easeOut(seg(t, 500, 1100))) });
  POV.glints.forEach(([x, y], i) => { const s0 = 800 + i * 40, a = Math.sin(Math.PI * seg(t, s0, s0 + 450)); if (a > 0) sparkle(ctx($("povFx")), x * W, y * H, W * 0.005 * (0.6 + a), a); });
  cardAt(t, 1000, 750, ease(seg(t, 1000, 1150)) * (1 - ease(seg(t, 1950, 2350))));

  setFlash(ease(seg(t, 1600, 1850)) * (1 - ease(seg(t, 1900, 2400))), [POV.center[0], 0.4]);
  // (ไม่มีประกายระเบิด — ห้ามเด้ง)
  drawSky(now, seg(t, 0, 300), { x: 0, y: 0, z: 0 });
  drawParts(fxg, dt / 1000, now);
  hiliteAt(-1);
  return t < 2700;
}

function setFlash(op, at) {
  stage.style.setProperty("--fx", at[0] * 100 + "%"); stage.style.setProperty("--fy", at[1] * 100 + "%");
  $("flash").style.opacity = op;
}
function reset() {
  for (const id of ["s_fclosed", "s_flift", "s_reading", "s_pov", "s_touch", "s_face", "s_closed"]) $(id).style.opacity = 0;
  $("apparition").style.opacity = 0; $("hand").style.transform = ""; setFlash(0, [0.5, 0.5]); parts = [];
}

// ---------- แถบลำดับ: กด = ค้างที่ช่วงนั้น (ยังขยับ) ----------
const strip = $("strip");
FULL.forEach((s, i) => {
  const f = document.createElement("figure");
  f.innerHTML = `<img src="echo-diary/${s.img}.webp" alt=""${s.k === "flash" ? ' style="filter:brightness(1.7) saturate(.5)"' : ""}><figcaption>${i + 1}</figcaption>`;
  f.onclick = () => holdAt(s.at);
  strip.appendChild(f);
});
function hiliteAt(t) {
  const i = t < 0 ? -1 : FULL.findIndex((s) => t < s.until);
  [...strip.children].forEach((f, k) => f.classList.toggle("on", k === i));
}
let raf = 0, started = false;
function run(fn) {
  started = true;
  cancelAnimationFrame(raf); reset();
  let last = performance.now();
  const tick = (now) => { const dt = Math.min(50, now - last); last = now; if (fn(now, dt) !== false) raf = requestAnimationFrame(tick); };
  raf = requestAnimationFrame(tick);
}
function play(frame) { const t0 = performance.now(); run((now, dt) => frame(now - t0, dt, now)); }
function holdAt(at) { run((now, dt) => { frameFull(at, dt, now); }); }
{ // ตัวเลือกตัวละครบนการ์ด (เครื่องมือของหน้าต้นแบบ ไม่ใช่ UI ในเกม)
  const sel = $("cardPick");
  CARD_ROSTER.forEach((c, i) => { const o = document.createElement("option"); o.value = i; o.textContent = c.name; sel.appendChild(o); });
  sel.onchange = () => { setCardChar(CARD_ROSTER[+sel.value]); play(frameFull); };
  sel.value = 0; setCardChar(CARD_ROSTER[0]);
}
$("playFull").onclick = () => play(frameFull);
$("playShort").onclick = () => play(frameShort);
reset();
Promise.all([...document.images].map((im) => im.decode().catch(() => {}))).then(() => { if (!started) play(frameFull); });
</script>
</body>
