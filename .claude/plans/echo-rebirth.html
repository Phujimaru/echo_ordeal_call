// เศษโลก: ทรงยี่สิบหน้าละเอียด → จับกลุ่มสามเหลี่ยมตามจุดตั้งต้นสุ่ม (โวโรนอยบนผิวทรงกลม) ~90 ชิ้น · uv แบบเดียวกับ SphereGeometry

earth.textures.add(shardTex);

const crackGroup = new THREE.Group(); core.spin.add(crackGroup);

const NEW_DIR = regionDir(TO - 1);
function uvOf(v) {

}
{

    m.copy(a).add(b).add(c).normalize();

    const k = (t - T.dissolve[0]) / (T.dissolve[1] - T.dissolve[0] + 0.6), A = ART.hold, kk = gr / A.r;
    for (let i = 0; i < 160; i++) {
      const R = rng(i * 17 + 5), x = gcx + (R() - 0.5) * A.w * kk * 0.7, y0 = gcy - A.cy * kk + R() * A.h * kk * 0.85;
      fx.globalAlpha = Math.sin(k * Math.PI) * (0.4 + 0.6 * R()); fx.fillStyle = i % 3 ? "#d9b8ff" : "#fff";
      fx.beginPath(); fx.arc(x + Math.sin(wall * 2 + i) * 6, y0 - eOut(k) * H * (0.15 + R() * 0.25), 1.2 + R() * 2.5, 0, 7); fx.fill();
    }
  }
  // ดิ่ง: เส้นความเร็วพุ่งออกจากกลางจอ + แฟลชปลายทาง
  if (t >= T.dive[0] && t < T.flash + 0.5) {
    const k = span(t, T.dive[0], T.flash);
    for (let i = 0; i < 70; i++) {
      const R = rng(i * 5 + 2), an = R() * 6.28, ph = (wall * (1.5 + R() * 2) + R()) % 1, r0 = lerp(40, Math.max(W, H) * 0.8, ph), len = 40 + 260 * ph * k;
      fx.globalAlpha = k * ph * 0.8; fx.strokeStyle = "#ffffff"; fx.lineWidth = 1 + ph * 2;
      fx.beginPath(); fx.moveTo(W / 2 + Math.cos(an) * r0, H / 2 + Math.sin(an) * r0); fx.lineTo(W / 2 + Math.cos(an) * (r0 + len), H / 2 + Math.sin(an) * (r0 + len)); fx.stroke();
    }
    const fl = t > T.flash - 0.15 ? clamp01(1 - Math.abs(t - T.flash) / 0.35) : 0;
    if (fl > 0) { fx.globalCompositeOperation = "source-over"; fx.globalAlpha = fl; fx.fillStyle = "#fff"; fx.fillRect(0, 0, W, H); }
  }
  fx.globalAlpha = 1; fx.globalCompositeOperation = "source-over";
  renderRingFront(ringAny);
}

// ---------------- เริ่ม ----------------
Promise.all([earth.ready, keyArt("echo-rebirth/hold.jpg", artHold), keyArt("echo-rebirth/squeeze.jpg", artSq)]).then(([, hold, squeeze]) => {
  ART = { hold, squeeze };
  tNow = 0; playing = true;
});
window.__variant = (v) => { VARIANT = v; };
document.getElementById("play").onclick = () => { seek = null; tNow = 0; playing = true; };
document.getElementById("slow").onclick = (e) => { slow = !slow; e.currentTarget.classList.toggle("on", slow); };
// ตรวจภาพนิ่ง: window.__seek(วินาที) · window.__seek(null) = เล่นต่อ
window.__seek = (v) => { seek = v; };
window.__art = () => ART && { hold: { cx: ART.hold.cx, cy: ART.hold.cy, r: ART.hold.r, w: ART.hold.w }, squeeze: { cx: ART.squeeze.cx, cy: ART.squeeze.cy, r: ART.squeeze.r, w: ART.squeeze.w } };
