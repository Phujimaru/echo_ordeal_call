<!doctype html>
<html lang="th">

<title>Thalassa</title>
<!--
  ต้นแบบปลาวาฬ ทาลัสซา (GRID_PLAN §8.9 โหมด Nautilus) — การว่าย ท่าโจมตี 6 ท่า เสียง
  เปิด: preview "plans" (python http.server 5180 ที่รากของ worktree) → http://localhost:5180/.claude/plans/thalassa.html

  รอบ 2 (2026-11-19 ผู้ใช้สั่ง): ตัวใหญ่ขึ้น + ท่าอลังการขึ้น (กล้องซูม/หยุดเฟรม/แฟลช/แถบดำ/อนุภาค/พื้นแตก/น้ำพุ/คลื่นบิดภาพ)
-->
<style>
  html,body{margin:0;height:100%;background:#020812;overflow:hidden;font-family:"Noto Sans Thai",system-ui,sans-serif}
  canvas{display:block}
  #bar{position:fixed;left:0;right:0;bottom:0;display:flex;flex-wrap:wrap;gap:6px;justify-content:center;padding:10px 12px 12px;background:linear-gradient(rgba(0,8,20,0),rgba(0,8,20,.9) 40%);z-index:2}
  #bar .sep{width:14px}
  #bar button{background:rgba(8,28,46,.9);color:#c8f7ff;border:1px solid #2a7f96;border-radius:6px;padding:7px 12px;font:14px "Noto Sans Thai",system-ui,sans-serif;cursor:pointer}
  #bar button:hover{border-color:#8ff3ff}
  #bar button.on{background:#1b6d84;color:#fff;border-color:#8ff3ff}

</style>

<body>
<canvas id="c"></canvas>
<div id="bar">
  <button data-a="appear">โผล่</button>
  <button data-a="leave">จากไป</button>
  <button data-a="turn">จบเทิร์น</button>
  <button data-a="free" class="on" id="bFree">ว่ายต่อเนื่อง</button>
  <span class="sep"></span>
  <button class="atk" data-a="tentacle">หนวดกวาด</button>
  <button class="atk" data-a="charge">พุ่งทะลวง</button>
  <button class="atk" data-a="whirl">วังน้ำวน</button>
  <button class="atk" data-a="zap">ประจุเรืองแสง</button>
  <button class="atk" data-a="song">เพลงวาฬ</button>
  <button class="atk" data-a="swallow">กลืนลงท้อง</button>
  <span class="sep"></span>
  <button data-a="hit">ตี</button>
  <button data-a="fierce" id="bFierce">ชั้น 5</button>
  <button data-a="bgm" id="bBgm">เพลง</button>
  <button data-a="amb" id="bAmb">บรรยากาศ</button>
  <button data-a="reset">รีเซ็ต</button>
</div>
<script>
"use strict";
const MEDIA = "../../client/public/nautilus/";
const DPR = Math.min(2, window.devicePixelRatio || 1);
const cv = document.getElementById("c"), g = cv.getContext("2d");
const COLS = 16, ROWS = 11, SQ = 0.66;
const WHALE_SIZE = 2.1; // ขนาดภาพเทียบลำตัว 5 ช่อง (ผู้ใช้ขยาย 2 รอบ: 1 → 1.5 → 2.1)
let W, H, cs, ox, oy;
const snap = document.createElement("canvas"), sg = snap.getContext("2d");
function resize() {
  W = cv.width = Math.round(innerWidth * DPR); H = cv.height = Math.round(innerHeight * DPR);
  snap.width = W; snap.height = H;
  cv.style.width = innerWidth + "px"; cv.style.height = innerHeight + "px";
  const barH = 70 * DPR, top = 80 * DPR;
  cs = Math.min((W * 0.86) / COLS, (H - barH - top - 40 * DPR) / (ROWS * SQ));
  ox = (W - cs * COLS) / 2; oy = top + (H - barH - top - cs * ROWS * SQ) / 2 + 30 * DPR;
}
addEventListener("resize", resize); resize();
const P = (x, y) => [ox + x * cs, oy + y * cs * SQ];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, k) => a + (b - a) * k;
const ease = (k) => (k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2);
const easeOut = (k) => 1 - Math.pow(1 - k, 3);
const easeIn = (k) => k * k * k;
const rnd = (a, b) => a + Math.random() * (b - a);
const TAU = Math.PI * 2;

// ================================================================ เสียง
let AC = null, MST, REV, NOISE, SFXBUF = {};
const SFX_FILES = Object.fromEntries(
  ["ping", "whoosh", "slap", "rush", "roar", "call", "swirl", "zap", "blast", "gulp", "splash", "spit", "rumble", "boom", "bubbles", "amb"]
    .map((k) => [k, [k + ".mp3", 0, 99, k === "amb" ? 1 : 0.9]]));
function audio() {
  if (AC) return AC;
  AC = new (window.AudioContext || window.webkitAudioContext)();
  MST = AC.createGain(); MST.gain.value = 0.9;
  const comp = AC.createDynamicsCompressor(); comp.threshold.value = -14; comp.ratio.value = 4;
  MST.connect(comp); comp.connect(AC.destination);
  REV = AC.createConvolver(); REV.buffer = impulse(3.8, 2.4);
  const rg = AC.createGain(); rg.gain.value = 0.6; REV.connect(rg); rg.connect(comp);
  const n = AC.sampleRate * 2, b = AC.createBuffer(1, n, AC.sampleRate), d = b.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
  NOISE = b;
  for (const k in SFX_FILES) loadSfx(k);
  return AC;
}
function loadSfx(k) {
  fetch(MEDIA + "sfx/" + SFX_FILES[k][0]).then((r) => (r.ok ? r.arrayBuffer() : Promise.reject()))
    .then((a) => AC.decodeAudioData(a)).then((buf) => { SFXBUF[k] = buf; }).catch(() => {});
}
function playFile(k, t, gain = 1, rate = 1) {
  const buf = SFXBUF[k]; if (!buf) return false;
  const [, ss, dur, vol] = SFX_FILES[k];
  const s = AC.createBufferSource(); s.buffer = buf; s.playbackRate.value = rate;
  const gn = AC.createGain(); const len = Math.min(dur, buf.duration - ss) / rate;
  gn.gain.setValueAtTime(0.0001, t); gn.gain.exponentialRampToValueAtTime(vol * gain, t + 0.01);
  gn.gain.setValueAtTime(vol * gain, t + Math.max(0.02, len - 0.25));
  gn.gain.exponentialRampToValueAtTime(0.0001, t + len);
  s.connect(gn); out(gn, 0.25); s.start(t, ss);
  return true;
}
function impulse(sec, decay) {
  const n = AC.sampleRate * sec, b = AC.createBuffer(2, n, AC.sampleRate);
  for (let c = 0; c < 2; c++) { const d = b.getChannelData(c); for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, decay); }
  return b;
}
function out(node, wet = 0.4) {
  node.connect(MST);
  if (wet > 0) { const w = AC.createGain(); w.gain.value = wet; node.connect(w); w.connect(REV); }
}
function env(gn, t, a, peak, rel) {
  gn.gain.setValueAtTime(0.0001, t);
  gn.gain.exponentialRampToValueAtTime(Math.max(0.0002, peak), t + a);
  gn.gain.exponentialRampToValueAtTime(0.0001, t + a + Math.max(0.02, rel));
}
function noise(t, dur, type, f0, f1, q, peak, a = 0.01, wet = 0.3) {
  const s = AC.createBufferSource(); s.buffer = NOISE; s.loop = true;
  const f = AC.createBiquadFilter(); f.type = type; f.Q.value = q;
  f.frequency.setValueAtTime(f0, t); f.frequency.exponentialRampToValueAtTime(f1, t + dur);
  const gn = AC.createGain(); env(gn, t, a, peak, dur - a);
  s.connect(f); f.connect(gn); out(gn, wet); s.start(t, Math.random()); s.stop(t + dur + 0.1);
  return f;
}
function tone(t, dur, type, f0, f1, peak, a = 0.01, wet = 0.3, lp = 0) {
  const o = AC.createOscillator(); o.type = type;
  o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + dur);
  const gn = AC.createGain(); env(gn, t, a, peak, dur - a);
  let n = o; if (lp) { const f = AC.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = lp; o.connect(f); n = f; }
  n.connect(gn); out(gn, wet); o.start(t); o.stop(t + dur + 0.1);
  return o;
}
function whaleCall(t, dur, base, glide, peak = 0.35, wet = 0.9) {
  const curve = new Float32Array([base, base * (1 + (glide - 1) * 0.6), base * glide, base * glide * 1.04, base * (0.75 + glide * 0.1)]);
  const bp = AC.createBiquadFilter(); bp.type = "bandpass"; bp.Q.value = 2.2;
  bp.frequency.setValueAtTime(base * 3, t); bp.frequency.linearRampToValueAtTime(base * glide * 4, t + dur * 0.6); bp.frequency.linearRampToValueAtTime(base * 2.5, t + dur);
  const lp = AC.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 1400;
  const gn = AC.createGain(); env(gn, t, dur * 0.3, peak, dur * 0.7);
  const lfo = AC.createOscillator(); lfo.frequency.value = 5.5; const lg = AC.createGain(); lg.gain.value = base * 0.025; lfo.connect(lg);
  for (const det of [0.994, 1.006]) {
    const o = AC.createOscillator(); o.type = "sawtooth";
    o.frequency.setValueCurveAtTime(curve.map((v) => v * det), t, dur);
    lg.connect(o.frequency); o.connect(bp); o.start(t); o.stop(t + dur + 0.1);
  }
  const sub = AC.createOscillator(); sub.type = "sine"; sub.frequency.setValueCurveAtTime(curve.map((v) => v / 2), t, dur);
  const sgn = AC.createGain(); sgn.gain.value = 0.6; sub.connect(sgn); sgn.connect(lp); sub.start(t); sub.stop(t + dur + 0.1);
  bp.connect(lp); lp.connect(gn); out(gn, wet);
  lfo.start(t); lfo.stop(t + dur + 0.1);
}
function bubbles(t, n, dur, peak = 0.12) {
  if (n >= 8 && playFile("bubbles", t, Math.min(1, peak * 8))) return;
  for (let i = 0; i < n; i++) {
    const tt = t + Math.random() * dur, f = rnd(280, 900);
    tone(tt, rnd(0.04, 0.09), "sine", f, f * rnd(1.6, 2.4), peak * rnd(0.4, 1), 0.005, 0.35);
  }
}
// ซับเบสกระแทก — เพิ่มน้ำหนักให้ทุกจังหวะปะทะใหญ่
function sub(t, peak = 0.8, f0 = 70) { tone(t, 0.55, "sine", f0, 28, peak, 0.004, 0.15); }
const S = {
  ping(t) { if (playFile("ping", t)) return; tone(t, 1.6, "sine", 1180, 1150, 0.22, 0.004, 1.2); },
  whoosh(t, g = 1, r = 1) { if (playFile("whoosh", t, g, r)) return; noise(t, 0.42, "bandpass", 260, 2200, 1.1, 0.5 * g, 0.06, 0.2); },
  slap(t, g = 1) { if (playFile("slap", t, g)) return; noise(t, 0.18, "lowpass", 1200, 300, 0.7, 0.6 * g, 0.003, 0.2); tone(t, 0.22, "sine", 95, 40, 0.6 * g, 0.003, 0.1); },
  rumble(t, dur = 1.4, peak = 0.5) { if (playFile("rumble", t, Math.min(1.2, peak * 2))) return; noise(t, dur, "lowpass", 140, 55, 0.8, peak, dur * 0.5, 0.3); tone(t, dur, "sine", 44, 36, peak * 0.6, dur * 0.5, 0.1); },
  rush(t) { if (playFile("rush", t)) return; noise(t, 1.1, "bandpass", 300, 1400, 0.9, 0.55, 0.15, 0.2); },
  roar(t, g = 0.9, r = 1) { if (playFile("roar", t, g, r)) return; whaleCall(t, 1.3, 68, 1.35, 0.55, 0.7); },
  call(t, g = 1, r = 1) { if (playFile("call", t, g, r)) return; whaleCall(t, 1.6, 110, 1.4, 0.35 * g); },
  swirl(t, dur = 1.7) {
    if (playFile("swirl", t)) return;
    const f = noise(t, dur, "bandpass", 450, 380, 3, 0.4, 0.25, 0.4);
    const l = AC.createOscillator(); l.frequency.value = 3.2; const lg = AC.createGain(); lg.gain.value = 260; l.connect(lg); lg.connect(f.frequency); l.start(t); l.stop(t + dur);
  },
  charge(t, dur = 1.1) { tone(t, dur, "sawtooth", 60, 700, 0.1, dur * 0.8, 0.4, 1800); tone(t, dur, "sine", 40, 90, 0.35, dur * 0.8, 0.2); for (let i = 0; i < 14; i++) noise(t + rnd(0, dur), 0.03, "highpass", 3500, 3000, 0.7, 0.16, 0.002, 0.2); },
  zap(t, g = 1) { if (playFile("zap", t, g)) return; noise(t, 0.16, "highpass", 2400, 1500, 0.7, 0.55 * g, 0.002, 0.3); },
  blast(t) { if (!playFile("blast", t, 0.9)) S.zap(t); sub(t, 0.7, 90); },
  boom(t, g = 1) { if (!playFile("boom", t, g)) S.rumble(t, 1.2, 0.5); sub(t, 0.9 * g); },
  gulp(t) { if (playFile("gulp", t)) return; tone(t, 0.42, "sine", 230, 42, 0.7, 0.01, 0.4); },
  splash(t, g = 1, r = 1) { if (playFile("splash", t, g, r)) return; noise(t, 0.7, "bandpass", 1700, 380, 0.8, 0.55 * g, 0.005, 0.35); },
  spit(t) { if (!playFile("spit", t)) tone(t, 0.25, "sine", 70, 260, 0.5, 0.01, 0.3); S.splash(t + 0.12, 0.6); },
  song(t) {
    whaleCall(t, 1.4, 170, 1.65, 0.32); whaleCall(t + 1.05, 1.5, 250, 0.62, 0.3); whaleCall(t + 2.2, 1.9, 120, 2.05, 0.36);
    tone(t + 0.3, 3.4, "sine", 900, 1350, 0.03, 1.2, 1.2);
  },
  hit(t) { sub(t, 0.6, 110); S.slap(t, 0.8); S.call(t + 0.08, 0.4, 1.2); },
  appear(t) { S.rumble(t, 2.2, 0.5); bubbles(t + 0.2, 26, 1.6, 0.1); S.splash(t + 1.2, 0.8, 0.7); S.call(t + 1.0); sub(t + 1.2, 0.8, 60); },
  leave(t) { S.call(t, 0.7, 0.9); bubbles(t + 0.4, 14, 1.2, 0.08); },
  death(t) { S.roar(t, 1, 0.8); S.rumble(t + 0.4, 3, 0.5); S.call(t + 1.6, 0.8, 0.7); bubbles(t + 1.4, 30, 2.5, 0.08); S.call(t + 3.2, 0.5, 0.55); },
  heart(t) { tone(t, 1.4, "sine", 660, 990, 0.09, 0.3, 1.2); tone(t + 0.15, 1.4, "sine", 990, 1320, 0.07, 0.3, 1.2); tone(t + 0.3, 1.6, "triangle", 1320, 1980, 0.04, 0.3, 1.4); },
};
function sfx(name, delayMs = 0, ...args) { if (!audio()) return; const t = AC.currentTime + delayMs / 1000 + 0.01; S[name](t, ...args); }

const bgm = new Audio(MEDIA + "bgm.mp3"); bgm.loop = true; bgm.volume = 0.45;
let amb = null;
function ambient(on) {
  audio();
  if (!on) { if (amb) { amb.stop(); amb = null; } return; }
  const t = AC.currentTime, nodes = [];
  const gn = AC.createGain(); gn.gain.setValueAtTime(0.0001, t); gn.gain.exponentialRampToValueAtTime(1, t + 2); gn.connect(MST);
  if (SFXBUF.amb) { const s = AC.createBufferSource(); s.buffer = SFXBUF.amb; s.loop = true; s.connect(gn); s.start(); nodes.push(s); }
  else {
    for (const [f, v] of [[46, 0.06], [69.3, 0.035]]) { const o = AC.createOscillator(); o.frequency.value = f; const v2 = AC.createGain(); v2.gain.value = v; o.connect(v2); v2.connect(gn); o.start(); nodes.push(o); }
  }
  amb = { stop() { gn.gain.setTargetAtTime(0.0001, AC.currentTime, 0.4); setTimeout(() => nodes.forEach((n) => n.stop()), 1500); } };
}

// ================================================================ ภาพปลาวาฬ
const IMG = {};
const NAMES = ["whale_side", "whale_side_34", "whale_front", "whale_top_tail", "whale_turn"];
// สไปรต์หลายมุม — ax/ay = จุดกลางลำตัวในภาพ (สัดส่วน) · mul = ขนาดวาดเทียบภาพด้านข้าง · amp = แรงแกว่งตอนว่าย
// กลับด้าน (ผู้ใช้ติ 2026-11-19 ว่าพลิกภาพแบนดูตลก): ข้าง → เฉียง 3/4 → หันหน้าเข้ากล้อง → เฉียง 3/4 อีกฝั่ง → ข้างอีกฝั่ง
let SPR = {}, WH = null;
function mk(w, h) { const c = document.createElement("canvas"); c.width = w; c.height = h; return { c, g: c.getContext("2d", { willReadFrequently: true }) }; }
function makeSprite(img, SZ, ax, ay, mul, amp) {
  const PAD = Math.round(SZ * 0.1);
  const b = mk(SZ, SZ), s = Math.min(SZ / img.width, SZ / img.height), dw = img.width * s, dh = img.height * s, dx = (SZ - dw) / 2, dy = (SZ - dh) / 2;
  b.g.drawImage(img, dx, dy, dw, dh);
  const d = b.g.getImageData(0, 0, SZ, SZ), m = mk(SZ, SZ), o = m.g.createImageData(SZ, SZ);
  for (let i = 0; i < d.data.length; i += 4) {
    const r = d.data[i], gg = d.data[i + 1], bb = d.data[i + 2], a = d.data[i + 3];
    const c = (gg + bb) / 2 - r;
    if (a > 40 && gg > 120 && bb > 120 && c > 30) { o.data[i] = 70; o.data[i + 1] = 215; o.data[i + 2] = 240; o.data[i + 3] = Math.min(255, (c - 30) * 5) * (a / 255); }
  }
  m.g.putImageData(o, 0, 0);
  const gl = mk(SZ, SZ);
  gl.g.filter = `blur(${Math.max(3, Math.round(SZ / 90))}px)`; gl.g.drawImage(m.c, 0, 0); gl.g.filter = "none";
  gl.g.globalCompositeOperation = "lighter"; gl.g.drawImage(m.c, 0, 0);
  const wm = mk(SZ, SZ); wm.g.drawImage(b.c, 0, 0); wm.g.globalCompositeOperation = "source-in"; wm.g.fillStyle = "#e8ffff"; wm.g.fillRect(0, 0, SZ, SZ);
  return { base: b.c, glow: gl.c, white: wm.c, SZ, PAD, ax: (dx + ax * dw) / SZ, ay: (dy + ay * dh) / SZ, mul, amp,
    o1: mk(SZ, SZ + PAD * 2), o2: mk(SZ, SZ + PAD * 2), om: mk(SZ, SZ + PAD * 2) };
}
function prep() {
  SPR.side = makeSprite(IMG.whale_side, 720, 0.62, 0.57, 1, 1);
  SPR.q = IMG.whale_side_34 ? makeSprite(IMG.whale_side_34, 720, 0.70, 0.64, 1.0, 0.55) : SPR.side;
  SPR.front = IMG.whale_front ? makeSprite(IMG.whale_front, 360, 0.5, 0.52, 0.6, 0.2) : SPR.q;
  WH = SPR.side;
}
function undulate(src, dst, t, amp, speed, SZ = WH.SZ, PAD = WH.PAD) {
  const n = 80, sw = SZ / n;
  dst.g.clearRect(0, 0, dst.c.width, dst.c.height);
  for (let i = 0; i < n; i++) {
    const u = (i + 0.5) / n;
    const k = Math.pow(Math.max(0, 1 - u / 0.97), 1.5);
    const dy = amp * k * Math.sin(t * speed - u * 7.5) + amp * 0.25 * Math.sin(t * speed * 0.5 + u * 3);
    dst.g.drawImage(src, i * sw, 0, sw + 0.8, SZ, i * sw, PAD + dy, sw + 0.8, SZ);
  }
}

// ================================================================ เส้นทางว่าย
const WP = [[-2, 2], [5, 0.4], [11, 1.0], [17, 3.4], [17.8, 7.6], [13, 10.8], [8, 9.3], [4.4, 6.2], [8.4, 4.1], [12.4, 6.1], [9.6, 10.9], [3, 10.5], [-2.2, 6.6]];
let PTS = [], CUM = [], LEN = 0;
(function buildPath() {
  const n = WP.length;
  for (let i = 0; i < n; i++) {
    const p0 = WP[(i - 1 + n) % n], p1 = WP[i], p2 = WP[(i + 1) % n], p3 = WP[(i + 2) % n];
    for (let j = 0; j < 40; j++) {
      const t = j / 40, t2 = t * t, t3 = t2 * t;
      PTS.push([0, 1].map((k) => 0.5 * (2 * p1[k] + (-p0[k] + p2[k]) * t + (2 * p0[k] - 5 * p1[k] + 4 * p2[k] - p3[k]) * t2 + (-p0[k] + 3 * p1[k] - 3 * p2[k] + p3[k]) * t3)));
    }
  }
  CUM = [0];
  for (let i = 1; i <= PTS.length; i++) { const a = PTS[i - 1], b = PTS[i % PTS.length]; CUM.push(CUM[i - 1] + Math.hypot(b[0] - a[0], b[1] - a[1])); }
  LEN = CUM[PTS.length];
})();
function pathAt(s) {
  s = ((s % LEN) + LEN) % LEN;
  let lo = 0, hi = PTS.length - 1;
  while (lo < hi) { const mid = (lo + hi + 1) >> 1; if (CUM[mid] <= s) lo = mid; else hi = mid - 1; }
  const a = PTS[lo], b = PTS[(lo + 1) % PTS.length], f = (s - CUM[lo]) / (CUM[lo + 1] - CUM[lo] || 1);
  return [lerp(a[0], b[0], f), lerp(a[1], b[1], f)];
}

// ================================================================ สถานะ

// type: bub (ฟอง) · sand (ตะกอน ตกลง) · spark (เส้นประกาย บวกแสง) · drop (ละอองน้ำ) · glow (จุดเรืองแสง) · streak (เส้นความเร็ว)

// พื้นแตก: กิ่งรอยร้าวในพิกัดช่อง
function crack(x, y, n = 7, len = 2.4, life = 2600) {
  const segs = [];
  const grow = (px, py, a, l, depth) => {
    let cx = px, cy = py;
    const steps = Math.max(2, Math.round(l * 3));
    for (let i = 0; i < steps; i++) {
      const nx = cx + Math.cos(a) * (l / steps), ny = cy + Math.sin(a) * (l / steps) / SQ * 0.75;
      segs.push([cx, cy, nx, ny, depth, i / steps]); cx = nx; cy = ny; a += rnd(-0.5, 0.5);

  for (let i = 0; i < n; i++) grow(x, y, (i / n) * TAU + rnd(-0.3, 0.3), len * rnd(0.6, 1.2), 0);

  if (whale.ghost) { whale.trail.push({ x: whale.x, y: whale.y, z: whale.z, rot: whale.rot, facing: whale.facing, scale: whale.scale }); if (whale.trail.length > 6) whale.trail.shift(); } else whale.trail.length = 0;
  whale.glowBoost = Math.max(0, whale.glowBoost - dt * 1.1);
  whale.flash = Math.max(0, whale.flash - dt * 3);
  for (const u of units) {
    u.dx += (u.x - u.dx) * Math.min(1, dt * 8); u.dy += (u.y - u.dy) * Math.min(1, dt * 8);
    u.hit = Math.max(0, u.hit - dt * 4); u.lift = Math.max(0, u.lift - dt * 1.8); u.shock = Math.max(0, u.shock - dt * 1.2);
  }
}
function updateCam(dt) {
  cam.shake = Math.max(0, cam.shake - dt * 45);
  cam.z += (cam.tz - cam.z) * Math.min(1, dt * 4);
  cam.fx += (cam.tfx - cam.fx) * Math.min(1, dt * 3); cam.fy += (cam.tfy - cam.fy) * Math.min(1, dt * 3);
  post.flash = Math.max(0, post.flash - dt * 2.4);
  post.dim += (post.tdim - post.dim) * Math.min(1, dt * 3);
  post.box += (post.tbox - post.box) * Math.min(1, dt * 5);
  post.zoomBlur = Math.max(0, post.zoomBlur - dt * 2.5);
}
let last = 0;
function frame(ts) {
  const rdt = Math.min(0.05, (ts - last) / 1000 || 0); last = ts; now = ts;
  const stopped = now < hitstopUntil, dt = stopped ? 0 : rdt;
  clock += dt * 1000; const t = clock / 1000;
  runTimers(); update(dt, t); updateCam(rdt);
  g.setTransform(1, 0, 0, 1, 0, 0);
  drawBg(t);
  // กล้อง
  const sx = rnd(-cam.shake, cam.shake) * DPR * 0.6, sy = rnd(-cam.shake, cam.shake) * DPR * 0.6;
  g.setTransform(cam.z, 0, 0, cam.z, cam.fx * (1 - cam.z) + sx, cam.fy * (1 - cam.z) + sy);
  drawBoard(t); drawCracks(); drawTele(); drawFootprint();
  for (const f of FX) if (f.layer === "floor") { const k = (clock - f.t0) / f.dur; if (k >= 0 && k < 1) { g.save(); f.draw(k); g.restore(); } }
  drawUnits(t); drawWhale(t);
  for (const f of FX) if (f.layer === "top") { const k = (clock - f.t0) / f.dur; if (k >= 0 && k < 1) { g.save(); f.draw(k); g.restore(); } }
  for (let i = FX.length - 1; i >= 0; i--) if ((clock - FX[i].t0) / FX[i].dur >= 1) FX.splice(i, 1);
  drawParticles(dt);
  g.setTransform(1, 0, 0, 1, 0, 0);
  drawSnow(dt);
  postFx(); drawHud();
  requestAnimationFrame(frame);
}

// ================================================================ ปุ่ม
function busy() { return !!whale.ovr || !whale.visible || whale.dead; }
const ACT = {
  appear() {
    if (whale.visible && !whale.dead) return;
    whale.dead = false; whale.visible = true; whale.hp = whale.hpMax; whale.hpShown = whale.hpMax; whale.glowBoost = 2;
    sfx("appear"); post.tdim = 0.4; after(1600, () => (post.tdim = 0));
    const p0 = pathAt(whale.s), [px, py] = P(p0[0], p0[1]);
    crack(p0[0], p0[1], 8, 2.4, 2800); bubbleBurst(px, py, 50, cs * 2.5);
    addFx(2400, "top", (k) => { cam.shake = Math.max(cam.shake, 4 * (1 - k)); if (Math.random() < 0.5) sandPlume(px + rnd(-cs * 2, cs * 2), py, 1, cs * 2); });
    after(1200, () => { kick({ shake: 18, flash: 0.35, col: "170,240,255", zoom: 0.04, fx: px, fy: py, blur: 0.6 }); spray(px, py, 70, cs * 9); });
    setOvr((el) => {
      const k = clamp(el / 2400, 0, 1), p = pathAt(whale.s);
      whale.x = p[0]; whale.y = p[1]; whale.alpha = clamp(k * 1.6, 0, 1); whale.z = lerp(-1, 0.9, easeOut(k)); whale.scale = lerp(0.8, 1, easeOut(k));
      return el >= 2400;
    });
  },
  leave() {
    if (busy()) return;
    sfx("leave");
    setOvr((el) => {
      const k = clamp(el / 2000, 0, 1); whale.s += 0.03; const p = pathAt(whale.s); whale.x = p[0]; whale.y = p[1];
      whale.alpha = 1 - k; whale.z = lerp(0.9, -0.8, ease(k));
      if (Math.random() < 0.3) { const [wx, wy] = whaleScreen(); bubbleBurst(wx, wy, 2, cs); }
      if (k >= 1) whale.visible = false;
      return k >= 1;
    });
  },
  turn() { if (busy()) return; whale.free = false; document.getElementById("bFree").classList.remove("on"); whale.tw = { a: whale.s, b: whale.s + 4, t0: clock }; sfx("whoosh", 0, 0.6, 0.8); },
  free() { whale.free = !whale.free; document.getElementById("bFree").classList.toggle("on", whale.free); },
  hit() {
    if (busy()) return;
    const d = 5; whale.hp -= d; whale.flash = 1; sfx("hit");
    const [sx, sy] = whaleScreen();
    kick({ shake: 10, stop: 80, zoom: 0.02, fx: sx, fy: sy });
    floater(whale.x, whale.y - 1.8, "-" + d, "#ffffff", true);
    sparks(sx, sy, 24, cs * 6, "160,250,255"); glows(sx, sy, 10, cs * 0.8); bubbleBurst(sx, sy, 12, cs * 0.8);
    if (whale.hp <= 0) die();
  },
  fierce() { fierce = !fierce; document.getElementById("bFierce").classList.toggle("on", fierce); },
  bgm() { const b = document.getElementById("bBgm"); if (bgm.paused) { bgm.play(); b.classList.add("on"); } else { bgm.pause(); b.classList.remove("on"); } },
  amb() { const b = document.getElementById("bAmb"); const on = !amb; ambient(on); b.classList.toggle("on", on); },
  reset() { resetUnits(); whale.hp = whale.hpMax; if (!whale.visible || whale.dead) { whale.dead = false; ACT.appear(); } },
};
function die() {
  whale.dead = true; sfx("death");
  post.tdim = 0.4; post.tbox = 1;
  const hx = whale.x, hy = whale.y;
  setOvr((el) => {
    const k = clamp(el / 4600, 0, 1);
    // ชักกระตุก → เส้นเลือดดับเป็นจังหวะ → จมลงช้าๆ
    if (k < 0.35) { whale.flash = Math.random() < 0.15 ? 0.8 : whale.flash; whale.glowBoost = Math.random() < 0.3 ? 2 : 0; cam.shake = Math.max(cam.shake, 6); whale.amp = 2.2; }
    else { whale.amp = lerp(2.2, 0.2, (k - 0.35) / 0.65); whale.glowBoost = 0; }
    whale.alpha = k < 0.35 ? 1 : 1 - ease((k - 0.35) / 0.65); whale.z = k < 0.35 ? 0.9 : lerp(0.9, -1.4, ease((k - 0.35) / 0.65)); whale.rot += 0.0015 * whale.facing;
    if (Math.random() < 0.4) { const [sx, sy] = whaleScreen(); bubbleBurst(sx + rnd(-cs * 3, cs * 3), sy, 2, cs * 0.5); glows(sx + rnd(-cs * 3, cs * 3), sy, 1, cs * 0.3); }
    if (k >= 1) { whale.visible = false; whale.amp = 1; post.tdim = 0; post.tbox = 0; }
    return k >= 1;
  });
  after(400, () => kick({ shake: 20, flash: 0.4, col: "160,240,255", stop: 160, blur: 0.8 }));
  // หัวใจของท้องทะเล
  after(2600, () => {
    sfx("heart");
    const [sx0, sy0] = P(hx, hy);
    kick({ flash: 0.5, col: "120,220,255" }); glows(sx0, sy0, 30, cs * 1.5);
    addFx(4000, "top", (k) => {
      const yy = sy0 - cs * (0.6 + 2.2 * easeOut(Math.min(1, k * 1.5))); const r = cs * 0.45 * (1 + 0.12 * Math.sin(clock / 120));
      g.globalAlpha = k > 0.8 ? (1 - k) / 0.2 : 1; g.globalCompositeOperation = "lighter";
      // ลำแสงหมุน
      g.save(); g.translate(sx0, yy); g.rotate(clock / 1500);
      for (let i = 0; i < 8; i++) { g.rotate(TAU / 8); const lg = g.createLinearGradient(0, 0, cs * 4, 0); lg.addColorStop(0, "rgba(150,240,255,0.35)"); lg.addColorStop(1, "rgba(150,240,255,0)"); g.fillStyle = lg; g.beginPath(); g.moveTo(0, 0); g.lineTo(cs * 4, -cs * 0.25); g.lineTo(cs * 4, cs * 0.25); g.fill(); }
      g.restore();
      const gr = g.createRadialGradient(sx0, yy, 0, sx0, yy, r * 4); gr.addColorStop(0, "rgba(200,255,255,0.95)"); gr.addColorStop(0.3, "rgba(60,200,255,0.5)"); gr.addColorStop(1, "rgba(0,120,255,0)");
      g.fillStyle = gr; g.beginPath(); g.arc(sx0, yy, r * 4, 0, TAU); g.fill();
      g.globalCompositeOperation = "source-over"; g.font = `${Math.round(r * 2)}px sans-serif`; g.textAlign = "center"; g.textBaseline = "middle"; g.fillText("💙", sx0, yy);
      if (Math.random() < 0.3) glows(sx0, yy, 1, r * 2);
    });
  });
}
function attack(name) {
  if (busy()) return;
  audio(); ATK[name]();
  if (fierce) {
    const others = ["tentacle", "whirl", "zap", "song"].filter((k) => k !== name);
    const second = others[Math.floor(Math.random() * others.length)];
    after(2200, () => { if (!whale.dead && whale.visible && !whale.ovr) ATK[second](); });
  }
}
document.getElementById("bar").addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return; audio(); if (AC.state === "suspended") AC.resume();
  const a = b.dataset.a; if (ATK[a]) attack(a); else ACT[a] && ACT[a]();
});
addEventListener("keydown", (e) => { const m = { 1: "tentacle", 2: "charge", 3: "whirl", 4: "zap", 5: "song", 6: "swallow" }[e.key]; if (m) { audio(); attack(m); } });
window.__thalassa = { ATK, ACT, whale };

Promise.all(NAMES.map((n) => new Promise((r) => { const i = new Image(); i.onload = () => { IMG[n] = i; r(); }; i.onerror = () => r(); i.src = MEDIA + n + ".webp"; })))
  .then(() => { if (IMG.whale_side) prep(); requestAnimationFrame(frame); });
</script>
